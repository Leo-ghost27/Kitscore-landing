<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  :root{
    --pf-blue:#2755F0; --pf-blue-deep:#0B2A6B; --pf-teal:#17B8A6;
    --pf-ink:#0B1220; --pf-ink-soft:#5B6472; --pf-ink-faint:#9AA3B2; --pf-line:#E6E9F0;
    --pf-radius:16px; --pf-shadow:0 1px 2px rgba(11,18,32,0.04), 0 8px 24px rgba(11,18,32,0.06);
  }
  body{background:var(--canvas);font-family:'Space Grotesk',sans-serif}
  .app-main{max-width:1180px;padding:40px 48px 80px}
  .msg{font-size:12px;margin-top:8px;padding:10px 12px;border-radius:8px;font-family:'Inter',sans-serif}
  .msg.error{background:#FDECEC;color:#B42318}
  .msg.ok{background:#E9F7EE;color:#137C52}

  .pf-card{background:#fff;border:1px solid var(--pf-line);border-radius:var(--pf-radius);padding:24px 26px;box-shadow:var(--pf-shadow);margin-bottom:16px;opacity:0;animation:panelIn .25s ease forwards}
  @keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.pf-card{animation:none;opacity:1}}
  .pf-card h3{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:4px}
  .pf-card .desc{color:var(--pf-ink-soft);font-size:12.5px;line-height:1.6;margin-bottom:16px;font-family:'Inter',sans-serif}
  .pf-btn-save{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:600;font-size:12.5px;box-shadow:0 6px 18px rgba(39,85,240,.28);cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
  .pf-btn-save:disabled{opacity:.6}
  .pf-field{display:flex;flex-direction:column;gap:5px;font-family:'Inter',sans-serif;margin-bottom:12px}
  .pf-field label{font-size:11.5px;font-weight:600;color:var(--pf-ink-soft)}
  .pf-field input,.pf-field select,.pf-field textarea{padding:9px 12px;border:1px solid var(--pf-line);border-radius:10px;font-size:13px;font-family:inherit}
  .pf-field textarea{resize:vertical;min-height:56px}

  .empty-state{text-align:center;padding:50px 20px;color:var(--pf-ink-soft);font-family:'Inter',sans-serif}
  .empty-state svg{opacity:.3;margin-bottom:12px}
  .empty-state .t{font-size:14px;font-weight:600;color:var(--pf-ink);margin-bottom:6px;font-family:'Fraunces',serif}
  .empty-state .s{font-size:12.5px;max-width:340px;margin:0 auto}

  /* Hero -- matches app/agency.html's hero banner for visual parity across
     the manager workspace. Pipeline has no "score" concept, so this is a
     simplified variant: eyebrow/title/subtitle + add-deal action + the
     3 summary stats as translucent tiles, no score ring. */
  .hero{position:relative;background:linear-gradient(135deg,#0B2A6B 0%,#142B63 55%,#0E3350 100%);border-radius:20px;padding:32px 36px;margin-bottom:22px;color:#fff;overflow:hidden}
  .hero-bg{position:absolute;inset:0;opacity:.08;pointer-events:none}
  .hero-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:24px}
  .hero-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9DB4F0;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .hero-eyebrow::before{content:"";width:6px;height:6px;background:var(--pf-teal);border-radius:50%}
  .hero-title{font-family:'Fraunces',serif;font-size:28px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
  .hero-sub{font-size:13.5px;color:#C7D2E8;max-width:440px;line-height:1.6;font-family:'Inter',sans-serif}
  .hero-add-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .hero-add-btn:hover{background:rgba(255,255,255,.16)}
  .hero-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 16px}
  .hstat .v{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
  .hstat .l{font-size:11px;color:#9DB4E8;margin-top:2px;font-family:'Inter',sans-serif}
  @media(max-width:640px){.hero-stats{grid-template-columns:1fr}}

  /* Board -- Kanban-specific, styled to sit alongside the roster-card
     language (Fraunces values, IBM Plex Mono chips, same radius/shadow) */
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px}
  .col{flex:0 0 240px;display:flex;flex-direction:column;min-height:120px}
  .col-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;font-family:'Inter',sans-serif}
  .col-title{font-size:10.5px;font-weight:700;color:var(--pf-ink-faint);text-transform:uppercase;letter-spacing:.03em}
  .col-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;color:var(--pf-blue-deep);background:#EEF2FF;border-radius:8px;padding:1px 7px}
  .col-value{font-size:10.5px;color:var(--pf-ink-faint);padding:0 4px 8px;font-family:'IBM Plex Mono',monospace}
  .col-drop{flex:1;background:rgba(230,233,240,.4);border-radius:12px;padding:8px;min-height:100px;transition:background .15s ease}
  .col-drop.drag-over{background:rgba(39,85,240,.1);outline:2px dashed var(--pf-blue)}

  .deal-card{background:#fff;border:1px solid var(--pf-line);border-radius:var(--pf-radius);box-shadow:var(--pf-shadow);padding:14px 15px;margin-bottom:8px;cursor:grab;font-family:'Inter',sans-serif;transition:transform .15s ease,box-shadow .15s ease}
  .deal-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(16,21,31,.14)}
  .deal-card:active{cursor:grabbing}
  .deal-card.dragging{opacity:.4}
  .deal-brand{font-size:13px;font-weight:600;color:var(--pf-ink);font-family:'Fraunces',serif}
  .deal-creator{font-size:11.5px;color:var(--pf-ink-soft);margin-top:1px}
  .deal-fee{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--pf-blue-deep);margin-top:8px;font-weight:600}
  .deal-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px;padding-top:8px;border-top:1px solid var(--pf-line)}
  .deal-deadline{font-size:10.5px;color:var(--pf-ink-faint)}
  .deal-deadline.overdue{color:#B42318;font-weight:700}
  .deal-action{font-size:10.5px;color:var(--pf-ink-soft);margin-top:6px;line-height:1.4}
  .deal-linked{font-size:10px;font-weight:700;color:var(--pf-teal);background:rgba(23,184,166,.1);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:6px}

  .badge-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
  .pill-overdue{background:#FDECEC;color:#B42318;border:1px solid #F6C9C3}

  .empty-col{font-size:11px;color:var(--pf-ink-faint);text-align:center;padding:16px 4px;font-family:'Inter',sans-serif}

  .modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:var(--pf-radius);padding:26px;max-width:420px;width:100%;font-family:'Inter',sans-serif;max-height:90vh;overflow-y:auto;box-shadow:var(--pf-shadow)}
  .modal h3{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-bottom:16px}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
  .modal-btn-cancel{background:none;border:none;color:var(--pf-ink-soft);font-size:12.5px;cursor:pointer;font-weight:600}
  .modal-btn-delete{background:#FDECEC;color:#B42318;border:none;padding:10px 16px;border-radius:10px;font-weight:600;font-size:12.5px;cursor:pointer}

  .link-box{border:1px solid var(--pf-line);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:#F8F9FC}
  .link-box-title{font-size:11.5px;font-weight:700;color:var(--pf-ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
  .linked-contract-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .linked-contract-status{font-size:12px;font-weight:600;color:var(--pf-teal)}
  .link-unlink-btn{background:none;border:none;color:var(--pf-ink-soft);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline}
  .link-sync-btn{background:#fff;border:1px solid var(--pf-line);color:var(--pf-blue-deep);font-size:11px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount" class="sidebar"></div>
  <main class="app-main">
    <div id="content">
      <div style="font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--ink)">Pipeline</div>
      <div style="font-size:13.5px;color:var(--ink-soft);margin-top:4px;font-family:'Inter',sans-serif">Loading…</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="nav.js?v=4"></script>
<script>
let profile, manager, creators = [], deals = [];
let editingDeal = null;
let dragDealId = null;

const STAGES = [
  ['lead', 'Lead'],
  ['outreach_sent', 'Outreach Sent'],
  ['negotiating', 'Negotiating'],
  ['contract_pending', 'Contract Pending'],
  ['in_production', 'In Production'],
  ['awaiting_approval', 'Awaiting Approval'],
  ['published', 'Published'],
  ['invoiced', 'Invoiced'],
  ['paid', 'Paid'],
];

async function load() {
  profile = await requireRole('manager');
  if (!profile) return;
  renderSidebar('manager', 'pipeline');

  const { data: mgrRow } = await sb.rpc('fn_ensure_manager_row');
  manager = mgrRow || { plan: 'manager' };

  await loadCreators();
  await loadDeals();
  render();
}

async function loadCreators() {
  const { data } = await sb.from('manager_creator_links')
    .select('creator_id, creators(profiles(display_name))')
    .eq('manager_id', manager.id)
    .eq('status', 'active');
  creators = (data || []).map(l => ({ id: l.creator_id, name: l.creators?.profiles?.display_name || 'Creator' }));
}

async function loadDeals() {
  const { data, error } = await sb.from('manager_deal_pipeline')
    .select('*, creators(profiles(display_name)), contracts(status, escrow_status, escrow_amount_cents, deliverable_submitted_at, released_at)')
    .eq('manager_id', manager.id)
    .order('updated_at', { ascending: false });
  deals = error ? [] : (data || []);
}

function fmtMoney(cents) {
  if (cents == null) return '';
  return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtDeadline(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const overdue = d < today;
  const label = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return { label, overdue };
}

function render() {
  if (!creators.length) {
    document.getElementById('content').innerHTML = `
      ${renderHero(0, 0, 0)}
      <div class="pf-card">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8" r="3.6"/><path d="M2.4 20.5c0-3.6 3-6.1 6.6-6.1s6.6 2.5 6.6 6.1"/></svg>
          <div class="t">No creators linked yet</div>
          <div class="s">Ask a creator to invite you from their Profile page — the Manager section under Account settings — before you can track deals for them.</div>
        </div>
      </div>`;
    return;
  }

  const totalPipelineValue = deals.filter(d => !['paid'].includes(d.stage)).reduce((s, d) => s + (d.fee_cents || 0), 0);
  const totalPaid = deals.filter(d => d.stage === 'paid').reduce((s, d) => s + (d.fee_cents || 0), 0);

  document.getElementById('content').innerHTML = `
    ${renderHero(deals.length, totalPipelineValue, totalPaid)}
    <div class="board" id="board">
      ${STAGES.map(([key, label]) => renderColumn(key, label)).join('')}
    </div>
  `;
  attachDnd();
}

function renderHero(dealCount, pipelineValue, paidValue) {
  return `
    <div class="hero">
      <svg class="hero-bg" width="100%" height="100%" preserveAspectRatio="none"><circle cx="92%" cy="8%" r="120" fill="#3E63F5"></circle><circle cx="10%" cy="100%" r="90" fill="#17B8A6"></circle></svg>
      <div class="hero-top">
        <div>
          <div class="hero-eyebrow">Manager account</div>
          <div class="hero-title">Pipeline</div>
          <div class="hero-sub">Track deals from first outreach through payment. Drag cards between stages.</div>
        </div>
        <button class="hero-add-btn" onclick="openDealModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add deal
        </button>
      </div>
      <div class="hero-stats">
        <div class="hstat"><div class="v">${dealCount}</div><div class="l">Total deals</div></div>
        <div class="hstat"><div class="v">${fmtMoney(pipelineValue) || '$0'}</div><div class="l">In pipeline</div></div>
        <div class="hstat"><div class="v">${fmtMoney(paidValue) || '$0'}</div><div class="l">Paid</div></div>
      </div>
    </div>`;
}

function renderColumn(stageKey, stageLabel) {
  const colDeals = deals.filter(d => d.stage === stageKey);
  const colValue = colDeals.reduce((s, d) => s + (d.fee_cents || 0), 0);
  return `
    <div class="col">
      <div class="col-head">
        <div class="col-title">${stageLabel}</div>
        <div class="col-count">${colDeals.length}</div>
      </div>
      ${colValue ? `<div class="col-value">${fmtMoney(colValue)}</div>` : ''}
      <div class="col-drop" data-stage="${stageKey}">
        ${!colDeals.length ? '<div class="empty-col">No deals</div>' : colDeals.map(d => renderCard(d)).join('')}
      </div>
    </div>`;
}

function renderCard(d) {
  const creatorName = d.creators?.profiles?.display_name || 'Creator';
  const dl = fmtDeadline(d.deadline);
  const linkChip = d.contract_id
    ? `<div class="deal-linked">🔗 ${contractStatusLabel(d.contracts)}</div>`
    : '';
  return `
    <div class="deal-card" draggable="true" data-deal-id="${d.id}" onclick="openDealModal('${d.id}')">
      <div class="deal-brand">${escapeHtml(d.brand_name)}</div>
      <div class="deal-creator">${escapeHtml(creatorName)}</div>
      ${linkChip}
      <div class="deal-meta">
        ${d.fee_cents != null ? `<div class="deal-fee">${fmtMoney(d.fee_cents)}</div>` : '<div></div>'}
        ${dl ? `<div class="deal-deadline ${dl.overdue ? 'overdue' : ''}">${dl.overdue ? '<span class="badge-pill pill-overdue">Overdue</span> ' : ''}${dl.label}</div>` : ''}
      </div>
      ${d.next_action ? `<div class="deal-action">${escapeHtml(d.next_action)}</div>` : ''}
    </div>`;
}

function contractStatusLabel(c) {
  if (!c) return 'Linked contract';
  if (c.released_at) return 'Paid out';
  if (c.deliverable_submitted_at) return 'Awaiting approval';
  if (c.escrow_status === 'held') return 'In production';
  if (c.status === 'fully_signed') return 'Signed, escrow pending';
  return c.status ? c.status.replace(/_/g, ' ') : 'Linked';
}

function suggestedStageFor(c) {
  if (!c) return null;
  if (c.released_at) return 'paid';
  if (c.deliverable_submitted_at) return 'awaiting_approval';
  if (c.escrow_status === 'held') return 'in_production';
  if (c.status === 'fully_signed') return 'contract_pending';
  return null;
}

function attachDnd() {
  document.querySelectorAll('.deal-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragDealId = card.dataset.dealId;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  document.querySelectorAll('.col-drop').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const newStage = col.dataset.stage;
      if (!dragDealId) return;
      const deal = deals.find(d => d.id === dragDealId);
      if (!deal || deal.stage === newStage) return;
      deal.stage = newStage; // optimistic
      render();
      const { error } = await sb.from('manager_deal_pipeline').update({ stage: newStage }).eq('id', dragDealId);
      if (error) { await loadDeals(); render(); alert('Could not move deal: ' + error.message); }
      dragDealId = null;
    });
  });
}

function openDealModal(dealId) {
  editingDeal = dealId ? deals.find(d => d.id === dealId) : null;
  const d = editingDeal || {};
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-backdrop" id="dealModalBackdrop" onclick="if(event.target===this) closeDealModal()">
      <div class="modal">
        <h3>${editingDeal ? 'Edit deal' : 'Add deal'}</h3>
        ${editingDeal ? `<div id="linkSection">${renderLinkSection(d)}</div>` : ''}
        <div class="pf-field"><label>Creator</label>
          <select id="mCreator" ${editingDeal ? 'disabled' : ''}>
            ${creators.map(c => `<option value="${c.id}" ${d.creator_id === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="pf-field"><label>Brand / sponsor name</label><input id="mBrand" type="text" value="${escapeHtml(d.brand_name || '')}" placeholder="e.g. Glow Skincare Co."></div>
        <div class="pf-field"><label>Stage</label>
          <select id="mStage">${STAGES.map(([k,l]) => `<option value="${k}" ${(d.stage || 'lead') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        </div>
        <div class="pf-field"><label>Fee (£)</label><input id="mFee" type="number" min="0" step="1" value="${d.fee_cents != null ? (d.fee_cents/100) : ''}" placeholder="e.g. 1500"></div>
        <div class="pf-field"><label>Deadline</label><input id="mDeadline" type="date" value="${d.deadline || ''}"></div>
        <div class="pf-field"><label>Next action</label><input id="mNextAction" type="text" value="${escapeHtml(d.next_action || '')}" placeholder="e.g. Follow up on rate counter"></div>
        <div class="pf-field"><label>Contact name</label><input id="mContactName" type="text" value="${escapeHtml(d.contact_name || '')}"></div>
        <div class="pf-field"><label>Contact email</label><input id="mContactEmail" type="email" value="${escapeHtml(d.contact_email || '')}"></div>
        <div class="pf-field"><label>Notes</label><textarea id="mNotes">${escapeHtml(d.notes || '')}</textarea></div>
        <div id="dealModalMsg"></div>
        <div class="modal-actions">
          <div>
            <button class="modal-btn-cancel" onclick="closeDealModal()">Cancel</button>
            ${editingDeal ? `<button class="modal-btn-delete" style="margin-left:10px" onclick="deleteDeal('${d.id}')">Delete</button>` : ''}
          </div>
          <button class="pf-btn-save" onclick="saveDeal()">${editingDeal ? 'Save' : 'Add deal'}</button>
        </div>
      </div>
    </div>`);
  if (editingDeal && !editingDeal.contract_id) {
    loadLinkPicker(editingDeal.id, editingDeal.creator_id);
  }
}

function renderLinkSection(d) {
  if (d.contract_id) {
    const c = d.contracts;
    const suggested = suggestedStageFor(c);
    return `
      <div class="link-box">
        <div class="link-box-title">Linked contract</div>
        <div class="linked-contract-row">
          <div>
            <div class="linked-contract-status">${contractStatusLabel(c)}</div>
            ${c?.escrow_amount_cents != null ? `<div style="font-size:11px;color:var(--pf-ink-soft);margin-top:2px">${fmtMoney(c.escrow_amount_cents)} escrow</div>` : ''}
          </div>
          <button class="link-unlink-btn" onclick="unlinkContract('${d.id}')">Unlink</button>
        </div>
        ${suggested && suggested !== d.stage ? `<button class="link-sync-btn" onclick="syncStageFromContract('${d.id}', '${suggested}')">Sync pipeline stage to match contract →</button>` : ''}
      </div>`;
  }
  return `
    <div class="link-box" id="linkPickerBox">
      <div class="link-box-title">Link to an existing contract</div>
      <div style="font-size:11px;color:var(--pf-ink-soft)">Loading this creator's contracts…</div>
    </div>`;
}

async function loadLinkPicker(dealId, creatorId) {
  const { data, error } = await sb.rpc('fn_manager_linkable_contracts', { p_creator_id: creatorId });
  const box = document.getElementById('linkPickerBox');
  if (!box) return; // modal closed before this resolved
  if (error) { box.innerHTML = `<div class="link-box-title">Link to an existing contract</div><div class="msg error">${escapeHtml(error.message)}</div>`; return; }
  const available = (data || []).filter(c => !c.already_linked_to_deal_id);
  if (!available.length) {
    box.innerHTML = `<div class="link-box-title">Link to an existing contract</div><div style="font-size:11.5px;color:var(--pf-ink-soft)">No unlinked contracts found for this creator yet. Once the sponsor sends a contract, it'll show up here to link.</div>`;
    return;
  }
  box.innerHTML = `
    <div class="link-box-title">Link to an existing contract</div>
    <select id="contractPicker" style="width:100%;padding:9px 12px;border:1px solid var(--pf-line);border-radius:10px;font-size:12.5px;font-family:'Inter',sans-serif;margin-bottom:8px">
      ${available.map(c => `<option value="${c.contract_id}">${escapeHtml(c.title)} — ${c.status.replace(/_/g,' ')}${c.escrow_amount_cents != null ? ` (${fmtMoney(c.escrow_amount_cents)})` : ''}</option>`).join('')}
    </select>
    <button class="link-sync-btn" onclick="linkContract('${dealId}', document.getElementById('contractPicker').value)">Link contract</button>`;
}

async function linkContract(dealId, contractId) {
  const { error } = await sb.from('manager_deal_pipeline').update({ contract_id: contractId }).eq('id', dealId);
  if (error) { showDealModalMsg(error.message); return; }
  await loadDeals();
  editingDeal = deals.find(d => d.id === dealId);
  const section = document.getElementById('linkSection');
  if (section) section.innerHTML = renderLinkSection(editingDeal);
  render();
}

async function unlinkContract(dealId) {
  const { error } = await sb.from('manager_deal_pipeline').update({ contract_id: null }).eq('id', dealId);
  if (error) { showDealModalMsg(error.message); return; }
  await loadDeals();
  editingDeal = deals.find(d => d.id === dealId);
  const section = document.getElementById('linkSection');
  if (section) { section.innerHTML = renderLinkSection(editingDeal); loadLinkPicker(dealId, editingDeal.creator_id); }
  render();
}

async function syncStageFromContract(dealId, newStage) {
  const { error } = await sb.from('manager_deal_pipeline').update({ stage: newStage }).eq('id', dealId);
  if (error) { showDealModalMsg(error.message); return; }
  closeDealModal();
  await loadDeals();
  render();
}

function closeDealModal() {
  const el = document.getElementById('dealModalBackdrop');
  if (el) el.remove();
  editingDeal = null;
}

async function saveDeal() {
  const brand = document.getElementById('mBrand').value.trim();
  if (!brand) { showDealModalMsg('Brand / sponsor name is required.'); return; }
  const feeVal = document.getElementById('mFee').value;
  const payload = {
    brand_name: brand,
    stage: document.getElementById('mStage').value,
    fee_cents: feeVal ? Math.round(Number(feeVal) * 100) : null,
    deadline: document.getElementById('mDeadline').value || null,
    next_action: document.getElementById('mNextAction').value.trim() || null,
    contact_name: document.getElementById('mContactName').value.trim() || null,
    contact_email: document.getElementById('mContactEmail').value.trim() || null,
    notes: document.getElementById('mNotes').value.trim() || null,
  };

  let error;
  if (editingDeal) {
    ({ error } = await sb.from('manager_deal_pipeline').update(payload).eq('id', editingDeal.id));
  } else {
    payload.creator_id = document.getElementById('mCreator').value;
    payload.manager_id = manager.id;
    ({ error } = await sb.from('manager_deal_pipeline').insert(payload));
  }
  if (error) { showDealModalMsg(error.message); return; }
  closeDealModal();
  await loadDeals();
  render();
}

async function deleteDeal(id) {
  if (!confirm('Delete this deal from the pipeline?')) return;
  const { error } = await sb.from('manager_deal_pipeline').delete().eq('id', id);
  if (error) { showDealModalMsg(error.message); return; }
  closeDealModal();
  await loadDeals();
  render();
}

function showDealModalMsg(text) {
  const el = document.getElementById('dealModalMsg');
  if (el) el.innerHTML = `<div class="msg error">${escapeHtml(text)}</div>`;
}

load();
</script>
</body>
</html>
