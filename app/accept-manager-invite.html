<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Invite — Kitscore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  body{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--color-background-tertiary)}
  .card{width:360px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:24px}
  .card h1{font-size:17px;font-weight:500;margin-bottom:4px}
  .card p{font-size:12px;color:var(--color-text-secondary);margin-bottom:16px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
  .field input{width:100%;padding:9px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-sm);font-size:13px}
  .submit{width:100%;padding:10px;background:#2563EB;color:#fff;border:none;border-radius:var(--border-radius-sm);font-size:13px;font-weight:500;cursor:pointer;margin-top:4px}
  .submit:disabled{opacity:.6;cursor:default}
  .msg{font-size:11px;margin-top:10px;padding:9px;border-radius:0}
  .msg.error{background:#FDECEC;color:#B42318}
  .msg.ok{background:#E9F7EE;color:#1C7C3F}
  .loading{font-size:12px;color:var(--color-text-secondary);text-align:center;padding:20px}
  .creator-name{font-weight:500;color:#2563EB}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="loading">Verifying invite…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script>
let invite, creatorName, inviteToken;

async function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (!token) { showError('Invalid invite link.'); return; }
  inviteToken = token;

  // Same SECURITY DEFINER RPC pattern as fn_lookup_team_invite -- a plain
  // RLS SELECT-by-token would let anyone enumerate every pending invite.
  const { data: rows, error } = await sb.rpc('fn_lookup_manager_invite', { p_token: token });
  const data = rows && rows[0];

  if (error || !data) { showError('This invite link is invalid or has expired.'); return; }
  if (data.accepted_at) { showError('This invite has already been accepted.'); return; }
  if (new Date(data.expires_at) < new Date()) { showError('This invite has expired. Ask the creator to resend it.'); return; }

  invite = data;
  creatorName = data.creator_display_name || 'this creator';

  const profile = await getCurrentProfile();
  if (profile) {
    await linkManager(profile);
    return;
  }

  // A session can exist here with no profile row yet -- e.g. Supabase has
  // email confirmation on, the person clicked "Create account and link"
  // below, and the confirmation email link brought them back to this same
  // page (see emailRedirectTo in acceptWithSignup). Previously there was
  // no emailRedirectTo, so this case never happened here -- confirmation
  // dropped people on auth.html instead, where the generic signup handler
  // created a manager profile from their metadata but had no idea about
  // this invite, so manager_creator_links never got a row and the invite
  // sat accepted_at=null forever ("Roster" -> "No creators linked yet"
  // even though they'd already signed up). Finish the job here instead of
  // re-showing the signup form, which would just fail on "already
  // registered" for a user who already has a session.
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const displayName = session.user.user_metadata?.display_name || invite.email.split('@')[0];
    const { data: newProfile, error: profileErr } = await sb.from('profiles')
      .insert({ auth_user_id: session.user.id, role: 'manager', display_name: displayName, email: session.user.email })
      .select().single();
    if (profileErr) { showError('Signed in but profile setup failed: ' + profileErr.message); return; }
    await linkManager(newProfile);
    return;
  }

  document.getElementById('card').innerHTML = `
    <h1>You're invited!</h1>
    <p>Be linked as <span class="creator-name">${escapeHtml(creatorName)}</span>'s manager on Kitscore. Create an account or sign in to accept.</p>
    <div class="field"><label>Your name</label><input id="displayName" placeholder="Your name" value=""></div>
    <div class="field"><label>Email</label><input id="email" type="email" value="${escapeHtml(invite.email)}" placeholder="${escapeHtml(invite.email)}"></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="Choose a password (min 6 chars)"></div>
    <button class="submit" id="submitBtn" onclick="acceptWithSignup()">Create account and link</button>
    <p style="font-size:11px;margin-top:10px;color:var(--color-text-secondary)">Already have an account? <a href="#" onclick="showLogin()" style="color:#2563EB">Sign in instead</a></p>
    <div id="msg"></div>
  `;
}

function showLogin() {
  document.getElementById('card').innerHTML = `
    <h1>Sign in to accept</h1>
    <p>Sign in to be linked as <span class="creator-name">${escapeHtml(creatorName)}</span>'s manager.</p>
    <div class="field"><label>Email</label><input id="email" type="email" value="${escapeHtml(invite.email)}"></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div>
    <button class="submit" id="submitBtn" onclick="acceptWithLogin()">Sign in and link</button>
    <div id="msg"></div>
  `;
}

async function acceptWithSignup() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  const displayName = document.getElementById('displayName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!displayName || !email || !password) { showMsg('All fields are required.', 'error'); btn.disabled = false; return; }

  const origin = window.location.origin;
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: {
      // Without this, Supabase falls back to the project's default site
      // URL when confirmation is required -- bouncing the person to
      // auth.html with no idea they were mid-invite. Sending them back to
      // this exact URL (token included) means init() picks the invite
      // back up on return and finishes the link automatically.
      emailRedirectTo: `${origin}${window.location.pathname}?token=${encodeURIComponent(inviteToken)}`,
      data: { role: 'manager', display_name: displayName },
    },
  });
  if (error) { showMsg(error.message, 'error'); btn.disabled = false; return; }
  if (!data.session) { showMsg('Check your email to confirm, then click the link there to finish linking your account.', 'ok'); return; }

  // Managers get a profiles row only -- no matching creators/sponsors row.
  // Not reusing the shared createProfile() helper here since it assumes
  // every non-creator role is a sponsor and would insert a bogus sponsors
  // row for a manager.
  const { data: profile, error: profileErr } = await sb.from('profiles')
    .insert({ auth_user_id: data.user.id, role: 'manager', display_name: displayName, email })
    .select().single();
  if (profileErr) { showMsg('Account created but profile failed: ' + profileErr.message, 'error'); btn.disabled = false; return; }

  await linkManager(profile);
}

async function acceptWithLogin() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { data: loginData, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showMsg(error.message, 'error'); btn.disabled = false; return; }
  let profile = await getCurrentProfile();
  if (!profile) {
    const displayName = loginData.user.user_metadata?.display_name || invite.email.split('@')[0];
    const { data: newProfile, error: profileErr } = await sb.from('profiles')
      .insert({ auth_user_id: loginData.user.id, role: 'manager', display_name: displayName, email: loginData.user.email })
      .select().single();
    if (profileErr) { showMsg('Signed in but profile setup failed: ' + profileErr.message, 'error'); btn.disabled = false; return; }
    profile = newProfile;
  }
  await linkManager(profile);
}

async function linkManager(profile) {
  await sb.from('manager_invites').update({ accepted_at: new Date().toISOString() }).eq('id', invite.id);

  const { error } = await sb.from('manager_creator_links').upsert(
    { manager_id: profile.id, creator_id: invite.creator_id, status: 'active' },
    { onConflict: 'manager_id,creator_id' }
  );
  if (error) { showError('Could not link: ' + error.message); return; }

  document.getElementById('card').innerHTML = `
    <h1>You're linked! 🎉</h1>
    <p>You're now linked to <span class="creator-name">${escapeHtml(creatorName)}</span> on Kitscore. ${escapeHtml(creatorName)} can revoke this at any time.</p>
    <p style="font-size:11px;color:var(--color-text-secondary)">More manager tools are on the way — for now, this confirms the connection between your accounts.</p>
  `;
}

function showError(msg) {
  document.getElementById('card').innerHTML = `
    <h1>Invite error</h1>
    <p style="color:#B42318">${msg}</p>
    <p style="font-size:12px;color:var(--color-text-secondary)">If you think this is a mistake, ask the creator to resend the invite.</p>
  `;
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  if (el) el.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

init();
</script>
</body>
</html>
