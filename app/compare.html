<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  body{background:var(--canvas)}
  .app-main{max-width:1180px;padding:40px 48px 80px}
  .ptitle{font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-bottom:6px}
  .psub{font-size:14px;color:var(--ink-soft);margin-bottom:18px}
  .picker{display:flex;gap:12px;margin-bottom:14px;align-items:center}
  .picker select{max-width:320px;padding:11px 12px;border:1px solid #D5DAE3;border-radius:0;font-size:14px;flex:1;background:#fff;color:var(--ink)}
  .picker button{padding:10px 18px;background:var(--blue);color:#fff;border:none;border-radius:0;font-size:13.5px;font-weight:600;cursor:pointer}
  .picker button:disabled{background:#C9D2E6;cursor:default}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:600;padding:6px 12px}
  .chip button{background:none;border:none;color:var(--blue);cursor:pointer;font-size:13px;font-weight:700;padding:0}
  .cmp-table{display:grid;background:#fff;border:1px solid var(--line);overflow:hidden;overflow-x:auto}
  .cmp-cell{padding:14px 20px;border-bottom:1px solid var(--line);font-size:14px;font-family:var(--font-mono)}
  .cmp-cell:first-child{font-family:var(--font-sans);color:var(--ink-soft);font-weight:500}
  .cmp-head{font-weight:600;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);background:#FAFBFD}
  .cmp-head:first-child{font-family:var(--font-mono)}
  .win{background:var(--green-soft);color:#137C52;font-weight:600}
  .loading{font-size:13px;color:var(--ink-soft)}
  .limit-note{font-size:12px;color:var(--ink-faint);margin-bottom:10px}
  .cmp-val{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .cmp-tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 6px;border-radius:3px}
  .cmp-tag.live{background:#D1FAE5;color:#065F46}
  .cmp-tag.ev{background:#FEF3C7;color:#92600A}
  .cmp-tag.self{background:#F0EFE9;color:#6B6B67}
  .cmp-tag.pend{background:#F0EFE9;color:#6B6B67}
  .cmp-platform-note{font-size:10.5px;color:var(--ink-faint);font-family:var(--font-sans)}
  .save-shortlist-btn{padding:10px 14px;font-size:13px;font-weight:600;background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer}
  .save-shortlist-btn:hover{border-color:var(--blue);color:var(--blue)}
  .shortlist-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .shortlist-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:6px 8px 6px 12px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer}
  .shortlist-chip:hover{border-color:var(--blue);color:var(--blue)}
  .shortlist-chip button{background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:2px}
  .shortlist-chip button:hover{color:#B42318}
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-mount"></div>
  <div class="app-main">
    <div class="ptitle">Compare creators</div>
    <div class="psub" id="psub">Loading…</div>
    <div class="picker">
      <select id="creatorPick"></select>
      <button id="addBtn" onclick="addCreator()">Add to compare</button>
      <button class="save-shortlist-btn" onclick="saveShortlist()">Save shortlist</button>
    </div>
    <div class="shortlist-row" id="shortlistRow"></div>
    <div class="chips" id="chips"></div>
    <div id="result"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="nav.js?v=2"></script>
<script>
let allCreators = [];
let selectedIds = [];
let maxCompare = 2;
let shortlists = [];
let sponsorProfile;
const PLAN_LIMITS = { free: 2, starter: 5, team: Infinity };

async function load() {
  sponsorProfile = await requireRole('sponsor');
  if (!sponsorProfile) return;
  renderSidebar('sponsor', 'compare');

  const { data: sponsor } = await sb.from('sponsors').select('plan').eq('id', sponsorProfile.id).single();
  const plan = sponsor?.plan || 'free';
  maxCompare = PLAN_LIMITS[plan] ?? 2;
  document.getElementById('psub').textContent = maxCompare === Infinity
    ? `Compare unlimited creators side by side (${plan} plan).`
    : `Compare up to ${maxCompare} creators side by side (${plan} plan). Upgrade for more.`;

  const { data, error } = await sb.from('creators').select('id, niche, location, trust_score, confidence, badge_tier, reliability_score, repeat_sponsor_rate, would_hire_again_pct, profiles!inner(display_name)').eq('is_test', false);
  if (error) { document.getElementById('result').textContent = 'Could not load: ' + error.message; return; }
  allCreators = data;

  selectedIds = data.slice(0, Math.min(2, maxCompare === Infinity ? 2 : maxCompare)).map(c => c.id);
  renderPicker();
  renderChips();
  renderCompare();
  await loadShortlists();
}

async function loadShortlists() {
  const { data, error } = await sb.from('comparison_shortlists').select('*').eq('sponsor_id', sponsorProfile.id).order('created_at', { ascending: false });
  if (error) { document.getElementById('shortlistRow').innerHTML = ''; return; }
  shortlists = data || [];
  renderShortlistRow();
}

function renderShortlistRow() {
  const el = document.getElementById('shortlistRow');
  if (!shortlists.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<span style="font-size:11.5px;color:var(--ink-faint);margin-right:2px">Saved:</span>` + shortlists.map(s => `
    <span class="shortlist-chip" onclick="applyShortlist('${s.id}')" title="Load this shortlist">
      ${escapeHtml(s.name)} <span style="color:var(--ink-faint);font-weight:400">(${s.creator_ids.length})</span>
      <button onclick="event.stopPropagation(); deleteShortlist('${s.id}')" title="Delete">✕</button>
    </span>`).join('');
}

function applyShortlist(id) {
  const s = shortlists.find(x => x.id === id);
  if (!s) return;
  const capped = maxCompare === Infinity ? s.creator_ids : s.creator_ids.slice(0, maxCompare);
  if (capped.length < s.creator_ids.length) {
    alert(`This shortlist has ${s.creator_ids.length} creators, but your plan allows ${maxCompare} at a time — showing the first ${maxCompare}.`);
  }
  selectedIds = capped.filter(id => allCreators.some(c => c.id === id));
  renderPicker(); renderChips(); renderCompare();
}

async function saveShortlist() {
  if (!selectedIds.length) { alert('Add at least one creator to compare first.'); return; }
  const name = prompt('Name this shortlist (e.g. "Q3 skincare finalists"):');
  if (!name || !name.trim()) return;
  const { error } = await sb.from('comparison_shortlists').insert({
    sponsor_id: sponsorProfile.id,
    name: name.trim(),
    creator_ids: selectedIds,
  });
  if (error) { alert('Could not save shortlist: ' + error.message); return; }
  await loadShortlists();
}

async function deleteShortlist(id) {
  if (!confirm('Delete this saved shortlist?')) return;
  const { error } = await sb.from('comparison_shortlists').delete().eq('id', id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  await loadShortlists();
}

function renderPicker() {
  const available = allCreators.filter(c => !selectedIds.includes(c.id));
  document.getElementById('creatorPick').innerHTML = available.map(c => `<option value="${c.id}">${escapeHtml(c.profiles.display_name)}</option>`).join('');
  const btn = document.getElementById('addBtn');
  const atLimit = selectedIds.length >= maxCompare;
  btn.disabled = atLimit || available.length === 0;
  btn.textContent = atLimit ? `Limit reached (${maxCompare})` : 'Add to compare';
}

function renderChips() {
  document.getElementById('chips').innerHTML = selectedIds.map(id => {
    const c = allCreators.find(x => x.id === id);
    return `<span class="chip">${escapeHtml(c.profiles.display_name)}<button onclick="removeCreator('${id}')" title="Remove">✕</button></span>`;
  }).join('');
}

function addCreator() {
  const id = document.getElementById('creatorPick').value;
  if (!id || selectedIds.includes(id) || selectedIds.length >= maxCompare) return;
  selectedIds.push(id);
  renderPicker(); renderChips(); renderCompare();
}

function removeCreator(id) {
  selectedIds = selectedIds.filter(x => x !== id);
  renderPicker(); renderChips(); renderCompare();
}

const STATUS_TAGS = {
  live_verified: { cls: 'live', label: 'Live' },
  evidence_submitted: { cls: 'ev', label: 'Evidence' },
  self_reported: { cls: 'self', label: 'Self-reported' },
};

async function renderCompare() {
  if (selectedIds.length === 0) { document.getElementById('result').innerHTML = ''; return; }

  const results = await Promise.all(selectedIds.map(async id => {
    const [{ data: comp }, { data: camp }] = await Promise.all([
      sb.from('score_components').select('*').eq('creator_id', id),
      sb.from('campaigns').select('status').eq('creator_id', id).eq('status', 'verified'),
    ]);
    const map = {};
    (comp || []).forEach(c => map[c.component_key] = c);
    const creator = allCreators.find(c => c.id === id);
    return { creator, map, verified: (camp || []).length };
  }));

  // Component keys aren't all fixed strings -- engagement_quality and
  // content_consistency are suffixed per platform (e.g. _youtube,
  // _discord) depending on which platform a creator's primary evidence
  // for that metric comes from. Hardcoding one suffix meant a creator
  // whose data lived under a different platform showed a blank "--" for
  // a metric they actually have a real score for. Instead, find
  // whichever key in that family each creator actually has.
  function familyMatch(map, prefix) {
    const key = Object.keys(map).find(k => k === prefix || k.startsWith(prefix + '_'));
    return key ? map[key] : null;
  }
  // Platform note extracted from the stored label (e.g. "Engagement
  // quality (YouTube)" -> "(YouTube)") so the comparison is transparent
  // about the fact that two creators' numbers here may come from
  // different platforms and aren't necessarily apples-to-apples.
  function platformNote(component) {
    if (!component?.label) return '';
    const match = component.label.match(/\(([^)]+)\)/);
    return match ? ` (${match[1]})` : '';
  }
  function renderCell(component) {
    if (!component) return '<div class="cmp-cell">—</div>';
    const tag = STATUS_TAGS[component.status];
    return `<div class="cmp-cell"><div class="cmp-val">
      <span>${component.value}${platformNote(component)}</span>
      ${tag ? `<span class="cmp-tag ${tag.cls}">${tag.label}</span>` : ''}
    </div></div>`;
  }

  const metricRows = [
    ['Trust score', r => ({ value: r.creator.trust_score }), false],
    ['Audience authenticity', r => familyMatch(r.map, 'audience_authenticity'), true],
    ['Engagement quality', r => familyMatch(r.map, 'engagement_quality'), true],
    ['Brand safety', r => familyMatch(r.map, 'brand_safety'), true],
    ['Content consistency', r => familyMatch(r.map, 'content_consistency'), true],
    ['Verified campaigns', r => ({ value: r.verified }), false],
  ];

  const cols = results.length + 1;
  document.getElementById('result').innerHTML = `
    <div class="cmp-table" style="grid-template-columns:repeat(${cols}, 1fr)">
      <div class="cmp-cell cmp-head">Metric</div>
      ${results.map(r => `<div class="cmp-cell cmp-head"><a href="evaluate.html?creator=${r.creator.id}" style="color:inherit;text-decoration:none">${escapeHtml(r.creator.profiles.display_name)} ↗</a></div>`).join('')}
      ${metricRows.map(([label, getter, isComponent]) => {
        const components = results.map(getter);
        const values = components.map(c => c?.value ?? null);
        const max = Math.max(...values.map(v => v ?? -Infinity));
        return `
        <div class="cmp-cell">${label}</div>
        ${isComponent
          ? components.map(c => c && c.value === max ? renderCell(c).replace('cmp-cell', 'cmp-cell win') : renderCell(c)).join('')
          : values.map(v => `<div class="cmp-cell ${v === max && v != null ? 'win' : ''}">${v ?? '—'}</div>`).join('')}
      `; }).join('')}
    </div>
  `;
}

load();
</script>
</body>
</html>
