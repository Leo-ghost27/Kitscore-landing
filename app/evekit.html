<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Media Kit — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  :root{--ek-accent:#5B4FCF;--ek-accent-light:#9B8FFD;--ek-accent-dark:#4A3FB8;--ek-accent-rgb:91,79,207;--ek-glow:#1A1230}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F3EE;color:#1A1A18;font-size:14px}
  .topbar{background:#0F0F0E;color:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
  .topbar .brand{font-weight:700;letter-spacing:-0.01em}
  .topbar .brand span{color:#9B8FFD}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .tb-btn{background:#5B4FCF;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .tb-btn:hover{background:#4A3FB8}
  .tb-btn.ghost{background:transparent;border:1px solid #3D3D3A;color:#D4D4D2}
  .tb-btn.ghost:hover{border-color:#5B4FCF;color:#fff}
  .tb-btn:disabled{opacity:.6;cursor:default}
  .wrap{max-width:800px;margin:0 auto;padding:28px 20px 80px}
  .loading,.notfound{text-align:center;padding:80px 20px;color:#6B6B67;font-size:13px}

  .cover{background:#0F0F0E;border-radius:16px;padding:44px 40px;margin-bottom:20px;position:relative;overflow:hidden}
  .cover::before{content:'';position:absolute;top:-120px;left:-80px;width:400px;height:400px;background:radial-gradient(circle, rgba(var(--ek-accent-rgb),.35) 0%, transparent 70%);pointer-events:none}
  .cover-pattern{position:absolute;inset:0;opacity:.16;pointer-events:none}
  .cover-motif{position:absolute;bottom:10px;right:16px;opacity:.10;pointer-events:none;color:var(--ek-accent-light)}
  .cover-tags{position:absolute;top:20px;left:40px;display:flex;gap:6px;z-index:1}
  .cover-tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#D4D4D2;font-size:10.5px;font-weight:500;padding:4px 10px;border-radius:20px}
  .cover-spotlight{position:absolute;top:20px;right:40px;text-align:right;z-index:1}
  .cover-spotlight .v{font-size:20px;font-weight:700;color:#fff;line-height:1}
  .cover-spotlight .l{font-size:9px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .cover-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ek-accent-light);margin-bottom:16px}
  .cover-head{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
  .cover-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.15)}
  .cover-avatar-placeholder{width:64px;height:64px;border-radius:50%;flex-shrink:0;background:var(--ek-accent);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .cover-avatar.shape-rounded,.cover-avatar-placeholder.shape-rounded{border-radius:22%}
  .cover-name{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:#fff;margin-bottom:4px}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid #E5E4DF}
  .cover-sub{font-size:14px;color:#6B6B67;margin-bottom:20px}
  .cover-bio{font-size:14px;color:#C7C7C2;line-height:1.6;max-width:600px;margin-bottom:26px}
  .cover-bio.empty{color:#5A5A56;font-style:italic}
  .cover-score-row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .score-ring{position:relative;width:92px;height:92px;flex-shrink:0}
  .score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .score-ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(0deg)}
  .score-ring .num span{font-size:24px;font-weight:700;color:#fff;line-height:1}
  .score-ring .num small{font-size:8.5px;color:#6B6B67;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
  .cover-stats{display:flex;gap:26px;flex-wrap:wrap}
  .cover-stat .v{font-size:19px;font-weight:700;color:#fff}
  .cover-stat .l{font-size:10.5px;color:#6B6B67;margin-top:1px}
  .cover-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--ek-accent-rgb),.2);border:1px solid rgba(var(--ek-accent-rgb),.4);color:var(--ek-accent-light);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:14px;margin-right:6px}
  .cover-avail-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .cover-avail-tag{font-size:11.5px;font-weight:600;color:#D4D4D2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);padding:5px 12px;border-radius:20px}
  .cover-avail-tag.primary{color:#0F0F0E;background:var(--ek-accent-light);border-color:var(--ek-accent-light)}
  .cover-founding{display:inline-flex;align-items:center;gap:6px;background:rgba(240,180,41,.15);border:1px solid rgba(240,180,41,.4);color:#F0B429;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:14px}
  .cover-footer{display:flex;align-items:center;justify-content:space-between;margin-top:32px;padding-top:18px;border-top:1px solid #2A2A28}
  .cover-footer span{font-size:11px;color:#3D3D3A}
  .cover-footer .kit-brand{font-size:12.5px;font-weight:600;color:var(--ek-accent-light)}

  .card{background:#fff;border-radius:12px;padding:26px;margin-bottom:16px;border:1px solid #E5E4DF}
  .card-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9E9E99;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #F0EFE9;display:flex;align-items:center;justify-content:space-between}
  .card-title span{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none}

  .plat-grid{display:flex;flex-wrap:wrap;gap:12px}
  .plat-item{position:relative;flex:0 1 230px;min-width:180px;background:#F9F8F5;border:1px solid #E5E4DF;border-radius:10px;padding:14px}
  .plat-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#9E9E99;margin-bottom:6px;padding-right:56px}
  .plat-followers{font-size:20px;font-weight:700;color:#1A1A18}
  .plat-handle{font-size:11.5px;color:#6B6B67;margin-top:2px}
  .plat-stats{font-size:10.5px;color:#9E9E99;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
  .plat-verified{position:absolute;top:14px;right:14px;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:10px}
  .plat-verified.oauth{background:#EBF5DE;color:#2D6A0F}
  .plat-verified.public_lookup{background:#F0EFE9;color:#6B6B67}
  .no-platforms{font-size:12.5px;color:#9E9E99}

  .score-row{display:grid;grid-template-columns:1fr 2fr 44px 96px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F0EFE9}
  .score-row:last-child{border-bottom:none}
  .sr-label{font-size:13px;font-weight:500;color:#1A1A18}
  .sr-bar-wrap{background:#F0EFE9;border-radius:4px;height:6px}
  .sr-bar{height:6px;border-radius:4px}
  .sr-val{font-size:14px;font-weight:600;color:#1A1A18;text-align:right}
  .sr-status{font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:20px;text-align:center;white-space:nowrap}
  .s-live{background:#EBF5DE;color:#2D6A0F}
  .s-ev{background:#E4F0FB;color:#0C3D6E}
  .s-self{background:#F0EFE9;color:#6B6B67}
  .s-need{background:#FDF0DC;color:#92460A}
  .s-flag{background:#FBE3E1;color:#9E2B22}
  .no-scores{font-size:12.5px;color:#9E9E99}

  .bs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:600px){.bs-grid{grid-template-columns:repeat(2,1fr)}}
  .bs-item{background:#F9F8F5;border-radius:8px;padding:12px;text-align:center;border:1px solid #E5E4DF}
  .bs-item .bs-icon{font-size:20px;margin-bottom:6px}
  .bs-item .bs-label{font-size:11px;color:#6B6B67;margin-bottom:4px}
  .bs-item .bs-val{font-size:12px;font-weight:600}
  .bs-pass{color:#2D6A0F}
  .bs-caution{color:#92460A}
  .bs-flag{color:#9E2B22}
  .bs-na{color:#9E9E99}

  .ev-item{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid #F0EFE9}
  .ev-item:last-child{border-bottom:none}
  .ev-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#F0EFE9}
  .ev-body .ev-title{font-size:13px;font-weight:500;color:#1A1A18;margin-bottom:2px}
  .ev-body .ev-sub{font-size:12px;color:#6B6B67}
  .ev-badge{margin-left:auto;flex-shrink:0}
  .no-evidence{font-size:12.5px;color:#9E9E99}

  .rep-stat{background:#F9F8F5;border-radius:8px;padding:14px;text-align:center;border:1px solid #E5E4DF}
  .rep-stat .rv{font-size:24px;font-weight:700;color:#1A1A18}
  .rep-stat .rl{font-size:10px;color:#6B6B67;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .rep-stat .rt{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:5px}
  .rate-stat{padding:10px 12px;background:#F9F8F5;border-radius:6px;border:1px solid #E5E4DF;text-align:center}
  .rate-stat .l{font-size:10px;color:#6B6B67;margin-bottom:3px}
  .rate-stat .v{font-size:16px;font-weight:700;color:#1A1A18}
  .no-reputation{font-size:12.5px;color:#9E9E99}

  .rec-box{background:linear-gradient(135deg,#0F1A0C 0%,#0F0F0E 100%);border-radius:12px;padding:22px 24px;border:1px solid #2A4020}
  .rec-box.rec-caution{background:linear-gradient(135deg,#1A160C 0%,#0F0F0E 100%);border-color:#4A3A20}
  .rec-box.rec-avoid{background:linear-gradient(135deg,#1A0C0C 0%,#0F0F0E 100%);border-color:#4A2020}
  .rec-verdict{font-size:19px;font-weight:700;color:#4ADE80;margin-bottom:8px}
  .rec-caution .rec-verdict{color:#F0B429}
  .rec-avoid .rec-verdict{color:#F87171}
  .rec-body{font-size:13px;color:#9E9E99;line-height:1.7}
  .rec-body strong{color:#D4D4D2}
  .rec-stats{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
  .rec-stat{flex:1;min-width:150px;background:#F9F8F5;border-radius:8px;padding:14px;border:1px solid #E5E4DF}
  .rec-stat .l{font-size:10px;color:#9E9E99;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .rec-stat .v{font-size:20px;font-weight:700;color:#1A1A18}
  .rec-stat .s{font-size:11px;color:#6B6B67;margin-top:2px}

  .contact-copy{background:transparent;border:1px solid #E5E4DF;color:#6B6B67;padding:9px 14px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .contact-copy:hover{border-color:var(--ek-accent);color:var(--ek-accent)}

  .rate-box{text-align:center;padding:8px 0}
  .rate-range{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--ek-accent);margin-bottom:6px}
  .rate-note{font-size:11.5px;color:#9E9E99}
  .rate-controls{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .rate-controls select{font-size:11.5px;padding:5px 8px;border:1px solid #E5E4DF;border-radius:6px;background:#fff;font-family:inherit}
  .rate-disclaimer{font-size:10.5px;color:#B0B0AA;text-align:center;margin-top:12px;line-height:1.5}

  .campaign-row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid #F0EFE9}
  .campaign-row:last-child{border-bottom:none}
  .cr-name{font-size:13px;font-weight:500;color:#1A1A18;margin-bottom:3px}
  .cr-meta{font-size:12px;color:#6B6B67}
  .cr-verified{font-size:11px;font-weight:600;color:#2D6A0F}
  .no-campaigns{font-size:12.5px;color:#9E9E99;padding:8px 0}

  .contact-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .contact-email{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#1A1A18}
  .contact-cta{background:var(--ek-accent);color:#fff;text-decoration:none;padding:9px 18px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .no-contact{font-size:12.5px;color:#9E9E99}

  .owner-banner{background:#EEF2FF;border:1px solid #C7D2FE;border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:12.5px;color:#3730A3;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .owner-banner code{background:#fff;padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace}
  .cta-band{text-align:center;padding:24px 0 0}
  .cta-band a{color:var(--ek-accent);text-decoration:none;font-size:12.5px;font-weight:600}
  .footer-note{text-align:center;font-size:11px;color:#9E9E99;margin-top:18px}
</style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="brand" style="text-decoration:none;color:#fff">Kit<span>score</span></a>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
  <div class="wrap">
    <div id="ownerBanner"></div>
    <div id="content" class="loading">Loading Verified Media Kit…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app/supabase-client.js?v=2"></script>
<script>
const AUD_GENDER_LABEL = { female: 'Female', male: 'Male', other: 'Other' };

// ── Brand safety questionnaire config ── mirrors app/dashboard.html's
// QUESTIONS array exactly (same keys, same option order). opts[0] is
// always the safe/pass answer, opts[1] is a caution, opts[2] is a flag —
// same convention dashboard.html relies on when writing answers.
const BS_QUESTIONS = [
  { key: 'adult',               icon: '🔞', label: 'Adult content',   opts: ['None', 'Mild', 'Explicit'] },
  { key: 'gambling',            icon: '🎰', label: 'Gambling',        opts: ['Never', 'Past', 'Active'] },
  { key: 'political',           icon: '🗳️', label: 'Political',       opts: ['None', 'Occasional', 'Frequent'] },
  { key: 'profanity',           icon: '🤬', label: 'Profanity',       opts: ['None', 'Occasional', 'Frequent'] },
  { key: 'family_safe',         icon: '👨‍👩‍👧', label: 'Family safe',     opts: ['Yes', 'Mostly', 'No'] },
  { key: 'paid_disclosure',     icon: '📢', label: 'Paid disclosure', opts: ['Always', 'Inconsistent', 'Never'] },
  { key: 'misinformation',      icon: '🚫', label: 'Misinformation',  opts: ['None', 'Suspected', 'Confirmed'] },
  { key: 'controversy_history', icon: '⚠️', label: 'Controversy',     opts: ['None', 'Minor', 'Major'] },
];

const SCORE_STATUS_BADGE = {
  live_verified: { cls: 's-live', label: 'Live Verified' },
  evidence_submitted: { cls: 's-ev', label: 'Evidence' },
  self_reported: { cls: 's-self', label: 'Self-reported' },
  needs_improvement: { cls: 's-need', label: 'Needs work' },
  flagged: { cls: 's-flag', label: 'Flagged' },
};
const EVIDENCE_STATUS_BADGE = {
  live_verified: { cls: 's-live', label: 'Verified' },
  submitted: { cls: 's-ev', label: 'Submitted' },
  self_reported: { cls: 's-self', label: 'Self-reported' },
};
function reliabilityTier(score) {
  if (score >= 90) return { label: 'Excellent', bg: '#FEF3C7', color: '#B8960C' };
  if (score >= 75) return { label: 'Good', bg: '#D1FAE5', color: '#065F46' };
  if (score >= 50) return { label: 'Fair', bg: '#F0EFE9', color: '#6B6B67' };
  return { label: 'Developing', bg: '#F0EFE9', color: '#6B6B67' };
}

// Same thresholds as lib/ai-brief.js's deriveVerdict() (sponsor-evaluation
// verdicts) — reused here so a creator's own Verified Media Kit reflects
// the identical rule-based bar sponsors' paid evaluations use, rather
// than a second, potentially-inconsistent set of thresholds.
function deriveEveKitVerdict(trustScore, brandSafetyValue, verifiedCount) {
  if (trustScore >= 70 && brandSafetyValue >= 70 && verifiedCount >= 2) return 'approve';
  if (trustScore >= 50 && brandSafetyValue >= 50) return 'caution';
  return 'avoid';
}

// ── EveKit color themes ────────────────────────────────────────────────
// Creator picks one before sending their kit link to a sponsor. Applied
// consistently to the live page (CSS custom properties, swapped instantly
// on click) and the PDF export (see lib/handlers/document-evekit.js'
// matching THEME_COLORS) -- a mismatched live page vs. PDF would look
// like a bug, not a feature.
const EK_THEMES = {
  indigo:   { label: 'Indigo',   accent: '#5B4FCF', light: '#9B8FFD', dark: '#4A3FB8', rgb: '91,79,207',   glow: '#1A1230' },
  ocean:    { label: 'Ocean',    accent: '#2172B8', light: '#7EC8E8', dark: '#195C93', rgb: '33,114,184',  glow: '#0F1F30' },
  emerald:  { label: 'Emerald',  accent: '#1D9A6C', light: '#7EE3B8', dark: '#167A54', rgb: '29,154,108',  glow: '#0F2A20' },
  rose:     { label: 'Rose',     accent: '#C33D74', light: '#F2A8C4', dark: '#9E2F5C', rgb: '195,61,116',  glow: '#2A1420' },
  charcoal: { label: 'Charcoal', accent: '#4A4A46', light: '#A8A8A2', dark: '#35342F', rgb: '74,74,70',    glow: '#161615' },
  amber:    { label: 'Amber',    accent: '#C17A1E', light: '#F3C476', dark: '#9C6116', rgb: '193,122,30',  glow: '#2A1D0D' },
};

function setEkTheme(key) {
  const t = EK_THEMES[key] || EK_THEMES.indigo;
  const s = document.documentElement.style;
  s.setProperty('--ek-accent', t.accent);
  s.setProperty('--ek-accent-light', t.light);
  s.setProperty('--ek-accent-dark', t.dark);
  s.setProperty('--ek-accent-rgb', t.rgb);
  s.setProperty('--ek-glow', t.glow);
}

// ── Cover customization (phase 2) ── pattern backgrounds, niche motif
// icon, vibe tag labels, and the spotlight stat. All rendering-only —
// the underlying values are picked by the creator on profile.html and
// written straight to Supabase (same instant-write pattern as
// selectEkTheme above), so this file only has to know how to draw them.
const COVER_PATTERNS = {
  none: '',
  dots: `<svg width="100%" height="100%" class="cover-pattern" preserveAspectRatio="none"><defs><pattern id="ekpat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff"/></pattern></defs><rect width="100%" height="100%" fill="url(#ekpat)"/></svg>`,
  lines: `<svg width="100%" height="100%" class="cover-pattern" preserveAspectRatio="none"><defs><pattern id="ekpat" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="18" stroke="#fff" stroke-width="1.6"/></pattern></defs><rect width="100%" height="100%" fill="url(#ekpat)"/></svg>`,
  waves: `<svg width="100%" height="100%" class="cover-pattern" preserveAspectRatio="none"><defs><pattern id="ekpat" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10 Q10 0 20 10 T40 10" fill="none" stroke="#fff" stroke-width="1.6"/></pattern></defs><rect width="100%" height="100%" fill="url(#ekpat)"/></svg>`,
};

// Small curated set, not exhaustive -- keyed on substring match against
// the creator's free-text niche field, falls back to a generic sparkle.
// Icons are inline SVG (not an icon font) since evekit.html is public
// and unauthenticated -- keeping it dependency-free here.
const NICHE_MOTIFS = [
  [/beauty|makeup|skincare/i, '<circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/>'],
  [/fitness|gym|workout|health/i, '<path d="M4 12h16M7 8v8M17 8v8M2 10v4M22 10v4"/>'],
  [/game|gaming|esport/i, '<rect x="3" y="8" width="18" height="9" rx="4"/><path d="M8 12h.01M11 12.5h3M15.5 11v3"/>'],
  [/food|cook|chef|recipe/i, '<path d="M6 3v7a3 3 0 006 0V3M6 3v18M18 3c-2 0-3 2-3 5s1 5 3 5v10"/>'],
  [/travel|adventure/i, '<path d="M12 2l2.5 7H22l-6 4.5L18.5 21 12 16l-6.5 5L8 13.5 2 9h7.5z" transform="scale(.9) translate(1.2,1.2)"/>'],

];

}

// Spotlight stat: deliberately computed here from fields already on
// `kit` rather than a fifth RPC round trip -- reach sums follower_count
// across every connected platform, engagement reuses the same
// engagement_quality components the score itself is built from where
// present, campaigns/trust just echo fields already shown elsewhere on
// the page in a more prominent spot.
function coverSpotlightHtml(kit) {
  if (!kit.coverSpotlightStat) return '';
  let value, label;
  if (kit.coverSpotlightStat === 'reach') {
    const total = (kit.platforms || []).reduce((sum, p) => sum + (p.follower_count || 0), 0);
    value = formatCompactNumber(total); label = 'Total reach';
  } else if (kit.coverSpotlightStat === 'campaigns') {
    value = String(kit.verifiedCount || 0); label = 'Verified campaigns';
  } else if (kit.coverSpotlightStat === 'trust') {
    value = String(Math.round(kit.trustScore || 0)); label = 'Trust score';
  } else if (kit.coverSpotlightStat === 'engagement') {
    value = kit.confidence != null ? `${Math.round(kit.confidence)}%` : '—'; label = 'Confidence';
  } else {
    return '';
  }
  return `<div class="cover-spotlight"><div class="v">${escapeHtml(value)}</div><div class="l">${escapeHtml(label)}</div></div>`;
}
function formatCompactNumber(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

// sync intentionally; see dashboard.html RATE_TIERS_USD for the source of
// truth and the reasoning comment behind the banding). ──────────────────
const RATE_TIERS_USD = [
  [0,        10000,    100,   500],
  [10000,    100000,   500,   5000],
  [100000,   1000000,  5000,  25000],
  [1000000,  Infinity, 25000, 60000],
];
const PLATFORM_RATE_MULT = { instagram: 1, tiktok: 0.75, youtube: 2.5 };
const NICHE_RATE_MULT = {
  finance: 1.4, health: 1.35, sustainability: 1.3, tech: 1.25,
  beauty: 0.9, fashion: 0.95, lifestyle: 0.9, fitness: 1.0,
};
const USD_TO_GBP = 0.77;

function rateTierFor(followers) {
  return RATE_TIERS_USD.find(([min, max]) => followers >= min && followers < max) || RATE_TIERS_USD[RATE_TIERS_USD.length - 1];
}
function rateForFollowers(followers, platform, niche) {
  const [, , rMin, rMax] = rateTierFor(followers);
  const platMult = PLATFORM_RATE_MULT[platform] || 1;
  const nicheMult = NICHE_RATE_MULT[(niche || '').toLowerCase()] || 1;
  return { min: Math.round(rMin * platMult * nicheMult / 5) * 5, max: Math.round(rMax * platMult * nicheMult / 5) * 5 };
}
function detectCurrency() {
  try {
    const locale = navigator.language || (navigator.languages && navigator.languages[0]) || 'en-GB';
    const region = new Intl.Locale(locale).maximize().region;
    return region === 'US' ? 'USD' : 'GBP';
  } catch (e) { return /-us$/i.test(navigator.language || '') ? 'USD' : 'GBP'; }
}

function ringSvg(score) {
  const r = 40, circ = 2*Math.PI*r;
  const pct = Math.min(score||0, 100)/100;
  const offset = circ*(1-pct);
  const color = score >= 70 ? '#4ADE80' : score >= 40 ? '#F0B429' : '#EF4444';
  return `
    <div class="score-ring">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="${r}" fill="none" stroke="#2A2A28" stroke-width="8"/>
        <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="8"
          stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      </svg>
      <div class="num"><span>${score}</span><small>trust score</small></div>
    </div>`;
}

  return 'New / Unverified';
}

        </div>
      </div>
      ${(kit.reputationRatings?.communication || kit.reputationRatings?.professionalism || kit.reputationRatings?.deliverable_quality) ? `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${[['Communication','communication'],['Professionalism','professionalism'],['Deliverable quality','deliverable_quality']].map(([label,key]) => `
        <div class="rate-stat">
          <div class="l">${label}</div>
          <div class="v">${kit.reputationRatings[key] != null ? kit.reputationRatings[key] : '—'}${kit.reputationRatings[key] != null ? '<span style="font-size:11px;color:#D97706">★</span>' : ''}</div>
        </div>`).join('')}
      </div>` : ''}
      ` : `<div class="no-reputation">Reputation stats build up once sponsors confirm and rate campaigns with you.</div>`}
    </div>

    <div class="card">
      <div class="card-title">Recommendation</div>
      ${(() => {
        const bsComp = (kit.scoreComponents||[]).find(sc => (sc.key||sc.component_key)==='brand_safety');
        const bsValue = bsComp ? Number(bsComp.value)||0 : 0;
        const trustScore = Math.round(Number(kit.trustScore)||0);
        const verifiedCount = kit.verifiedCount||0;
        const verdict = deriveEveKitVerdict(trustScore, bsValue, verifiedCount);
        // "caution" covers two very different situations: (a) trust/safety
        // signals are themselves middling, or (b) trust/safety are strong
        // but there's no verified sponsorship track record yet. Those read
        // very differently to a sponsor, so give them different headlines
        // instead of a single generic "Proceed with Caution" that looks
        // contradictory next to a genuinely high trust score.
        const isTrackRecordCaution = verdict === 'caution' && trustScore >= 70 && bsValue >= 70 && verifiedCount < 2;
        const flaggedFlags = (kit.brandSafetyAnswers||[]).filter(a => { const q = BS_QUESTIONS.find(x=>x.key===a.question_key); return q && q.opts.indexOf(a.answer) === 2; });
        const cautionFlags = (kit.brandSafetyAnswers||[]).filter(a => { const q = BS_QUESTIONS.find(x=>x.key===a.question_key); return q && q.opts.indexOf(a.answer) === 1; });
        const verdictCopy = {
          approve: { cls: '', text: '✓ Recommend to Sponsor' },
          caution: { cls: 'rec-caution', text: isTrackRecordCaution ? '⚠ Strong Profile — No Track Record Yet' : '⚠ Proceed with Caution' },
          avoid: { cls: 'rec-avoid', text: '✕ Not Yet Recommended' },
        }[verdict];
        const niche = kit.niche ? escapeHtml(kit.niche) : 'this';
        const bodyParts = [];
        if (isTrackRecordCaution) {
          bodyParts.push(`<strong>${escapeHtml(kit.displayName||'This creator')}</strong>'s trust score (<strong>${trustScore}/100</strong>) and brand safety are in good standing — the gap is a verified sponsorship track record: no mutually confirmed campaigns yet, so there's no history to reference on delivery or reliability.`);
        } else {
          bodyParts.push(`<strong>${escapeHtml(kit.displayName||'This creator')}</strong> currently holds a <strong>${trustScore}/100 trust score</strong> (${escapeHtml(BADGE_LABEL[kit.badgeTier]||'New creator')} tier)${verifiedCount ? ` with <strong>${verifiedCount} mutually confirmed campaign${verifiedCount!==1?'s':''}</strong>` : ' and no mutually confirmed campaigns yet'}.`);
        }
        if (flaggedFlags.length) {
          bodyParts.push(`Brand safety review flagged ${flaggedFlags.length} area${flaggedFlags.length!==1?'s':''} worth checking before committing.`);
        } else if (cautionFlags.length && !isTrackRecordCaution) {
          bodyParts.push(`Brand safety is broadly clean, with ${cautionFlags.length} area${cautionFlags.length!==1?'s':''} worth a quick look.`);
        } else if (bsComp && !isTrackRecordCaution) {
          bodyParts.push(`No brand safety flags across the questionnaire.`);
        }
        if (kit.reputationRatings?.would_hire_again_total) {
          bodyParts.push(`${kit.reputationRatings.would_hire_again_yes} of ${kit.reputationRatings.would_hire_again_total} past sponsors said they'd hire again.`);
        }
        bodyParts.push(`Suitable for ${niche} brands${kit.location ? ` targeting audiences near ${escapeHtml(kit.location)}` : ''}.`);
        return `
        <div class="rec-box ${verdictCopy.cls}">
          <div class="rec-verdict">${verdictCopy.text}</div>
          <div class="rec-body">${bodyParts.join(' ')}</div>
        </div>
        <div class="rec-stats">
          <div class="rec-stat"><div class="l">Confidence rating</div><div class="v">${Math.round(Number(kit.confidence)||0)}%</div></div>
          <div class="rec-stat"><div class="l">Risk level</div><div class="v">${bsValue>=70?'Low':bsValue>=50?'Medium':'High'}</div></div>
          <div class="rec-stat"><div class="l">Campaigns verified</div><div class="v">${kit.verifiedCount||0}</div></div>
        </div>
        <div style="font-size:11px;color:var(--color-text-tertiary,#8A8A85);margin-top:10px;text-align:center">Auto-generated from this creator's trust score, brand safety questionnaire, and verified campaign history — not a human or AI review.</div>`;
      })()}
    </div>

    <div class="card">
      <div class="card-title">Contact</div>
      <div class="contact-row">
        ${kit.businessEmail
          ? `<span class="contact-email" id="ekContactEmail">${escapeHtml(kit.businessEmail)}</span><div style="display:flex;gap:8px"><button class="contact-copy" onclick="copyContactEmail('${escapeHtml(kit.businessEmail).replace(/'/g,"\\'")}')" id="ekCopyBtn">Copy email</button><a class="contact-cta" href="mailto:${encodeURIComponent(kit.businessEmail)}?subject=${encodeURIComponent('Partnership inquiry — '+kit.displayName)}">Email ${escapeHtml((kit.displayName||'').split(' ')[0]||'me')}</a></div>`
          : `<span class="no-contact">${opts.isOwner ? 'Add a business email in your Profile so brands can reach you from this page.' : 'No contact email listed.'}</span>`}
      </div>
    </div>

    ${opts.isOwner ? '' : `
    <div class="cta-band">
      <a href="/for-creators.html">Get your own free Verified Media Kit from Kitscore →</a>
    </div>`}
    <div class="footer-note">Your Verified Media Kit is a pitch document built from your verified Kitscore data. For a quick trust check instead, see the <a href="/p/${encodeURIComponent(opts.slug||'')}" style="color:#5B4FCF">verification link</a>.</div>
  `;

  document.getElementById('ek-currency').value = detectCurrency();
  updateEveKitRate();
}

function updateEveKitRate() {
  const platSel = document.getElementById('ek-platform');
  const curSel = document.getElementById('ek-currency');
  if (!platSel || !curSel || !KIT) return;
  const opt = platSel.options[platSel.selectedIndex];
  const followers = Number(opt.dataset.followers) || 18000;
  const platform = opt.value;
  const { min, max } = rateForFollowers(followers, platform, KIT.niche);
  const code = curSel.value;
  const symbol = code === 'GBP' ? '£' : '$';
  const conv = code === 'GBP' ? USD_TO_GBP : 1;
  const dMin = Math.round(min * conv / 5) * 5;
  const dMax = Math.round(max * conv / 5) * 5;
  document.getElementById('ek-rate-range').textContent = `${symbol}${dMin.toLocaleString()}–${symbol}${dMax.toLocaleString()} per post`;
  document.getElementById('ek-rate-note').textContent = `Based on ${followers.toLocaleString()} ${platform} followers${KIT.niche ? ` · ${KIT.niche} niche` : ''}`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function copyContactEmail(email) {
  navigator.clipboard.writeText(email).then(() => {
    const btn = document.getElementById('ekCopyBtn');
    if (!btn) return;
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}

// ── Owner (authenticated, dashboard) mode ───────────────────────────────
async function loadOwnerKit(profile) {
  const [{ data: c }, { data: campaigns }, { data: platformConnections }, { data: businessEmail }, { data: audience }, { data: collabs }, { data: press }, { data: scoreComponents }, { data: bsAnswers }, { data: evidenceRows }, { data: rateCardRows }] = await Promise.all([
    sb.from('creators').select('niche,location,trust_score,confidence,badge_tier,founding_cohort,reliability_score,repeat_sponsor_rate,would_hire_again_pct,bio,slug,plan,profile_views,avatar_url,gallery_images,available_for,causes,theme,cover_pattern,cover_tags,cover_spotlight_stat,avatar_shape').eq('id', profile.id).single(),
    sb.from('campaigns').select('name,objective,creator_confirmed,sponsor_confirmed,created_at,communication_rating,professionalism_rating,deliverable_quality_rating,would_hire_again').eq('creator_id', profile.id).order('created_at',{ascending:false}),
    sb.rpc('fn_creator_platform_summary', { p_creator_id: profile.id }),
    sb.rpc('fn_get_my_business_email'),
    sb.from('audience_demographics').select('dimension,label,pct').eq('creator_id', profile.id),
    sb.from('creator_collaborations').select('brand_name,logo_url,link').eq('creator_id', profile.id).order('display_order').order('created_at'),
    sb.from('creator_press_mentions').select('title,outlet_name,url,mention_date').eq('creator_id', profile.id).order('display_order').order('created_at'),
    sb.from('score_components').select('component_key,label,value,status').eq('creator_id', profile.id),
    sb.from('brand_safety_answers').select('question_key,answer').eq('creator_id', profile.id),
    sb.from('evidence_uploads').select('file_name,evidence_type,platform,status,uploaded_at').eq('creator_id', profile.id).neq('status','rejected').order('uploaded_at',{ascending:false}),
    sb.from('creator_rate_cards').select('deliverable_type,custom_label,price_cents').eq('creator_id', profile.id).order('sort_order').order('created_at'),
  ]);

  const verified = (campaigns||[]).filter(x=>x.creator_confirmed&&x.sponsor_confirmed);
  const ratedVerified = verified.filter(x => x.communication_rating != null || x.professionalism_rating != null || x.deliverable_quality_rating != null);
  const avgOf = (arr, key) => {
    const vals = arr.map(x=>x[key]).filter(v=>v!=null);
    return vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10 : null;
  };
  const whAnswered = verified.filter(x => x.would_hire_again != null);
  const reputationRatings = {
    communication: avgOf(ratedVerified, 'communication_rating'),
    professionalism: avgOf(ratedVerified, 'professionalism_rating'),
    deliverable_quality: avgOf(ratedVerified, 'deliverable_quality_rating'),
    would_hire_again_yes: whAnswered.filter(x=>x.would_hire_again===true).length,
    would_hire_again_total: whAnswered.length,
  };
  const platforms = (platformConnections||[]).filter(p=>p.follower_count!=null).sort((a,b)=>b.follower_count-a.follower_count);
  const audByDim = (dim) => (audience||[]).filter(r=>r.dimension===dim).sort((a,b)=>b.pct-a.pct).map(r=>({label:r.label,pct:r.pct}));
  // computeVerifiedSince (supabase-client.js) -- shared with profile.html
  // and dashboard.html so the calc isn't duplicated per page. Owner-mode
  // already has this data from fn_creator_platform_summary and doesn't
  // need a second query.
  const verifiedSince = computeVerifiedSince(platformConnections);

  const kit = {
    displayName: profile.display_name, bio: c.bio, niche: c.niche, location: c.location,
    businessEmail, trustScore: c.trust_score, confidence: c.confidence, badgeTier: c.badge_tier,
    foundingCohort: c.founding_cohort, verifiedCount: verified.length, reliabilityScore: c.reliability_score,
    wouldHireAgainPct: c.would_hire_again_pct, repeatSponsorRate: c.repeat_sponsor_rate,
    audienceCountries: audByDim('country'), audienceAges: audByDim('age'), audienceGenders: audByDim('gender'),
    platforms, campaigns: verified, avatarUrl: c.avatar_url, galleryImages: c.gallery_images || [],
    coverPattern: c.cover_pattern, coverTags: c.cover_tags || [], coverSpotlightStat: c.cover_spotlight_stat, avatarShape: c.avatar_shape,
    collaborations: collabs || [], pressMentions: press || [], availableFor: c.available_for || [], causes: c.causes || [], theme: c.theme,
    verifiedSince,
    scoreComponents: scoreComponents || [], brandSafetyAnswers: bsAnswers || [], evidence: evidenceRows || [],
    reputationRatings,
    rateCard: rateCardRows || [],
  };

  const link = `https://kitscore.co/media-kit/${c.slug || ''}`;
  document.getElementById('ownerBanner').innerHTML = `
    <div class="owner-banner">
      <span>This is your Verified Media Kit — <code id="ekLinkText">${escapeHtml(link)}</code></span>
      <div style="display:flex;gap:8px">
        <button class="tb-btn ghost" style="background:#fff;border:1px solid #C7D2FE;color:#3730A3" onclick="copyEveKitLink('${escapeHtml(link)}')">Copy link</button>
      </div>
    </div>
    ${c.plan === 'pro' ? `<div style="font-size:11.5px;color:#6B6B67;margin:-10px 0 16px">${c.profile_views || 0} view${c.profile_views===1?'':'s'} so far</div>`
      : `<div style="font-size:11.5px;color:#6B6B67;margin:-10px 0 16px">Want to know how many brands have opened this? <a href="pricing-creator.html" style="color:#2563EB">View analytics is a Pro perk →</a></div>`}
  `;

  document.getElementById('topbarActions').innerHTML = `
    <button class="tb-btn ghost" onclick="window.location.href='dashboard.html'">← Dashboard</button>
    ${themePickerHtml(kit.theme)}
    <button class="tb-btn" id="dlBtn" onclick="downloadEveKitPdf()">Download PDF</button>
  `;

  renderKit(kit, { isOwner: true, slug: c.slug });
}

function copyEveKitLink(link) {
  navigator.clipboard.writeText(link).then(() => {
    const el = document.getElementById('ekLinkText');
    const original = el.textContent;
    el.textContent = 'Copied!';
    setTimeout(() => { el.textContent = original; }, 1500);
  });
}

async function downloadEveKitPdf() {
  const btn = document.getElementById('dlBtn');
  if (!btn) return;
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Generating…';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/documents?type=evekit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` },
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      alert('Could not generate Verified Media Kit PDF: ' + (j.error || 'Unknown error'));
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kitscore-verified-media-kit.pdf'; a.click();
    URL.revokeObjectURL(url);
  } catch(err) {
    alert('Error generating Verified Media Kit PDF: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

// ── Public (slug) mode ───────────────────────────────────────────────────
async function loadPublicKit(slug) {
  const { data, error } = await sb.rpc('fn_get_evekit_profile', { p_slug: slug });
  const row = data && data[0];
  if (error || !row) {
    document.getElementById('content').innerHTML = `<div class="notfound">This Verified Media Kit doesn't exist or isn't public.</div>`;
    return;
  }
  document.getElementById('topbarActions').innerHTML = `<a href="/for-creators.html" class="tb-btn">Get your own free Verified Media Kit</a>`;
  const kit = {
    displayName: row.display_name, bio: row.bio, niche: row.niche, location: row.location,
    businessEmail: row.business_email, trustScore: row.trust_score, confidence: row.confidence,
    badgeTier: row.badge_tier, foundingCohort: row.founding_cohort, verifiedCount: Number(row.verified_campaign_count)||0,
    reliabilityScore: row.reliability_score,
    audienceCountries: row.audience_countries || [], audienceAges: row.audience_ages || [],
    audienceGenders: row.audience_genders || [],
    platforms: row.platforms || [], campaigns: row.campaigns || [],
    avatarUrl: row.avatar_url, galleryImages: row.gallery_images || [],
    coverPattern: row.cover_pattern, coverTags: row.cover_tags || [], coverSpotlightStat: row.cover_spotlight_stat, avatarShape: row.avatar_shape,
    collaborations: row.collaborations || [], pressMentions: row.press_mentions || [],
    availableFor: row.available_for || [], causes: row.causes || [], theme: row.theme,
    verifiedSince: row.verified_since,
    scoreComponents: row.score_components || [], brandSafetyAnswers: row.brand_safety_answers || [], evidence: row.evidence || [],
    wouldHireAgainPct: row.would_hire_again_pct, repeatSponsorRate: row.repeat_sponsor_rate,
    reputationRatings: row.reputation_ratings || {},
    rateCard: row.rate_card || [],
  };
  renderKit(kit, { isOwner: false, slug });

  // Only count views from visitors without an active session, so the
  // creator's own logins/previews never inflate their own view count.
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    sb.rpc('fn_increment_evekit_view', { p_slug: slug }).catch(() => {});
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (slug) { await loadPublicKit(slug); return; }

  // No slug in the URL: this is the owner opening their own EveKit from
  // the dashboard. Require a signed-in creator session.
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = 'auth.html'; return; }
  const { data: profile, error } = await sb.rpc('fn_get_my_profile');
  if (error || !profile || profile.role !== 'creator') { window.location.href = 'auth.html'; return; }
  await loadOwnerKit(profile);
}

init();
</script>
