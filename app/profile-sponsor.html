<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  .ptitle{font-size:16px;font-weight:500;margin-bottom:4px}
  .psub{font-size:12.5px;color:var(--color-text-tertiary);margin-bottom:20px}
  .card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:20px;max-width:480px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:4px}
  .field input{width:100%;padding:9px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-sm);font-size:13px;font-family:inherit;box-sizing:border-box}
  .field-hint{font-size:10.5px;color:var(--color-text-tertiary);margin-top:4px;line-height:1.5}
  .logo-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .logo-preview{width:56px;height:56px;border-radius:8px;object-fit:contain;background:#F9F8F5;border:0.5px dashed var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:var(--color-text-tertiary)}
  .logo-preview img{width:100%;height:100%;object-fit:contain}
  .cta{padding:9px 16px;background:#2563EB;color:#fff;border:none;border-radius:0;font-size:12px;font-weight:500;cursor:pointer}
  .cta:disabled{opacity:.6}
  .msg{font-size:11px;margin-top:10px;padding:8px;border-radius:0}
  .msg.error{background:#FDECEC;color:#B42318}
  .msg.ok{background:#E9F7EE;color:#1C7C3F}
  .loading{font-size:12px;color:var(--color-text-secondary)}
  .psec{margin:22px 0 14px;padding-top:16px;border-top:1px solid var(--color-border-tertiary)}
  .psec:first-of-type{margin-top:0;padding-top:0;border-top:none}
  .psec-title{font-size:12.5px;font-weight:600;color:var(--color-text-primary);margin-bottom:2px}
  .note{display:flex;gap:9px;background:#F5F8FF;border:0.5px solid #D9E4FB;padding:10px 12px;font-size:11.5px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:18px}
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-mount"></div>
  <div class="app-main">
    <div class="ptitle">Profile</div>
    <div class="psub">Shown on your sponsor decision memos, open briefs, and contracts.</div>
    <div class="card" id="formWrap"><div class="loading">Loading…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="nav.js?v=2"></script>
<script>
let profile, sponsor;

async function load() {
  profile = await requireRole('sponsor');
  if (!profile) return;
  renderSidebar('sponsor', 'profile-sponsor');

  const { data: s, error } = await sb.from('sponsors')
    .select('company_name, logo_url, contact_email')
    .eq('id', profile.id).maybeSingle();

  if (error) {
    document.getElementById('formWrap').innerHTML = `<div class="msg error">Could not load your profile: ${escapeHtml(error.message)}</div>`;
    return;
  }
  sponsor = s || { company_name: '', logo_url: '', contact_email: '' };
  render();
}

function render() {
  document.getElementById('formWrap').innerHTML = `
    <div class="note">This was previously set once at signup and couldn't be changed — it's editable now.</div>

    <div class="psec">
      <div class="psec-title">Company</div>
    </div>
    <div class="field">
      <label>Company name</label>
      <input id="companyName" value="${escapeHtml(sponsor.company_name || '')}" placeholder="e.g. Bloom Beverages">
      <div class="field-hint">Shown to creators on open briefs and contracts, and on your PDF sponsor decision memos.</div>
    </div>

    <div class="field">
      <label>Logo</label>
      <div class="logo-row">
        <div class="logo-preview" id="logoPreview">${sponsor.logo_url ? `<img src="${escapeHtml(sponsor.logo_url)}" onerror="this.parentElement.innerHTML='Broken'">` : 'No logo'}</div>
        <input id="logoUrl" value="${escapeHtml(sponsor.logo_url || '')}" placeholder="https://yourdomain.com/logo.png" oninput="previewLogo()" style="flex:1">
      </div>
      <div class="field-hint">${myTeamNote()}</div>
    </div>

    <div class="psec">
      <div class="psec-title">Contact</div>
    </div>
    <div class="field">
      <label>Business contact email <span style="color:var(--color-text-tertiary);font-weight:400">(optional)</span></label>
      <input id="contactEmail" type="email" value="${escapeHtml(sponsor.contact_email || '')}" placeholder="partnerships@yourcompany.com">
      <div class="field-hint">Separate from your login email — use this if creators or admin should reach a different inbox.</div>
    </div>

    <button class="cta" onclick="save()">Save changes</button>
    <div id="saveMsg"></div>
  `;
}

function myTeamNote() {
  return 'If you\'re on a team, your team\'s branding (set under Team → Branding) is used on white-labeled PDF memos instead of this logo.';
}

function previewLogo() {
  const url = document.getElementById('logoUrl').value.trim();
  const el = document.getElementById('logoPreview');
  el.innerHTML = url ? `<img src="${escapeHtml(url)}" onerror="this.parentElement.innerHTML='Broken'">` : 'No logo';
}

async function save() {
  const companyName = document.getElementById('companyName').value.trim();
  const logoUrl = document.getElementById('logoUrl').value.trim();
  const contactEmail = document.getElementById('contactEmail').value.trim();

  if (!companyName) { showMsg('saveMsg', 'Company name is required.', 'error'); return; }
  if (contactEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contactEmail)) {
    showMsg('saveMsg', 'That doesn\'t look like a valid email.', 'error'); return;
  }

  const { error } = await sb.from('sponsors').update({
    company_name: companyName,
    logo_url: logoUrl || null,
    contact_email: contactEmail || null,
  }).eq('id', profile.id);

  if (error) { showMsg('saveMsg', 'Could not save: ' + error.message, 'error'); return; }

  // The sidebar (nav.js) and every admin/creator-facing list show
  // profiles.display_name, not sponsors.company_name -- they were only
  // ever set to the same value once, at signup (handle_new_auth_user).
  // Keep them in sync here so editing company name actually shows up
  // everywhere it's displayed, not just on this form.
  const { error: nameErr } = await sb.from('profiles').update({ display_name: companyName }).eq('id', profile.id);
  if (nameErr) { showMsg('saveMsg', 'Saved company details, but the account name shown in your sidebar could not be updated: ' + nameErr.message, 'error'); return; }
  profile.display_name = companyName;
  renderSidebar('sponsor', 'profile-sponsor');

  sponsor = { company_name: companyName, logo_url: logoUrl, contact_email: contactEmail };
  showMsg('saveMsg', 'Saved.', 'ok');
}

function showMsg(id, text, type) {
  document.getElementById(id).innerHTML = `<div class="msg ${type}">${escapeHtml(text)}</div>`;
}

load();
</script>
</body>
</html>
