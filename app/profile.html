<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  :root{
    --pf-blue:#2755F0; --pf-blue-deep:#0B2A6B; --pf-navy:#0A1530; --pf-teal:#17B8A6;
    --pf-ink:#0B1220; --pf-ink-soft:#5B6472; --pf-ink-faint:#9AA3B2; --pf-line:#E6E9F0;
    --pf-radius:16px; --pf-shadow:0 1px 2px rgba(11,18,32,0.04), 0 8px 24px rgba(11,18,32,0.06);
  }
  .app-main{max-width:1040px}
  .pf h1,.pf h2,.pf h3,.pf .display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em}
  .pf{font-family:'Space Grotesk',sans-serif;color:var(--pf-ink)}
  .pf .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--pf-ink-faint)}
  .pf-topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap}
  .pf-topbar h1{font-size:23px;margin:0 0 4px}
  .pf-topbar p{margin:0;color:var(--pf-ink-soft);font-size:13.5px}
  .pf-top-actions{display:flex;gap:8px;flex-shrink:0}
  .pf-btn{border:1px solid var(--pf-line);background:#fff;color:var(--pf-ink);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;font-family:inherit}
  .pf-btn:hover{border-color:#C9D3E6;box-shadow:0 4px 12px rgba(11,18,32,0.06)}
  .pf-btn-primary{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(39,85,240,0.28)}

  .pf-hero{background:linear-gradient(135deg,var(--pf-blue-deep) 0%,#142B63 55%,#0E3350 100%);border-radius:20px;padding:28px 30px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 50px -18px rgba(11,42,107,0.55);margin-bottom:22px}
  .pf-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 240px at 85% -10%, rgba(23,184,166,0.25), transparent 60%);pointer-events:none}
  .pf-avatar-wrap{position:relative;width:82px;height:82px;flex-shrink:0}
  .pf-avatar{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#3E63F5,#17B8A6);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:#fff;border:3px solid rgba(255,255,255,0.25);overflow:hidden}
  .pf-avatar img{width:100%;height:100%;object-fit:cover}
  .pf-avatar-edit{position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;background:#0B1220;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;font-size:11px}
  .pf-avatar-edit input{display:none}
  .pf-name-row{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
  .pf-name-row h2{font-size:21px;margin:0;color:#fff}
  .pf-badge-founding{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#3C2E0A;background:linear-gradient(180deg,#FFE8A3,#F0B429);padding:4px 10px 4px 6px;border-radius:100px}
  .pf-handle{color:#AFC0E6;font-size:13px;margin-bottom:4px}
  .pf-verified-since{color:#8FD6C8;font-size:11.5px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:5px}
  .pf-platform-row{display:flex;gap:7px;flex-wrap:wrap}
  .pf-plat-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);padding:5px 10px;border-radius:100px;font-size:12px;color:#EAF0FF;font-weight:500}
  .pf-plat-chip svg{width:12px;height:12px}

  .pf-score-card{text-align:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:16px 22px}
  .pf-ring-wrap{position:relative;width:98px;height:98px;margin:0 auto 6px}
  .pf-ring-wrap svg{transform:rotate(-90deg)}
  .pf-ring-bg{fill:none;stroke:rgba(255,255,255,0.12);stroke-width:8}
  .pf-ring-fg{fill:none;stroke-width:8;stroke-linecap:round;stroke:url(#pfRingGrad);transition:stroke-dashoffset 1s ease}
  .pf-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pf-ring-center .num{font-family:'Fraunces',serif;font-size:27px;font-weight:700;line-height:1;color:#fff}
  .pf-ring-center .out{font-size:10px;color:#9FB0D6;margin-top:1px}
  .pf-score-label{font-size:11.5px;color:#AFC0E6;font-weight:600}

  .pf-tabs{display:flex;gap:6px;border-bottom:1px solid var(--pf-line);margin-bottom:22px;flex-wrap:wrap}
  .pf-tab{padding:11px 4px;margin-right:20px;font-size:13.5px;font-weight:600;color:var(--pf-ink-faint);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
  .pf-tab:hover{color:var(--pf-ink)}
  .pf-tab.active{color:var(--pf-blue-deep);border-bottom-color:var(--pf-blue)}
  .pf-tab .pct{font-size:10.5px;background:#F6F8FB;border:1px solid var(--pf-line);padding:1px 6px;border-radius:100px;color:var(--pf-ink-soft);font-weight:600}
  .pf-tab.active .pct{background:rgba(39,85,240,0.1);border-color:transparent;color:var(--pf-blue)}
  .pf-panel{display:none}
  .pf-panel.active{display:block}

  .pf-grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  @media(max-width:820px){.pf-grid-2{grid-template-columns:1fr}}
  .pf-card{background:#fff;border:1px solid var(--pf-line);border-radius:var(--pf-radius);padding:22px 24px;box-shadow:var(--pf-shadow);margin-bottom:18px}
  .pf-card h3{font-size:15px;margin:0 0 4px}
  .pf-card .desc{color:var(--pf-ink-soft);font-size:12.5px;margin:0 0 16px}

  .pf-check-item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--pf-line)}
  .pf-check-item:last-child{border-bottom:none}
  .pf-check-icon{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .pf-check-icon.done{background:rgba(23,184,166,0.12);color:var(--pf-teal)}
  .pf-check-icon.todo{background:#F6F8FB;color:var(--pf-ink-faint);border:1px solid var(--pf-line)}
  .pf-check-icon svg{width:14px;height:14px}
  .pf-check-body{flex:1;min-width:0}
  .pf-check-body .t{font-size:13.5px;font-weight:600}
  .pf-check-body .s{font-size:12px;color:var(--pf-ink-soft)}
  .pf-check-cta{font-size:12px;font-weight:600;color:var(--pf-blue);white-space:nowrap;text-decoration:none}
  .pf-check-cta.done{color:var(--pf-teal)}
  .pf-progress-track{height:7px;border-radius:100px;background:#F6F8FB;border:1px solid var(--pf-line);overflow:hidden;margin:12px 0 6px}
  .pf-progress-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--pf-blue),var(--pf-teal))}

  .pf-field{margin-bottom:14px}
  .pf-field label{display:block;font-size:11.5px;font-weight:600;color:var(--pf-ink);margin-bottom:5px}
  .pf-field label .opt{font-weight:400;color:var(--pf-ink-faint)}
  .pf-field input,.pf-field select,.pf-field textarea{font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--pf-line);border-radius:10px;background:#fff;color:var(--pf-ink);width:100%}
  .pf-field input:focus,.pf-field select:focus,.pf-field textarea:focus{outline:none;border-color:var(--pf-blue);box-shadow:0 0 0 3px rgba(39,85,240,0.12)}
  .pf-field textarea{resize:vertical;min-height:76px;line-height:1.5}
  .pf-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.pf-form-grid{grid-template-columns:1fr}}
  .pf-char-count{font-size:11px;color:var(--pf-ink-faint);text-align:right;margin-top:-8px;margin-bottom:10px}

  .pf-platform-grid{display:flex;flex-direction:column;gap:10px}
  .pf-plat-row{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--pf-line);border-radius:12px}
  .pf-plat-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .pf-plat-ico svg{width:17px;height:17px}
  .pf-plat-info{flex:1;min-width:0}
  .pf-plat-info .n{font-size:13px;font-weight:600}
  .pf-plat-info .m{font-size:11.5px;color:var(--pf-ink-soft)}
  .pf-plat-status{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:100px;white-space:nowrap}
  .pf-plat-status.connected{background:rgba(23,184,166,0.12);color:#0F9C8C}

  .pf-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:600px){.pf-stat-row{grid-template-columns:1fr}}
  .pf-stat{background:#fff;border:1px solid var(--pf-line);border-radius:14px;padding:16px 18px;box-shadow:var(--pf-shadow)}
  .pf-stat .val{font-family:'Fraunces',serif;font-size:23px;font-weight:600}
  .pf-stripe-card{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0B1220,#1B2542);border-radius:14px;padding:16px 20px;color:#fff;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .pf-stripe-left{display:flex;align-items:center;gap:12px}
  .pf-stripe-mark{width:32px;height:32px;border-radius:9px;background:#635BFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;flex-shrink:0}
  .pf-stripe-badge{background:rgba(23,184,166,0.18);color:#7EEAD9;border:1px solid rgba(23,184,166,0.4);font-size:11px;font-weight:600;padding:4px 9px;border-radius:100px;white-space:nowrap}
  .pf-earn-spark{background:#F6F8FB;border:1px solid var(--pf-line);border-radius:14px;padding:14px 16px 10px;margin:4px 0 16px}
  .pf-earn-spark-head{font-size:11.5px;color:var(--pf-ink-soft);font-weight:600;margin-bottom:12px}
  .pf-spark-bars{display:flex;align-items:flex-end;gap:10px;height:60px}
  .pf-spark-bar{flex:1;background:linear-gradient(180deg,#C7D4F5,#DCE4F7);border-radius:5px 5px 2px 2px;position:relative;min-height:4px;display:flex;align-items:flex-end;justify-content:center}
  .pf-spark-bar.highlight{background:linear-gradient(180deg,var(--pf-blue),#3E63F5)}
  .pf-spark-bar span{position:absolute;bottom:-18px;font-size:10px;color:var(--pf-ink-faint);font-weight:600;white-space:nowrap}
  .pf-mk-hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#F0F4FF,#EAF9F6);border:1px solid var(--pf-line);border-radius:16px;padding:20px 24px;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .pf-mk-hero .t{font-size:15px;font-weight:600;font-family:'Fraunces',serif}
  .pf-mk-hero .s{font-size:12.5px;color:var(--pf-ink-soft);margin-top:3px}
  .pf-mk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:700px){.pf-mk-grid{grid-template-columns:repeat(2,1fr)}}
  .pf-mk-stat{background:#fff;border:1px solid var(--pf-line);border-radius:14px;padding:14px 16px;box-shadow:var(--pf-shadow)}
  .pf-mk-stat .val{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
  .pf-mk-stat .lab{font-size:11.5px;color:var(--pf-ink-soft);margin-top:2px}
  table.pf-payout-table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.pf-payout-table th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--pf-ink-faint);padding:0 8px 8px;font-weight:600}
  table.pf-payout-table td{padding:11px 8px;border-top:1px solid var(--pf-line)}
  .pf-pay-status{font-size:11px;font-weight:600;padding:3px 8px;border-radius:100px;white-space:nowrap}
  .pf-pay-status.paid{background:rgba(23,184,166,0.12);color:#0F9C8C}
  .pf-pay-status.escrow{background:rgba(39,85,240,0.1);color:var(--pf-blue)}

  .pf-breakdown-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--pf-line)}
  .pf-breakdown-row:last-child{border-bottom:none}
  .pf-breakdown-row .lab{width:150px;font-size:12.5px;font-weight:600;flex-shrink:0}
  .pf-bd-track{flex:1;height:6px;background:#F6F8FB;border-radius:100px;overflow:hidden;border:1px solid var(--pf-line)}
  .pf-bd-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--pf-blue),var(--pf-teal))}
  .pf-breakdown-row .sc{width:30px;text-align:right;font-size:12.5px;font-weight:700;color:var(--pf-blue-deep)}

  .pf-gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:480px){.pf-gallery-grid{grid-template-columns:repeat(2,1fr)}}
  .pf-gallery-slot{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--pf-line);display:flex;align-items:center;justify-content:center;color:var(--pf-ink-faint);position:relative;overflow:hidden;background:#F6F8FB;font-size:20px;cursor:pointer}
  .pf-gallery-slot.filled{border-style:solid;padding:0}
  .pf-gallery-slot img{width:100%;height:100%;object-fit:cover;display:block}
  .pf-gallery-slot input{display:none}
  .pf-gallery-remove{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:rgba(11,18,32,0.65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}

  .pf-pill-group{display:flex;flex-wrap:wrap;gap:7px}
  .pf-pill-opt{padding:7px 14px;border-radius:9px;border:1px solid var(--pf-line);font-size:12px;font-weight:600;color:var(--pf-ink-soft);background:#fff;cursor:pointer;font-family:inherit}
  .pf-pill-opt.selected{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border-color:transparent}
  .pf-tag-pill{padding:6px 13px;border-radius:100px;border:1px solid var(--pf-line);font-size:11.5px;font-weight:600;color:var(--pf-ink-soft);background:#fff;cursor:pointer;font-family:inherit}
  .pf-tag-pill.selected{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border-color:transparent}
  .pf-tag-pill:disabled{opacity:.4;cursor:default}
  .pf-tag-counter{font-size:11px;color:var(--pf-ink-faint);margin-top:8px}
  .pf-two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:700px){.pf-two-col{grid-template-columns:1fr}}
  .pf-section-sub{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--pf-ink-faint);margin:22px 0 10px}
  .pf-section-sub:first-child{margin-top:0}

  .pf-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 6px;border:1px solid var(--pf-line);border-radius:10px;font-size:12.5px;font-weight:600;margin:0 7px 7px 0;background:#fff}
  .pf-chip-avatar{width:22px;height:22px;border-radius:6px;background:#F6F8FB;color:var(--pf-ink-soft);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;object-fit:contain}
  .pf-chip-x{color:var(--pf-ink-faint);font-size:13px;line-height:1;padding:0 4px 0 1px;cursor:pointer}
  .pf-chip.simple{padding:7px 11px;background:#F6F8FB}
  .pf-press-item{border:1px solid var(--pf-line);border-radius:11px;padding:11px 13px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pf-press-item .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pf-press-item .s{font-size:11px;color:var(--pf-ink-faint)}
  .pf-add-input-row{display:flex;gap:8px;margin-top:9px}
  .pf-add-input-row input{flex:1;font-size:12.5px;padding:9px 12px;border:1px solid var(--pf-line);border-radius:9px;font-family:inherit}
  .pf-btn-add{padding:9px 16px;border-radius:9px;background:var(--pf-blue-deep);color:#fff;border:none;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit}
  .pf-empty{font-size:12px;color:var(--pf-ink-faint)}

  .pf-padd summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--pf-blue);list-style:none;padding:6px 0;user-select:none}
  .pf-padd summary::-webkit-details-marker{display:none}
  .pf-padd summary::before{content:'+ ';font-weight:700}
  .pf-padd[open] summary::before{content:'– '}
  .pf-padd[open] summary{margin-bottom:8px}

  .pf-save-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--pf-line)}
  .pf-save-hint{font-size:11.5px;color:var(--pf-ink-faint);margin-right:auto}
  .pf-btn-save{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border:none;padding:10px 22px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 6px 18px rgba(39,85,240,0.28);cursor:pointer;font-family:inherit}
  .pf-btn-save:disabled{opacity:.6}

  .pf-msg{font-size:11.5px;margin-top:8px}
  .pf-status-banner{display:flex;align-items:center;gap:8px;padding:12px 15px;border-radius:11px;font-size:13px;font-weight:600;margin:14px 0}
  .pf-status-banner svg{width:15px;height:15px;flex-shrink:0}
  .pf-status-banner.ready{background:rgba(23,184,166,0.12);color:#0F9C8C;border:1px solid rgba(23,184,166,0.28)}
  .pf-status-banner.pending{background:#FFF7E6;color:#8A5B0A;border:1px solid #F0DDA8}

  .pf-link-box{display:flex;align-items:center;gap:10px;background:#F6F8FB;border:1px solid var(--pf-line);border-radius:12px;padding:11px 13px;margin-bottom:14px;flex-wrap:wrap}
  .pf-link-box .url{flex:1;font-size:12.5px;color:var(--pf-ink-soft);font-family:monospace;min-width:180px}
  .pf-link-box .url b{color:var(--pf-ink);font-family:'Space Grotesk',sans-serif}
  .pf-copy-btn{font-size:12px;font-weight:600;color:#fff;background:var(--pf-blue-deep);padding:8px 13px;border-radius:8px;border:none;cursor:pointer;font-family:inherit}
  .pf-embed-box{background:#0B1220;border-radius:12px;padding:14px 16px;color:#8CE0D4;font-family:monospace;font-size:11.5px;line-height:1.7;overflow-x:auto}
  .pf-embed-box .tag{color:#7FA0FF}
  .pf-embed-box .attr{color:#5FD6C4}
  .pf-embed-box .str{color:#8CE0D4}
  .pf-qr-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .pf-qr-box{width:140px;height:140px;border-radius:14px;overflow:hidden;background:#0B1220;display:flex;align-items:center;justify-content:center}
  .pf-qr-box img{width:100%;height:100%;display:block}

  .pf-pro-card{border:1px solid rgba(39,85,240,0.22);background:linear-gradient(180deg,#F5F8FF,#FFFFFF)}
  .pf-pro-badge{display:inline-flex;align-items:center;background:linear-gradient(135deg,var(--pf-blue-deep),var(--pf-blue));color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:100px;margin-left:8px}
  .pf-locked-wrap{position:relative}
  .pf-locked-content{filter:blur(6px);opacity:.55;pointer-events:none;user-select:none}
  .pf-lock-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;padding:16px}
  .pf-lock-icon{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pf-blue-deep),var(--pf-blue));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .pf-lock-icon svg{width:17px;height:17px}
  .pf-lock-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600}
  .pf-lock-sub{font-size:12.5px;color:var(--pf-ink-soft);max-width:300px;line-height:1.5;margin-bottom:4px}
  .pf-btn-upgrade{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}

  @media (max-width:900px){

let profile, creator, collaborations = [], pressMentions = [], scoreComponents = [], platforms = [], payoutHistory = [];

const PLATFORM_META = {
  youtube: { label: 'YouTube', color: '#FF3B30', icon: '<path d="M22 8.4a2.9 2.9 0 0 0-2-2C18.2 6 12 6 12 6s-6.2 0-8 .4a2.9 2.9 0 0 0-2 2A31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.6a2.9 2.9 0 0 0 2 2c1.8.4 8 .4 8 .4s6.2 0 8-.4a2.9 2.9 0 0 0 2-2A31 31 0 0 0 22.4 12 31 31 0 0 0 22 8.4zM9.8 15V9l5.4 3z"/>' },
  tiktok: { label: 'TikTok', color: '#111827', icon: '<path d="M16.5 2h-3v14a2.7 2.7 0 1 1-2.7-2.7c.3 0 .5 0 .8.1V10a6 6 0 1 0 5 5.9V8.9a7.5 7.5 0 0 0 4.4 1.4V7.2A4.7 4.7 0 0 1 16.5 2z"/>' },

  twitch: { label: 'Twitch', color: '#8B5CF6', icon: '<path d="M4 4h6v6.4a5.6 5.6 0 1 1-2-4.4V4H4zm10 0h6v6a6 6 0 0 1-6-6z"/>' },
  discord: { label: 'Discord', color: '#5865F2', icon: '<path d="M8 12a1.3 1.3 0 1 1 0-2.6A1.3 1.3 0 0 1 8 12zm8 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zM6 5l-2 3v9l3 2 1-2h8l1 2 3-2V8l-2-3-4-1-1 2h-2L9 4z"/>' },
};

function platformIcon(key) {
  const m = PLATFORM_META[key];
  return `<svg viewBox="0 0 24 24" fill="currentColor">${m ? m.icon : ''}</svg>`;
}

function platformFollowerCount(p) {
  return p.subscriber_count || p.follower_count || 0;
}

function fmtCount(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

async function load() {
  profile = await requireRole('creator');
  if (!profile) return;
  renderSidebar('creator', 'profile');

  const [{ data: c }, { data: email }, { data: collabs }, { data: press }, { data: comps }, { data: plats }, { data: contracts }] = await Promise.all([
    sb.from('creators').select('niche, location, founding_cohort, bio, slug, plan, avatar_url, gallery_images, available_for, causes, profile_views, stripe_connect_account_id, stripe_connect_charges_enabled, stripe_connect_payouts_enabled, stripe_connect_details_submitted, cover_pattern, cover_tags, cover_spotlight_stat, avatar_shape, trust_score, confidence').eq('id', profile.id).single(),
    sb.rpc('fn_get_my_business_email'),
    sb.from('creator_collaborations').select('id, brand_name, logo_url, link').eq('creator_id', profile.id).order('display_order').order('created_at'),
    sb.from('creator_press_mentions').select('id, title, outlet_name, url, mention_date').eq('creator_id', profile.id).order('display_order').order('created_at'),
    sb.from('score_components').select('component_key, label, value, status').eq('creator_id', profile.id).order('value', { ascending: false }),
    sb.from('platform_connections').select('platform, platform_handle, follower_count, subscriber_count, last_synced_at, verification_method, connected_at').eq('creator_id', profile.id),
    sb.from('contracts').select('id, title, escrow_status, escrow_amount_cents, escrow_released_cents, funded_at, released_at, sponsors(company_name)').eq('creator_id', profile.id).not('escrow_status', 'is', null).order('funded_at', { ascending: false }),
  ]);
  creator = { ...c, business_email: email };
  collaborations = collabs || [];
  pressMentions = press || [];
  scoreComponents = comps || [];
  platforms = plats || [];
  payoutHistory = contracts || [];

  document.getElementById('previewLink').href = creator.slug ? `/p/${creator.slug}` : '#';

  renderHero();
  renderAccountPanel();
  renderPayoutPanel();
  document.getElementById('tabsRow').style.display = '';

  if (creator.stripe_connect_payouts_enabled) loadBalance();
}

    <div class="pf-avatar-wrap">

function renderPayoutStatus() {
  if (creator.stripe_connect_payouts_enabled) {
    return `<div class="pf-status-banner ready">${svgIcon('check', { size: 15 })}Payouts ready — sponsors can fund and release escrow to you.</div>`;

  }
  return `<button class="pf-btn pf-btn-primary" onclick="connectPayouts()">Connect payout account</button>`;
}

function renderPayoutHistoryTable() {
  if (!payoutHistory.length) return `<div class="pf-empty">No escrow activity yet — it'll show up here once a sponsor funds a contract.</div>`;
  return `
    <table class="pf-payout-table">
      <tr><th>Sponsor</th><th>Deal</th><th>Amount</th><th>Status</th><th>Date</th></tr>
      ${payoutHistory.map(c => {
        const isReleased = c.escrow_status === 'released' || c.escrow_status === 'partially_released';
        const cents = isReleased ? (c.escrow_released_cents || c.escrow_amount_cents) : c.escrow_amount_cents;
        const amount = `$${((cents || 0) / 100).toFixed(2)}`;
        const date = c.released_at || c.funded_at;
        return `<tr>
          <td>${escapeHtml(c.sponsors?.company_name || 'Sponsor')}</td>
          <td>${escapeHtml(c.title || 'Contract')}</td>
          <td>${amount}</td>
          <td><span class="pf-pay-status ${isReleased ? 'paid' : 'escrow'}">${isReleased ? 'Paid' : 'In escrow'}</span></td>
          <td>${date ? new Date(date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'}</td>
        </tr>`;
      }).join('')}
    </table>
  `;
}

function lifetimeEarnedCents() {
  return payoutHistory.reduce((sum, c) => {
    if (c.escrow_status === 'released' || c.escrow_status === 'partially_released') {
      return sum + (c.escrow_released_cents || 0);
    }
    return sum;
  }, 0);
}

function last6MonthsEarnings() {
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleDateString('en-GB', { month: 'short' }), cents: 0 });
  }
  const byKey = Object.fromEntries(months.map(m => [m.key, m]));
  payoutHistory.forEach(c => {
    if (!c.released_at || !(c.escrow_status === 'released' || c.escrow_status === 'partially_released')) return;
    const d = new Date(c.released_at);
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    if (byKey[key]) byKey[key].cents += (c.escrow_released_cents || 0);
  });
  return months;
}

function renderEarningsSparkline() {
  const months = last6MonthsEarnings();
  const max = Math.max(1, ...months.map(m => m.cents));
  return `
    <div class="pf-earn-spark">
      <div class="pf-earn-spark-head">Earnings, last 6 months</div>
      <div class="pf-spark-bars">
        ${months.map((m, i) => `<div class="pf-spark-bar ${i === months.length - 1 ? 'highlight' : ''}" style="height:${Math.max(4, Math.round((m.cents / max) * 100))}%"><span>${m.label}</span></div>`).join('')}
      </div>
    </div>
  `;
}

function renderPayoutPanel() {
  const lifetimeCents = lifetimeEarnedCents();
  document.getElementById('panel-payout').innerHTML = `

      ${renderEarningsSparkline()}

    <div class="pf-card">
      <h3>Payout history</h3>
      <p class="desc">Every release is logged with the sponsor deal it came from.</p>
      ${renderPayoutHistoryTable()}
    </div>
  `;
}

async function downloadEveKitPdf() {
  const btn = document.getElementById('dlBtn');
  if (!btn) return;
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Generating…';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/documents?type=evekit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` },
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      alert('Could not generate Verified Media Kit PDF: ' + (j.error || 'Unknown error'));
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kitscore-verified-media-kit.pdf'; a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Error generating Verified Media Kit PDF: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

function totalReach() {
  return platforms.reduce((sum, p) => sum + platformFollowerCount(p), 0);

function avgEngagementQuality() {
  const rows = scoreComponents.filter(c => c.component_key.startsWith('engagement_quality'));
  if (!rows.length) return null;
  return Math.round(rows.reduce((sum, c) => sum + Number(c.value), 0) / rows.length);
}
function avgViewsPerPost() {
  const totalViews = platforms.reduce((sum, p) => sum + (p.view_count || 0), 0);
  const totalVideos = platforms.reduce((sum, p) => sum + (p.video_count || 0), 0);
  return totalVideos > 0 ? Math.round(totalViews / totalVideos) : 0;
}

// ── Save (Account + Media Kit fields) ──────────────────────────────────
async function save() {
  const btn = document.getElementById('saveBtn');
  if (btn) btn.disabled = true;

  const displayName = document.getElementById('displayName').value.trim();
  const niche = document.getElementById('niche').value.trim();
  const location = document.getElementById('location').value.trim();
  const businessEmail = document.getElementById('businessEmail').value.trim();
  const bioEl = document.getElementById('bio');
  const bio = bioEl ? bioEl.value.trim() : creator.bio;

  const [{ error: pErr }, { error: cErr }] = await Promise.all([
    sb.from('profiles').update({ display_name: displayName }).eq('id', profile.id),
    sb.from('creators').update({ niche, location, business_email: businessEmail, bio }).eq('id', profile.id),
  ]);

  profile.display_name = displayName;
  creator.niche = niche;
  creator.location = location;
  creator.business_email = businessEmail;
  creator.bio = bio;

  const msg = document.getElementById('msg');
  if (pErr || cErr) {
    if (msg) msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Could not save: ${escapeHtml((pErr || cErr).message)}</div>`;
  } else {
    if (msg) msg.innerHTML = `<div class="pf-msg" style="color:#1C7C3F">Saved.</div>`;
    renderHero();
  }
  if (btn) btn.disabled = false;
}

async function saveSlug() {
  const input = document.getElementById('customSlug');
  const msg = document.getElementById('slugMsg');
  const val = input.value.trim();
  msg.innerHTML = '';
  const { data, error } = await sb.rpc('fn_set_evekit_slug', { p_slug: val });
  if (error) {
    msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Could not save: ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!data || !data.ok) {
    msg.innerHTML = `<div class="pf-msg" style="color:#B42318">${escapeHtml(data?.error || 'Could not save that link.')}</div>`;
    return;
  }
  creator.slug = data.slug;
  input.value = data.slug;
  msg.innerHTML = `<div class="pf-msg" style="color:#1C7C3F">Saved — your Verified Media Kit and trust link now use this URL.</div>`;
  renderHero();
  renderSharePanel();
}

// ── Avatar / gallery uploads ────────────────────────────────────────────
const MAX_GALLERY = 4;

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!ALLOWED_TYPES.includes(file.type)) { alert('Please upload a JPG, PNG, or WebP image.'); return; }
  if (file.size > MAX_UPLOAD_BYTES) { alert('That photo is over 5MB — try a smaller file.'); return; }
  const path = `${profile.id}/avatar-${Date.now()}.${extFor(file)}`;
  const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
  if (upErr) { alert('Upload failed: ' + upErr.message); return; }
  const { data: pub } = sb.storage.from('creator-media').getPublicUrl(path);
  const { error: dbErr } = await sb.from('creators').update({ avatar_url: pub.publicUrl }).eq('id', profile.id);
  if (dbErr) { alert("Saved the photo but couldn't update your profile: " + dbErr.message); return; }
  creator.avatar_url = pub.publicUrl;
  renderHero();
}

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  const images = creator.gallery_images || [];
  let html = images.map((url, i) => `
    <div class="pf-gallery-slot filled">
      <img src="${escapeHtml(url)}">
      <div class="pf-gallery-remove" onclick="removeGalleryImage(${i})" title="Remove">✕</div>
    </div>`).join('');
  if (images.length < MAX_GALLERY) {
    html += `
      <label class="pf-gallery-slot">
        <span>+</span>
        <input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadGalleryImage(event)">
      </label>`;
  }
  grid.innerHTML = html;
}

async function uploadGalleryImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!ALLOWED_TYPES.includes(file.type)) { alert('Please upload a JPG, PNG, or WebP image.'); return; }
  if (file.size > MAX_UPLOAD_BYTES) { alert('That photo is over 5MB — try a smaller file.'); return; }
  const images = creator.gallery_images || [];
  if (images.length >= MAX_GALLERY) return;
  const path = `${profile.id}/gallery-${Date.now()}.${extFor(file)}`;
  const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
  if (upErr) { alert('Upload failed: ' + upErr.message); return; }
  const { data: pub } = sb.storage.from('creator-media').getPublicUrl(path);
  const updated = [...images, pub.publicUrl];
  const { error: dbErr } = await sb.from('creators').update({ gallery_images: updated }).eq('id', profile.id);
  if (dbErr) { alert("Saved the photo but couldn't update your gallery: " + dbErr.message); return; }
  creator.gallery_images = updated;
  renderGallery();
}

async function removeGalleryImage(index) {
  const images = [...(creator.gallery_images || [])];
  images.splice(index, 1);
  const { error } = await sb.from('creators').update({ gallery_images: images }).eq('id', profile.id);
  if (error) { alert('Could not remove photo: ' + error.message); return; }
  creator.gallery_images = images;
  renderGallery();
}

async function addCollaboration() {
  const msg = document.getElementById('collabMsg');
  msg.innerHTML = '';
  const brandName = document.getElementById('collabBrandName').value.trim();
  const link = document.getElementById('collabLink').value.trim();
  const fileInput = document.getElementById('collabLogoInput');
  const file = fileInput.files[0];

  if (!brandName) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Brand name is required.</div>`; return; }
  if (file) {
    if (!ALLOWED_TYPES.includes(file.type)) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Please upload a JPG, PNG, or WebP logo.</div>`; return; }
    if (file.size > MAX_UPLOAD_BYTES) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">That logo is over 5MB — try a smaller file.</div>`; return; }
  }

  let logoUrl = null;
  if (file) {
    const path = `${profile.id}/logo-${Date.now()}.${extFor(file)}`;
    const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
    if (upErr) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Logo upload failed: ${escapeHtml(upErr.message)}</div>`; return; }
    logoUrl = sb.storage.from('creator-media').getPublicUrl(path).data.publicUrl;
  }

  const { data, error } = await sb.from('creator_collaborations')
    .insert({ creator_id: profile.id, brand_name: brandName, logo_url: logoUrl, link: link || null, display_order: collaborations.length })
    .select('id, brand_name, logo_url, link').single();
  if (error) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Could not save: ${escapeHtml(error.message)}</div>`; return; }

  collaborations.push(data);
  document.getElementById('collabBrandName').value = '';
  document.getElementById('collabLink').value = '';
  fileInput.value = '';
  renderCollaborations();
  msg.innerHTML = `<div class="pf-msg" style="color:#1C7C3F">Added.</div>`;
}

  collaborations = collaborations.filter(c => c.id !== id);
  renderCollaborations();
}

  if (!box) return;
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/escrow?action=balance', { headers: { 'Authorization': `Bearer ${session?.access_token}` } });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || !j.connected) { box.style.display = 'none'; return; }

  const fmt = (cents) => `$${(cents / 100).toFixed(2)}`;
  const nextPayout = j.payouts.find(p => p.status === 'pending' || p.status === 'in_transit');

  box.innerHTML = `
    <div class="pf-stat-row" style="margin-top:12px;margin-bottom:6px">
      <div class="pf-stat"><div class="eyebrow">Available</div><div class="val">${fmt(j.availableCents)}</div></div>
      <div class="pf-stat"><div class="eyebrow">Pending</div><div class="val">${fmt(j.pendingCents)}</div></div>
      <div class="pf-stat"><div class="eyebrow">Lifetime earned</div><div class="val">${fmt(lifetimeEarnedCents())}</div></div>
    </div>
    ${nextPayout ? `<div style="font-size:12.5px;color:var(--pf-ink-soft)">Next payout: ${fmt(nextPayout.amountCents)} — expected ${new Date(nextPayout.arrivalDate).toLocaleDateString()}</div>` : ''}
    ${j.pendingCents > 0 ? `<div style="margin-top:8px;font-size:11.5px;color:var(--pf-ink-faint);line-height:1.5">A sponsor releasing your payment moves it here right away, but Stripe holds new payments as "Pending" for a few days before they're payable out. It'll move to "Available" on its own.</div>` : ''}
    <a href="#" onclick="openExpressDashboard(event, this)" style="display:inline-block;margin-top:10px;font-size:12px;color:var(--pf-blue);font-weight:600">See your full payout history &amp; schedule in Stripe →</a>
  `;
}

async function openExpressDashboard(e, linkEl) {
  e.preventDefault();
  const original = linkEl.textContent;
  linkEl.textContent = 'Opening…';
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/escrow?action=express-dashboard-link', { method: 'POST', headers: { 'Authorization': `Bearer ${session?.access_token}` } });
  const j = await res.json().catch(() => ({}));
  linkEl.textContent = original;
  if (!res.ok) { alert(j.error || 'Could not open Stripe dashboard.'); return; }
  window.open(j.url, '_blank');
}

async function connectPayouts() {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/escrow?action=connect-onboarding', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` } });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { alert(j.error || 'Could not start payout setup.'); return; }
  window.location.href = j.url;
}

async function refreshConnectStatusIfReturning() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('connect') !== 'return' && params.get('connect') !== 'refresh') return;
  const { data: { session } } = await sb.auth.getSession();
  await fetch('/api/escrow?action=refresh-connect-status', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` } }).catch(() => {});
  window.history.replaceState({}, '', window.location.pathname);
  await load();
}

load().then(refreshConnectStatusIfReturning);
</script>
</body>
</html>
