<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Kitscore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  :root{ --color-accent:#2755F0; --color-accent-2:#17B8A6; --color-blue-deep:#0B2A6B; --font-sans:'Space Grotesk',sans-serif; }
  body{background:#F6F8FB;font-family:'Space Grotesk',sans-serif;}
  .app-main{padding:36px 44px 80px}
  .ptitle{font-family:'Fraunces',serif;font-size:26px;font-weight:600;letter-spacing:-0.01em;margin-bottom:20px;color:var(--color-text-primary)}
  .card{border:1px solid var(--color-border-tertiary);border-radius:16px;padding:24px 26px;max-width:none;
    background:#fff;box-shadow:0 1px 2px rgba(11,18,32,0.04), 0 8px 24px rgba(11,18,32,0.06);}
  .side-panel{padding:24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--color-text-secondary);margin-bottom:5px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--color-border-tertiary);border-radius:11px;font-size:13.5px;transition:border-color .15s, box-shadow .15s}
  .field input:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px rgba(37,99,235,0.12)}
  .psec{margin:30px 0 16px;padding-top:22px;border-top:1px solid var(--color-border-tertiary)}
  .psec:first-of-type{margin-top:24px;padding-top:0;border-top:none}
  .psec-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--color-text-primary)}
  .psec-sub{font-size:12px;color:var(--color-text-tertiary);margin-top:3px;line-height:1.55}
  .subcard{border:1px solid var(--color-border-tertiary);border-radius:14px;padding:20px 22px;margin-bottom:20px;background:#fff;box-shadow:0 1px 2px rgba(20,25,40,0.02)}
  .subcard .psec-title{font-size:15px}
  .prow2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.prow2{grid-template-columns:1fr}}
  .padd summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--color-accent);list-style:none;padding:6px 0;user-select:none}
  .padd summary::-webkit-details-marker{display:none}
  .padd summary::before{content:'+ ';font-weight:700}
  .padd[open] summary::before{content:'– '}
  .padd[open] summary{margin-bottom:8px}
  .cta{padding:11px 20px;background:linear-gradient(135deg,var(--color-accent),#3E63F5);color:#fff;border:none;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,0.28);transition:transform .12s ease, box-shadow .12s ease}
  .cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,99,235,0.36)}
  .cta:disabled{opacity:.6;transform:none;box-shadow:none}
  .btn-secondary{padding:10px 18px;background:#fff;color:var(--color-text-primary);border:1px solid var(--color-border-tertiary);border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:border-color .15s, box-shadow .15s}
  .btn-secondary:hover{border-color:var(--color-accent);box-shadow:0 4px 12px rgba(20,25,40,0.06)}
  .msg{font-size:12px;margin-top:10px;padding:10px 13px;border-radius:10px}
  .msg.error{background:#FDECEC;color:#B42318}
  .msg.ok{background:rgba(23,184,166,0.12);color:#0F9C8C;font-weight:600}
  .loading{font-size:12px;color:var(--color-text-secondary)}
  .profile-layout{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:start}
  .side-panel-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--color-text-primary);margin-bottom:12px}
  .strength-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--color-border-tertiary);font-size:12.5px;color:var(--color-text-secondary)}
  .strength-item:first-child{border-top:none}
  .strength-dot{width:8px;height:8px;border-radius:50%;background:var(--color-border-tertiary);flex-shrink:0}
  .strength-dot.on{background:linear-gradient(135deg,var(--color-accent),var(--color-accent-2));box-shadow:0 0 0 3px rgba(37,99,235,0.14)}
  .side-panel-note{display:flex;gap:10px;margin-top:16px;background:var(--color-background-secondary);border-radius:12px;padding:12px}
  .side-panel-note svg{flex-shrink:0;margin-top:1px}
  .side-panel-note p{font-size:11.5px;color:var(--color-text-secondary);line-height:1.55;margin:0}
  @media(max-width:700px){ .profile-layout{grid-template-columns:1fr} }

  .profile-hero{
    display:flex;align-items:center;gap:36px;margin-bottom:26px;
    background:linear-gradient(135deg,#0B2A6B 0%,#142B63 55%,#0E3350 100%);
    border-radius:20px;padding:34px 38px;position:relative;overflow:hidden;
  }
  .profile-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(480px 200px at 88% -10%, rgba(23,184,166,0.25), transparent 60%);pointer-events:none}
  .avatar-wrap{position:relative;width:96px;height:96px;flex-shrink:0}
  .avatar-img{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;border:3px solid rgba(255,255,255,0.25)}
  .avatar-placeholder{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--color-accent),var(--color-accent-2));color:#fff;font-size:32px;font-weight:700;font-family:'Fraunces',serif;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,0.25)}
  .avatar-edit-btn{position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;background:#fff;color:#0B2A6B;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #0E3350;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,0.25)}
  .avatar-edit-btn input{display:none}
  .hero-founding{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#8A5B0A;background:linear-gradient(180deg,#FFFBF0,#FAEEDA);border:0.5px solid #E8CE8F;padding:5px 11px 5px 7px;border-radius:20px}
  .hero-score{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .hero-score-ring{position:relative;width:118px;height:118px}
  .hero-score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:#fff}
  .hero-score-label{font-size:12px;font-weight:600;color:#AFC0E6;margin-top:8px;letter-spacing:.03em}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  .gallery-slot{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:var(--color-background-secondary);border:1.5px dashed var(--color-border-tertiary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s}
  .gallery-slot:hover{border-color:var(--color-accent)}
  .gallery-slot img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery-slot .add{font-size:24px;color:var(--color-text-tertiary)}
  .gallery-slot .remove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(11,18,32,0.65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
  .gallery-slot input{display:none}
  .upload-hint{font-size:10.5px;color:var(--color-text-tertiary);margin-top:6px}

  .pv-analytics{border:1px solid rgba(37,99,235,0.18);border-radius:16px;padding:24px;text-align:center;background:linear-gradient(180deg,#F5F8FF,#FFFFFF);margin-top:12px;max-width:360px}
  .pv-analytics .pv-icon{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0B2A6B,var(--color-accent));color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:16px;box-shadow:0 6px 16px rgba(37,99,235,0.32)}
  .pv-analytics h4{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 5px;color:var(--color-text-primary)}
  .pv-analytics p{font-size:12px;color:var(--color-text-secondary);margin:0 0 14px;line-height:1.55}
  .pv-stat-card{border:1px solid var(--color-border-tertiary);border-radius:14px;padding:16px 18px;margin-top:12px;max-width:220px;box-shadow:0 1px 2px rgba(20,25,40,0.03), 0 8px 20px rgba(20,25,40,0.05)}
  .pv-stat-card .pv-val{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--color-text-primary);line-height:1}
  .pv-stat-card .pv-label{font-size:11px;color:var(--color-text-tertiary);margin-top:5px}

  .ptabs{display:flex;gap:4px;margin-bottom:26px;border-bottom:1px solid var(--color-border-tertiary)}
  .ptab-btn{background:none;border:none;padding:12px 4px;margin-right:22px;font-size:14.5px;font-weight:600;color:var(--color-text-tertiary);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:color .15s}
  .ptab-btn:hover{color:var(--color-text-primary)}
  .ptab-btn.active{color:var(--color-accent);border-bottom-color:var(--color-accent);font-weight:700}
  .ptab-panel{display:none}
  .ptab-panel.active{display:block}
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-mount"></div>
  <div class="app-main">
    <div class="ptitle">Profile</div>
    <div class="profile-layout">
      <div class="card" id="formWrap"><div class="loading">Loading…</div></div>
      <div class="card side-panel" id="strengthPanel"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="icons.js?v=1"></script>
<script src="nav.js?v=4"></script>
<script>
let profile, creator, collaborations = [], pressMentions = [], platformConnections = [];

async function load() {
  profile = await requireRole('creator');
  if (!profile) return;
  renderSidebar('creator', 'profile');

  const [{ data: c }, { data: email }, { data: collabs }, { data: press }, { data: platforms }] = await Promise.all([
    sb.from('creators').select('niche, location, founding_cohort, bio, slug, plan, avatar_url, gallery_images, available_for, causes, profile_views, stripe_connect_account_id, stripe_connect_charges_enabled, stripe_connect_payouts_enabled, stripe_connect_details_submitted, cover_pattern, cover_tags, cover_spotlight_stat, avatar_shape, trust_score, confidence, badge_tier').eq('id', profile.id).single(),
    sb.rpc('fn_get_my_business_email'),
    sb.from('creator_collaborations').select('id, brand_name, logo_url, link').eq('creator_id', profile.id).order('display_order').order('created_at'),
    sb.from('creator_press_mentions').select('id, title, outlet_name, url, mention_date').eq('creator_id', profile.id).order('display_order').order('created_at'),
    sb.from('platform_connections').select('platform, platform_handle, follower_count, video_count, verification_method, last_synced_at').eq('creator_id', profile.id),
  ]);
  creator = { ...c, business_email: email };
  collaborations = collabs || [];
  pressMentions = press || [];
  platformConnections = platforms || [];

  const initial = (profile.display_name || '?').trim().charAt(0).toUpperCase();
  document.getElementById('formWrap').innerHTML = `
    <div class="profile-hero">
      <div class="avatar-wrap">
        ${creator.avatar_url
          ? `<img class="avatar-img" id="avatarImg" src="${escapeHtml(creator.avatar_url)}">`
          : `<div class="avatar-placeholder" id="avatarImg">${escapeHtml(initial)}</div>`}
        <label class="avatar-edit-btn" title="Change photo">
          <i class="ti ti-camera"></i>
          <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp" onchange="uploadAvatar(event)">
        </label>
      </div>
      <div style="flex:1">
        <div style="font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:#fff;margin-bottom:6px">${escapeHtml(profile.display_name || 'Your profile')}</div>
        ${creator.founding_cohort ? `<div class="hero-founding" title="One of Kitscore's first 100 creators"><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="9" fill="#C08A1E"/><circle cx="9" cy="9" r="7.4" fill="#F0B429"/><path d="M9 4.2l1.4 2.9 3.1.5-2.3 2.2.6 3.1L9 11.4l-2.8 1.5.6-3.1-2.3-2.2 3.1-.5L9 4.2z" fill="#fff"/></svg>Founding Creator</div>` : ''}
      </div>
      ${(() => {
        const score = Math.round(Number(creator.trust_score) || 0);
        const circumference = 2 * Math.PI * 52;
        const offset = circumference - (score / 100) * circumference;
        return `
        <div class="hero-score">
          <div class="hero-score-ring">
            <svg width="118" height="118" viewBox="0 0 118 118">
              <defs><linearGradient id="heroRingGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#2755F0"/><stop offset="100%" stop-color="#17B8A6"/>
              </linearGradient></defs>
              <circle cx="59" cy="59" r="52" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="9"/>
              <circle cx="59" cy="59" r="52" fill="none" stroke="url(#heroRingGrad)" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 59 59)"/>
            </svg>
            <div class="hero-score-num">${score}</div>
          </div>
          <div class="hero-score-label">Trust Score</div>
        </div>`;
      })()}
    </div>
    <div id="avatarMsg"></div>

    <div class="ptabs">
      <button class="ptab-btn active" data-tab="account" onclick="switchProfileTab('account')">Account</button>
      <button class="ptab-btn" data-tab="payout" onclick="switchProfileTab('payout')">Payout</button>
      <button class="ptab-btn" data-tab="mediakit" onclick="switchProfileTab('mediakit')">Verified Media Kit</button>
      <button class="ptab-btn" data-tab="link" onclick="switchProfileTab('link')">Link &amp; sharing</button>
    </div>

    <div class="ptab-panel active" data-tab="account">
    <div class="subcard" style="margin-top:0">
      <div class="psec-title">Get fully verified</div>
      <div class="psec-sub">Complete these to strengthen your trust link and unlock more from sponsors.</div>
      <div id="verifyChecklist"></div>
    </div>
    <div class="subcard">
      <div class="psec-title">Connected platforms</div>
      <div class="psec-sub">Kitscore pulls live stats from these to keep your trust score current. Manage connections from your <a href="dashboard.html" style="color:var(--color-accent)">Dashboard</a>.</div>
      <div id="platformsList"></div>
    </div>
    <div class="psec" style="margin-top:0;padding-top:0;border-top:none">
      <div class="psec-title">Account</div>
      <div class="psec-sub">Your identity on Kitscore — feeds both your trust link and your Verified Media Kit.</div>
    </div>
    <div class="prow2">
      <div class="field"><label>Display name</label><input id="displayName" value="${escapeHtml(profile.display_name || '')}"></div>
      <div class="field"><label>Niche</label><input id="niche" value="${escapeHtml(creator.niche || '')}"></div>
    </div>
    <div class="prow2">
      <div class="field"><label>Location</label><input id="location" value="${escapeHtml(creator.location || '')}"></div>
      <div class="field"><label>Business email</label><input id="businessEmail" value="${escapeHtml(creator.business_email || '')}"></div>
    </div>
    </div>

    <div class="ptab-panel" data-tab="payout">
    <div class="psec" style="margin-top:0;padding-top:0;border-top:none">
      <div class="psec-title">Payouts</div>
      <div class="psec-sub">Connect a payout account so sponsors can pay you through Kitscore's escrow — funds are held until you deliver and the sponsor approves.</div>
      ${renderPayoutStatus()}
      ${creator.stripe_connect_payouts_enabled ? '<div id="balanceBox" class="msg" style="margin-top:10px">Loading balance…</div>' : ''}
    </div>
    </div>

    <div class="ptab-panel" data-tab="mediakit">
      <div class="psec-title">Your Verified Media Kit</div>
      <div class="psec-sub">Everything below appears on the Verified Media Kit you send to sponsors — bio, photos, brand history, and more.</div>
    <div class="field">
      <label>Bio <span style="color:var(--color-text-tertiary);font-weight:400">— shown on your Verified Media Kit, not your trust link</span></label>
      <textarea id="bio" maxlength="280" rows="3" placeholder="A couple sentences a brand can read in five seconds — what you make, who watches, and why you're a fit." style="width:100%;padding:9px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-sm);font-size:13px;font-family:inherit;resize:vertical">${escapeHtml(creator.bio || '')}</textarea>
      <div id="bioCount" style="font-size:10.5px;color:var(--color-text-tertiary);text-align:right;margin-top:2px">${(creator.bio||'').length}/280</div>
    </div>
    <div class="field">
      <label>Gallery <span style="color:var(--color-text-tertiary);font-weight:400">— optional, up to 4 photos</span></label>
      <div class="gallery-grid" id="galleryGrid"></div>
      <div class="upload-hint">JPG, PNG, or WebP · 5MB max per photo</div>
    </div>

    <div class="field">
      <label>Cover style <span style="color:var(--color-text-tertiary);font-weight:400">— customize the banner at the top of your kit. Changes save instantly.</span></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px">
        <div>
          <div style="font-size:10.5px;color:var(--color-text-tertiary);margin-bottom:6px">Pattern</div>
          <div id="coverPatternPicker"></div>
        </div>
        <div>
          <div style="font-size:10.5px;color:var(--color-text-tertiary);margin-bottom:6px">Avatar shape</div>
          <div id="avatarShapePicker"></div>
        </div>
      </div>
      <div style="margin-top:14px">
        <div style="font-size:10.5px;color:var(--color-text-tertiary);margin-bottom:6px"><strong style="color:var(--color-text-secondary)">Vibe tags</strong> <span style="font-weight:400">— up to 3, shown as pills on your cover</span></div>
        <div id="coverTagsPicker"></div>
      </div>
      <div style="margin-top:14px;max-width:280px">
        <div style="font-size:10.5px;color:var(--color-text-tertiary);margin-bottom:6px"><strong style="color:var(--color-text-secondary)">Spotlight stat</strong> <span style="font-weight:400">— the number featured on your cover</span></div>
        <select id="coverSpotlightSelect" onchange="selectCoverSpotlight(this.value)" style="width:100%;padding:8px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;font-size:12.5px;font-family:inherit;background:#fff">
          <option value="">None</option>
          <option value="reach">Total reach</option>
          <option value="engagement">Confidence</option>
          <option value="campaigns">Verified campaigns</option>
          <option value="trust">Trust score</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Past collaborations <span style="color:var(--color-text-tertiary);font-weight:400">— brands you've worked with, self-reported (separate from Verified campaigns, which only covers deals run through Kitscore)</span></label>
      <div id="collabList"></div>
      <details class="padd">
        <summary>Add a collaboration</summary>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
          <div>
            <label style="font-size:10.5px;color:var(--color-text-tertiary);display:block;margin-bottom:3px">Brand name</label>
            <input id="collabBrandName" placeholder="e.g. Red Bull" style="width:100%;padding:8px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;font-size:12.5px">
          </div>
          <div>
            <label style="font-size:10.5px;color:var(--color-text-tertiary);display:block;margin-bottom:3px">Link (optional)</label>
            <input id="collabLink" placeholder="https://..." style="width:100%;padding:8px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;font-size:12.5px">
          </div>
        </div>
        <div style="margin-top:8px">
          <label style="font-size:10.5px;color:var(--color-text-tertiary);display:block;margin-bottom:3px">Logo (optional)</label>
          <div style="display:flex;align-items:center;gap:10px">
            <input type="file" id="collabLogoInput" accept="image/jpeg,image/png,image/webp" style="font-size:11.5px;flex:1">
            <button type="button" class="cta" style="padding:8px 16px;font-size:12.5px;white-space:nowrap" onclick="addCollaboration()">+ Add</button>
          </div>
        </div>
        <div class="upload-hint">Leave the logo blank and we'll show your brand name instead. JPG, PNG, or WebP · 5MB max.</div>
        <div id="collabMsg" style="font-size:11px;margin-top:6px"></div>
      </details>
    </div>

    <div class="field">
      <label>Press mentions <span style="color:var(--color-text-tertiary);font-weight:400">— coverage of you or your work, self-reported</span></label>
      <div id="pressList"></div>
      <details class="padd">
        <summary>Add a press mention</summary>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
          <div>
            <label style="font-size:10.5px;color:var(--color-text-tertiary);display:block;margin-bottom:3px">Title</label>
            <input id="pressTitle" placeholder="e.g. Why This Creator Is Gaming's Next Big Thing" style="width:100%;padding:8px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;font-size:12.5px">
          </div>
          <div>
            <label style="font-size:10.5px;color:var(--color-text-tertiary);display:block;margin-bottom:3px">Outlet (optional)</label>
            <input id="pressOutlet" placeholder="e.g. IGN" style="width:100%;padding:8px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;font-size:12.5px">
          </div>
        </div>

const MAX_GALLERY = 4;
const MAX_UPLOAD_BYTES = 5 * 1024 * 1024;
const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  const images = creator.gallery_images || [];
  let html = images.map((url, i) => `
    <div class="gallery-slot">
      <img src="${escapeHtml(url)}">
      <div class="remove" onclick="removeGalleryImage(${i})" title="Remove">✕</div>
    </div>`).join('');
  if (images.length < MAX_GALLERY) {
    html += `
      <label class="gallery-slot">
        <span class="add">+</span>
        <input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadGalleryImage(event)">
      </label>`;
  }
  grid.innerHTML = html;
}

function extFor(file) {
  return (file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  const msg = document.getElementById('avatarMsg');
  msg.innerHTML = '';
  if (!ALLOWED_TYPES.includes(file.type)) {
    msg.innerHTML = `<div class="msg error">Please upload a JPG, PNG, or WebP image.</div>`;
    return;
  }
  if (file.size > MAX_UPLOAD_BYTES) {
    msg.innerHTML = `<div class="msg error">That photo is over 5MB — try a smaller file.</div>`;
    return;
  }
  const path = `${profile.id}/avatar-${Date.now()}.${extFor(file)}`;
  const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
  if (upErr) {
    msg.innerHTML = `<div class="msg error">Upload failed: ${escapeHtml(upErr.message)}</div>`;
    return;
  }
  const { data: pub } = sb.storage.from('creator-media').getPublicUrl(path);
  const { error: dbErr } = await sb.from('creators').update({ avatar_url: pub.publicUrl }).eq('id', profile.id);
  if (dbErr) {
    msg.innerHTML = `<div class="msg error">Saved the photo but couldn't update your profile: ${escapeHtml(dbErr.message)}</div>`;
    return;
  }
  creator.avatar_url = pub.publicUrl;
  const imgEl = document.getElementById('avatarImg');
  imgEl.outerHTML = `<img class="avatar-img" id="avatarImg" src="${escapeHtml(pub.publicUrl)}">`;
  msg.innerHTML = `<div class="msg ok">Photo updated.</div>`;
}

async function uploadGalleryImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  const msg = document.getElementById('msg');
  if (!ALLOWED_TYPES.includes(file.type)) {
    msg.innerHTML = `<div class="msg error">Please upload a JPG, PNG, or WebP image.</div>`;
    return;
  }
  if (file.size > MAX_UPLOAD_BYTES) {
    msg.innerHTML = `<div class="msg error">That photo is over 5MB — try a smaller file.</div>`;
    return;
  }
  const images = creator.gallery_images || [];
  if (images.length >= MAX_GALLERY) return;
  const path = `${profile.id}/gallery-${Date.now()}.${extFor(file)}`;
  const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
  if (upErr) {
    msg.innerHTML = `<div class="msg error">Upload failed: ${escapeHtml(upErr.message)}</div>`;
    return;
  }
  const { data: pub } = sb.storage.from('creator-media').getPublicUrl(path);
  const updated = [...images, pub.publicUrl];
  const { error: dbErr } = await sb.from('creators').update({ gallery_images: updated }).eq('id', profile.id);
  if (dbErr) {
    msg.innerHTML = `<div class="msg error">Saved the photo but couldn't update your gallery: ${escapeHtml(dbErr.message)}</div>`;
    return;
  }
  creator.gallery_images = updated;
  renderGallery();
  msg.innerHTML = `<div class="msg ok">Photo added.</div>`;
}

async function removeGalleryImage(index) {
  const images = [...(creator.gallery_images || [])];
  images.splice(index, 1);
  const { error } = await sb.from('creators').update({ gallery_images: images }).eq('id', profile.id);
  const msg = document.getElementById('msg');
  if (error) {
    msg.innerHTML = `<div class="msg error">Could not remove photo: ${escapeHtml(error.message)}</div>`;
    return;
  }
  creator.gallery_images = images;
  renderGallery();
}

async function addCollaboration() {
  const msg = document.getElementById('collabMsg');
  msg.innerHTML = '';
  const brandName = document.getElementById('collabBrandName').value.trim();
  const link = document.getElementById('collabLink').value.trim();
  const fileInput = document.getElementById('collabLogoInput');
  const file = fileInput.files[0];

  if (!brandName) {
    msg.innerHTML = `<div class="msg error">Brand name is required.</div>`;
    return;
  }
  if (file) {
    if (!ALLOWED_TYPES.includes(file.type)) {
      msg.innerHTML = `<div class="msg error">Please upload a JPG, PNG, or WebP logo.</div>`;
      return;
    }
    if (file.size > MAX_UPLOAD_BYTES) {
      msg.innerHTML = `<div class="msg error">That logo is over 5MB — try a smaller file.</div>`;
      return;
    }
  }

  let logoUrl = null;
  if (file) {
    const path = `${profile.id}/logo-${Date.now()}.${extFor(file)}`;
    const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
    if (upErr) {
      msg.innerHTML = `<div class="msg error">Logo upload failed: ${escapeHtml(upErr.message)}</div>`;
      return;
    }
    logoUrl = sb.storage.from('creator-media').getPublicUrl(path).data.publicUrl;
  }

  const { data, error } = await sb.from('creator_collaborations')
    .insert({ creator_id: profile.id, brand_name: brandName, logo_url: logoUrl, link: link || null, display_order: collaborations.length })
    .select('id, brand_name, logo_url, link')
    .single();
  if (error) {
    msg.innerHTML = `<div class="msg error">Could not save: ${escapeHtml(error.message)}</div>`;
    return;
  }

  collaborations.push(data);
  document.getElementById('collabBrandName').value = '';
  document.getElementById('collabLink').value = '';
  fileInput.value = '';
  renderCollaborations();
  msg.innerHTML = `<div class="msg ok">Added.</div>`;
}

async function removeCollaboration(id) {
  const { error } = await sb.from('creator_collaborations').delete().eq('id', id);
  const msg = document.getElementById('collabMsg');
  if (error) {
    msg.innerHTML = `<div class="msg error">Could not remove: ${escapeHtml(error.message)}</div>`;
    return;
  }
  collaborations = collaborations.filter(c => c.id !== id);
  renderCollaborations();
}

function switchProfileTab(tab) {
  document.querySelectorAll('.ptab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.ptab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === tab));
  // persistentSave's "Save changes" button saves Account/Media Kit fields
  // only (see save()) -- it has no effect on the Link tab's slug (own
  // saveSlug() button) or the Payout tab (own Connect/Stripe flow).
  // Showing it there reads as a competing, non-functional save action,
  // so hide the generic one on both.
  const persistentSave = document.getElementById('persistentSave');
  if (persistentSave) persistentSave.style.display = (tab === 'link' || tab === 'payout') ? 'none' : '';
}

// here is decorative; each maps to something the person can actually do.
function renderVerifyChecklist() {
  const el = document.getElementById('verifyChecklist');
  if (!el) return;
  const profileComplete = !!(profile.display_name && creator.niche && creator.location && creator.business_email);
  const hasPlatform = platformConnections.length > 0;
  const hasMediaKitInfo = !!((creator.bio || '').trim() || (creator.gallery_images || []).length || (creator.cover_tags || []).length);
  const payoutsReady = !!creator.stripe_connect_payouts_enabled;

  const items = [
    { done: profileComplete, title: 'Profile complete', sub: 'Display name, niche, location, and business email set', cta: null },
    { done: hasPlatform, title: 'Platform connected', sub: hasPlatform ? `${platformConnections.length} platform${platformConnections.length===1?'':'s'} linked` : 'Link at least one platform to verify your reach', cta: hasPlatform ? null : { label: 'Connect →', href: 'dashboard.html' } },
    { done: hasMediaKitInfo, title: 'Media kit started', sub: hasMediaKitInfo ? 'Bio or gallery added' : 'Add a bio, photo, or vibe tags to your kit', cta: hasMediaKitInfo ? null : { label: 'Add now →', onclick: "switchProfileTab('mediakit')" } },
    { done: payoutsReady, title: 'Payouts connected', sub: payoutsReady ? 'Ready to receive escrow releases' : 'Connect a payout account to get paid', cta: payoutsReady ? null : { label: 'Connect →', onclick: "switchProfileTab('payout')" } },
  ];
  const doneCount = items.filter(i => i.done).length;

  el.innerHTML = `
    <div style="height:6px;border-radius:100px;background:var(--color-background-secondary);overflow:hidden;margin:10px 0 14px">
      <div style="height:100%;border-radius:100px;background:linear-gradient(90deg,var(--color-accent),var(--color-accent-2));width:${(doneCount/items.length)*100}%"></div>
    </div>
    <div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:12px">${doneCount} of ${items.length} complete</div>
    ${items.map(i => `
      <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--color-border-tertiary)">
        <div style="width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
          background:${i.done ? 'rgba(23,184,166,0.12)' : 'var(--color-background-secondary)'};
          color:${i.done ? '#0F9C8C' : 'var(--color-text-tertiary)'}">
          <i class="ti ${i.done ? 'ti-check' : 'ti-circle-dashed'}" style="font-size:13px"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--color-text-primary)">${escapeHtml(i.title)}</div>
          <div style="font-size:11.5px;color:var(--color-text-tertiary)">${escapeHtml(i.sub)}</div>
        </div>
        ${i.cta ? (i.cta.href
          ? `<a href="${i.cta.href}" style="font-size:12px;font-weight:600;color:var(--color-accent);white-space:nowrap">${escapeHtml(i.cta.label)}</a>`
          : `<a href="#" onclick="${i.cta.onclick};return false" style="font-size:12px;font-weight:600;color:var(--color-accent);white-space:nowrap">${escapeHtml(i.cta.label)}</a>`) : ''}
      </div>`).join('')}
  `;
}

// ── Connected platforms (Account tab) — read-only summary of real rows in
// platform_connections. Connect/disconnect stays on Dashboard, which owns
// the OAuth start/callback flow; duplicating that here would give two
// places to manage the same connections and risk them drifting apart.
const PLATFORM_META = {
  youtube:   { label: 'YouTube',   icon: 'ti-brand-youtube',   color: '#FF3B30' },
  tiktok:    { label: 'TikTok',    icon: 'ti-brand-tiktok',    color: '#111827' },
  instagram: { label: 'Instagram', icon: 'ti-brand-instagram', color: '#D6249F' },
  twitch:    { label: 'Twitch',    icon: 'ti-brand-twitch',    color: '#8B5CF6' },
  discord:   { label: 'Discord',   icon: 'ti-brand-discord',   color: '#5865F2' },
};
function fmtFollowers(n) {
  if (n === null || n === undefined) return null;
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}
function renderPlatformsList() {
  const el = document.getElementById('platformsList');
  if (!el) return;
  if (!platformConnections.length) {
    el.innerHTML = `<div style="font-size:12.5px;color:var(--color-text-tertiary);padding:10px 0">No platforms connected yet. <a href="dashboard.html" style="color:var(--color-accent);font-weight:600">Connect one on your Dashboard →</a></div>`;
    return;
  }
  el.innerHTML = platformConnections.map(p => {
    const meta = PLATFORM_META[p.platform] || { label: p.platform, icon: 'ti-link', color: 'var(--color-text-tertiary)' };
    const followers = fmtFollowers(p.follower_count);
    return `
    <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--color-border-tertiary)">
      <div style="width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${meta.color};color:#fff">
        <i class="ti ${meta.icon}" style="font-size:16px"></i>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--color-text-primary)">${escapeHtml(meta.label)}</div>
        <div style="font-size:11.5px;color:var(--color-text-tertiary)">${p.platform_handle ? escapeHtml(p.platform_handle) : 'Connected'}${followers !== null ? ` · ${followers} followers` : ''}</div>
      </div>
      <div style="font-size:11px;font-weight:600;color:#0F9C8C;background:rgba(23,184,166,0.12);padding:4px 10px;border-radius:100px;white-space:nowrap">Connected</div>
    </div>`;
  }).join('');
}

function renderStrengthPanel() {
  const fields = [
    { label: 'Display name', id: 'displayName' },
    { label: 'Niche', id: 'niche' },
    { label: 'Location', id: 'location' },
    { label: 'Business email', id: 'businessEmail' },
  ];
  const panel = document.getElementById('strengthPanel');
  if (!panel) return;
  panel.innerHTML = `
    <div class="side-panel-title">Profile strength</div>
    ${fields.map(f => {
      const el = document.getElementById(f.id);
      const filled = !!(el && el.value.trim());
      return `<div class="strength-item"><span>${f.label}</span><div class="strength-dot ${filled ? 'on' : ''}"></div></div>`;
    }).join('')}
    <div class="side-panel-note">
      ${svgIcon('info-circle', {size:16, stroke:'#2563EB'})}
      <p>A complete profile is required before your first campaign can be verified.</p>
    </div>
  `;
}

async function save() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;

  const displayName = document.getElementById('displayName').value.trim();
  const niche = document.getElementById('niche').value.trim();
  const location = document.getElementById('location').value.trim();
  const businessEmail = document.getElementById('businessEmail').value.trim();
  const bio = document.getElementById('bio').value.trim();

  const [{ error: pErr }, { error: cErr }] = await Promise.all([
    sb.from('profiles').update({ display_name: displayName }).eq('id', profile.id),
    sb.from('creators').update({ niche, location, business_email: businessEmail, bio }).eq('id', profile.id),
  ]);

  const msg = document.getElementById('msg');
  if (pErr || cErr) {
    msg.innerHTML = `<div class="msg error">Could not save: ${escapeHtml((pErr || cErr).message)}</div>`;
  } else {
    msg.innerHTML = `<div class="msg ok">Saved.</div>`;
  }
  btn.disabled = false;
}

async function saveSlug() {
  const input = document.getElementById('customSlug');
  const msg = document.getElementById('slugMsg');
  const val = input.value.trim();
  msg.innerHTML = '';
  const { data, error } = await sb.rpc('fn_set_evekit_slug', { p_slug: val });
  if (error) {
    msg.innerHTML = `<div class="msg error">Could not save: ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!data || !data.ok) {
    msg.innerHTML = `<div class="msg error">${escapeHtml(data?.error || 'Could not save that link.')}</div>`;
    return;
  }
  creator.slug = data.slug;
  input.value = data.slug;
  msg.innerHTML = `<div class="msg ok">Saved — your Verified Media Kit and trust link now use this URL.</div>`;
}

function renderPayoutStatus() {
  if (creator.stripe_connect_payouts_enabled) {
    return `<div class="msg ok" style="margin-top:4px">Payouts ready — sponsors can fund and release escrow to you.</div>`;
  }
  if (creator.stripe_connect_details_submitted) {
    return `
      <div class="msg" style="margin-top:4px;background:#FFF7E6;color:#8A5B0A">Stripe is still verifying your details — this can take a little while.</div>
      <button class="btn-secondary" style="margin-top:8px" onclick="connectPayouts()">Check status / continue setup</button>`;
  }
  return `<button class="btn-secondary" style="margin-top:4px" onclick="connectPayouts()">Connect payout account</button>`;
}

async function loadBalance() {
  const box = document.getElementById('balanceBox');
  if (!box) return;
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/escrow?action=balance', {
    headers: { 'Authorization': `Bearer ${session?.access_token}` },
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || !j.connected) { box.style.display = 'none'; return; }

  const fmt = (cents) => `$${(cents / 100).toFixed(2)}`;
  const nextPayout = j.payouts.find(p => p.status === 'pending' || p.status === 'in_transit');

  box.innerHTML = `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:4px">
      <div class="pv-stat-card" style="margin-top:0"><div class="pv-val">${fmt(j.availableCents)}</div><div class="pv-label">Available</div></div>
      <div class="pv-stat-card" style="margin-top:0"><div class="pv-val">${fmt(j.pendingCents)}</div><div class="pv-label">Pending</div></div>
    </div>
    ${nextPayout ? `<div style="margin-top:12px;font-size:13px;color:var(--color-text-secondary)">Next payout: <strong style="color:var(--color-text-primary)">${fmt(nextPayout.amountCents)}</strong> — expected ${new Date(nextPayout.arrivalDate).toLocaleDateString()}</div>` : ''}
    ${j.pendingCents > 0 ? `<div style="margin-top:10px;font-size:12.5px;color:var(--color-text-tertiary);line-height:1.5">A sponsor releasing your payment moves it here right away, but Stripe holds new payments as "Pending" for a few days before they're payable out — this is standard for every new payout account, not specific to this payment. It'll move to "Available" on its own, no action needed from you.</div>` : ''}
    <a href="#" onclick="openExpressDashboard(event, this)" style="display:inline-block;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--color-accent)">See your full payout history &amp; schedule in Stripe →</a>
  `;
}

async function openExpressDashboard(e, linkEl) {
  e.preventDefault();
  const original = linkEl.textContent;
  linkEl.textContent = 'Opening…';
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/escrow?action=express-dashboard-link', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${session?.access_token}` },
  });
  const j = await res.json().catch(() => ({}));
  linkEl.textContent = original;
  if (!res.ok) { alert(j.error || 'Could not open Stripe dashboard.'); return; }
  window.open(j.url, '_blank');
}

async function connectPayouts() {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/escrow?action=connect-onboarding', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` },
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { alert(j.error || 'Could not start payout setup.'); return; }
  window.location.href = j.url;
}

async function refreshConnectStatusIfReturning() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('connect') !== 'return' && params.get('connect') !== 'refresh') return;

  const { data: { session } } = await sb.auth.getSession();
  await fetch('/api/escrow?action=refresh-connect-status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` },
  }).catch(() => {});

  window.history.replaceState({}, '', window.location.pathname);
  await load();
}

load().then(refreshConnectStatusIfReturning);
</script>
