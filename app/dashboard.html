<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563EB">
<link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- Media Kit tab uses profile.html's richer Fraunces/Space Grotesk visual
     system (docs/dashboard-rework-blueprint-v1.md step 7 -- other tabs will
     migrate to this system later; for now it's scoped to .pf-* classes only). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  /* .app-main (the flex child next to the sidebar) is what actually needs
     widening to match profile.html -- it's shared.css's default 780px
     otherwise. The body{max-width} rule this replaces was targeting the
     wrong element: body wraps the sidebar too, so constraining IT doesn't
     widen the content column, it just squeezes sidebar+content together. */
  .app-main{max-width:1040px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .topbar .who{font-size:12px;color:var(--color-text-secondary)}
  .signout{font-size:11px;color:#2563EB;cursor:pointer;background:none;border:none}
  .loading{font-size:12px;color:var(--color-text-secondary);padding:40px;text-align:center}
  .sec{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .card{padding:16px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:12px}
  .dash-tabs{display:grid;grid-template-columns:repeat(var(--tab-count,5),1fr);gap:10px;margin-bottom:16px}
  .dash-tab{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:16px 10px;text-align:center;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease}
  .dash-tab:hover{border-color:#2563EB;transform:translateY(-1px)}
  .dash-tab.active{border-color:#2563EB;background:#F0F6FF}
  .dash-tab-icon{width:32px;height:32px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:var(--color-background-secondary);color:var(--color-text-secondary);border-radius:var(--border-radius-md)}
  .dash-tab.active .dash-tab-icon{background:#fff;color:#2563EB}
  .dash-tab-label{font-size:12.5px;font-weight:600;color:var(--color-text-primary)}
  .dash-tab.active .dash-tab-label{color:#2563EB}
  .dash-tab-badge{display:inline-block;margin-top:5px;font-family:var(--font-mono,monospace);font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--color-text-tertiary);border:1px solid var(--color-border-tertiary);border-radius:8px;padding:1px 6px}
  .tab-panel{opacity:0;animation:panelIn .2s ease forwards}
  @keyframes panelIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.tab-panel{animation:none;opacity:1}}
  @media(max-width:640px){.dash-tabs{grid-template-columns:repeat(3,1fr)}}
  .info-ic{color:var(--color-text-tertiary);cursor:help;margin-left:3px;vertical-align:-1px}

  /* ── Score ring hero ── */
  .score-hero{display:grid;grid-template-columns:auto auto 1fr;gap:0;align-items:center;margin-bottom:12px}
  .score-left{display:flex;align-items:flex-start;gap:22px;padding-right:24px}
  .score-left-info{display:flex;flex-direction:column;gap:12px;padding-top:6px}
  .score-badges{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center}
  .score-divider{width:1px;align-self:stretch;background:var(--color-border-tertiary);margin:0 24px}
  .score-right{display:flex;flex-direction:column;gap:10px;padding-left:24px;justify-content:center}
  .ring-wrap{position:relative;width:150px;height:150px;flex-shrink:0}
  .ring-wrap svg{width:130px;height:130px;transform:rotate(-90deg)}
  .ring-track{fill:none;stroke:var(--color-border-tertiary);stroke-width:10}
  .ring-fill{fill:none;stroke:#2563EB;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
  .ring-center{position:absolute;inset:0}
  .ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,calc(-50% - 16px));font-size:32px;font-weight:700;color:var(--color-text-primary);line-height:1;white-space:nowrap;text-align:center}
  .ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,calc(-50% + 14px));font-size:9px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;text-align:center}
  .badge-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;background:var(--color-background-secondary);color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary);width:fit-content}
  .conf-row{display:flex;align-items:center;gap:8px}
  .conf-label{font-size:11px;color:var(--color-text-secondary);width:90px;flex-shrink:0}
  .conf-bar{flex:1;height:5px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden}
  .conf-fill{height:100%;background:linear-gradient(90deg,#5B8DFF,#17B8A6);border-radius:3px;transition:width 1s ease}
  .conf-pct{font-size:11px;font-weight:600;color:var(--color-text-primary);width:32px;text-align:right}
  .plan-chip{font-size:11px;font-weight:700;padding:7px 14px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;width:fit-content}
  .plan-free{background:var(--color-background-secondary);color:var(--color-text-secondary)}
  .plan-pro{background:#EEF2FF;color:#3730A3}
  .upgrade-link{font-size:11px;color:#2563EB;text-decoration:none;font-weight:500}
  .why-score-link{display:inline-block;font-size:11.5px;color:#2563EB;text-decoration:none;font-weight:500;border:1px solid #D5DAE3;border-radius:4px;padding:5px 10px;width:fit-content}
  .why-score-link:hover{border-color:#2563EB;background:#F5F8FF}
  .encourage{font-size:12px;color:var(--color-text-secondary);line-height:1.5;margin:0}
  @media(max-width:620px){
    .score-hero{grid-template-columns:1fr}
    .score-left{padding-right:0;margin-bottom:16px}
    .score-divider{display:none}
    .score-right{padding-left:0}
  }

  /* ── Stats strip ── */
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat-box{position:relative;padding:14px 14px 16px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);text-align:left}
  .stat-box .stat-icon{width:32px;height:32px;border-radius:var(--border-radius-md);background:#EEF2FF;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .stat-box .stat-delta{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:600;color:#1D9E75;background:#EAF7F0;padding:2px 7px;border-radius:20px}
  .stat-box .mv{font-size:24px;font-weight:700;color:var(--color-text-primary);line-height:1;margin-bottom:4px}
  .stat-box .ml{font-size:12px;color:var(--color-text-secondary);font-weight:500}

  /* ── Completeness bar ── */
  .progress-track{height:7px;background:var(--color-background-secondary);border-radius:4px;overflow:hidden;margin:8px 0 10px}
  .progress-fill{height:100%;background:#2563EB;border-radius:4px;transition:width .8s ease}
  .step-row{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:9px 0;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
  .step-row:last-child{border-bottom:none}
  .step-row.done{color:var(--color-text-primary)}
  .step-row.current{color:var(--color-text-primary);font-weight:600}
  .step-row .step-next{margin-left:auto;font-size:11.5px;color:#2563EB;font-weight:600}
  .step-dot{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .step-dot.dot-done{background:#2563EB}
  .step-dot.dot-current{border:2px solid #2563EB}
  .step-dot.dot-current::after{content:'';width:8px;height:8px;background:#2563EB}
  .step-dot.dot-pending{border:1.5px solid #D8DADE}

  /* ── Milestone ── */
  .milestone-card{display:flex;align-items:center;gap:14px}
  .ms-icon{font-size:36px;flex-shrink:0;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .ms-bar-wrap{flex:1}
  .ms-bar-track{height:5px;background:var(--color-background-secondary);border-radius:3px;margin:6px 0}
  .ms-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#2563EB,#7B6FE8);transition:width 1s ease}

  /* ── Score breakdown ── */
  .pbar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .pbar-row span:first-child{width:140px;font-size:12px;color:var(--color-text-secondary);flex-shrink:0}
  .pbar-track{flex:1;height:5px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden}
  .pbar-fill{height:100%;border-radius:3px;transition:width 1s ease}
  .pbar-val{width:28px;text-align:right;font-size:12px;font-weight:600}
  .pbar-tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0}
  .tag-live{background:#E9F7EE;color:#1C7C3F}
  .tag-ev{background:#EEF2FF;color:#3730A3}
  .tag-self{background:#FEF6E7;color:#92600A}
  .tag-pend{background:var(--color-background-secondary);color:var(--color-text-tertiary)}

  /* ── Improvement loop ── */
  .improve-card{border:0.5px solid var(--color-border-tertiary);border-left:3px solid var(--color-border-tertiary);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--color-background-primary)}
  .improve-card.ic-score-low{border-left-color:#D97706}
  .improve-card.ic-score-med{border-left-color:#2563EB}
  .improve-card.ic-score-hi{border-left-color:#1C7C3F}
  .improve-card .ic-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .improve-card .ic-title{font-size:13px;font-weight:600;color:var(--color-text-primary)}
  .improve-card .ic-score{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .ic-score-low{background:#FEF3C7;color:#92400E}
  .ic-score-med{background:#DBEAFE;color:#1E40AF}
  .ic-score-hi{background:#D1FAE5;color:#065F46}
  .improve-card .ic-tip{font-size:12px;color:var(--color-text-secondary);line-height:1.55}
  .improve-card .ic-cta{font-size:12px;font-weight:600;color:#2563EB;background:none;border:none;padding:0;cursor:pointer;margin-top:8px;display:inline-block;font-family:inherit}

  /* ── Brand safety ── */
  .qrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
  .qrow:last-child{border-bottom:none}
  .qrow .opts{display:flex;gap:4px}
  .qrow button{font-size:10px;padding:4px 8px;border-radius:0;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);cursor:pointer;color:var(--color-text-secondary);font-family:inherit}
  .qrow button.sel{background:#2563EB;color:#fff;border-color:#2563EB}

  /* ── Evidence ── */
  .ev-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
  .ev-row:last-child{border-bottom:none}
  .ev-name{flex:1;color:var(--color-text-primary)}
  .ev-plat{color:var(--color-text-secondary);font-size:11px}
  .ev-status{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
  .st-verified{background:#D1FAE5;color:#065F46}
  .st-pending{background:#FEF3C7;color:#92400E}
  .st-review{background:#DBEAFE;color:#1E40AF}

  /* ── Empty states ── */
  .empty-state{text-align:center;padding:28px 16px}
  .empty-state .es-icon{font-size:32px;margin-bottom:10px;opacity:.5}
  .empty-state .es-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
  .empty-state .es-body{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:12px}
  .empty-state a{font-size:12px;font-weight:600;color:#2563EB;text-decoration:none}

  /* ── Tips grid ── */
  .tips-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tip-card{padding:16px;border:0.5px solid var(--color-border-tertiary)}
  .tip-icon{width:26px;height:26px;background:#EBF1FE;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .tip-icon svg{width:14px;height:14px;color:#2563EB}
  .tip-title{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:5px}
  .tip-text{font-size:11.5px;color:var(--color-text-secondary);line-height:1.5}
  @media(max-width:560px){ .tips-grid{grid-template-columns:1fr} }

  /* ── Verified badge ── */
  .verified-badge{font-size:12px;font-weight:600;background:#E9F7EE;color:#1C7C3F;padding:7px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:7px}
  .verified-badge svg{flex-shrink:0}
  .founding-badge{font-size:12px;font-weight:600;background:linear-gradient(180deg,#FFFBF0,#FAEEDA);color:#8A5B0A;padding:7px 14px;border-radius:20px;border:0.5px solid #E8CE8F;display:inline-flex;align-items:center;gap:7px;width:fit-content}

  /* ── Mobile ── */
  @media(max-width:560px){
    .score-hero{grid-template-columns:1fr;text-align:center}
    .ring-wrap{margin:0 auto}
    .score-left{flex-direction:column;align-items:center}
    .score-left-info{align-items:center}
    .score-badges{justify-content:center}
    .score-meta{align-items:center}
    .g3{grid-template-columns:1fr 1fr}
    body{padding:12px}
  }
  /* Rate calculator slider -- flat unstyled range inputs look rudimentary
     by default, so this gives it a filled blue track (via the
     --rc-fill custom property, set in JS on every input) plus a
     matching blue thumb, cross-browser. */
  input[type="range"].rc-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(to right, #2563EB 0%, #2563EB var(--rc-fill, 43%), #E5E7EB var(--rc-fill, 43%), #E5E7EB 100%);
    outline: none;
    cursor: pointer;
    margin: 4px 0;
  }
  input[type="range"].rc-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #2563EB;
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(37,99,235,0.45), 0 0 0 1px rgba(37,99,235,0.15);
    cursor: pointer;
    margin-top: 0;
    transition: transform 0.1s;
  }
  input[type="range"].rc-slider::-webkit-slider-thumb:hover,
  input[type="range"].rc-slider::-webkit-slider-thumb:active {
    transform: scale(1.15);
  }
  input[type="range"].rc-slider::-moz-range-track {
    height: 6px;
    border-radius: 999px;
    background: #E5E7EB;
  }
  input[type="range"].rc-slider::-moz-range-progress {
    height: 6px;
    border-radius: 999px;
    background: #2563EB;
  }
  input[type="range"].rc-slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #2563EB;
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(37,99,235,0.45);
    cursor: pointer;
  }

/* ── Media Kit tab (pf-* namespace, ported from profile.html) ── */
:root{
  --pf-blue:#2755F0; --pf-blue-deep:#0B2A6B; --pf-teal:#17B8A6;
  --pf-ink:#0B1220; --pf-ink-soft:#5B6472; --pf-ink-faint:#9AA3B2; --pf-line:#E6E9F0;
  --pf-radius:16px; --pf-shadow:0 1px 2px rgba(11,18,32,0.04), 0 8px 24px rgba(11,18,32,0.06);
}
.pf-btn{border:1px solid var(--pf-line);background:#fff;color:var(--pf-ink);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;font-family:inherit}
.pf-btn:hover{border-color:#C9D3E6;box-shadow:0 4px 12px rgba(11,18,32,0.06)}
.pf-btn-primary{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(39,85,240,0.28)}
.pf-card{background:#fff;border:1px solid var(--pf-line);border-radius:var(--pf-radius);padding:22px 24px;box-shadow:var(--pf-shadow);margin-bottom:18px}
.pf-card h3{font-size:15px;margin:0 0 4px;font-family:'Fraunces',serif}
.pf-card .desc{color:var(--pf-ink-soft);font-size:12.5px;margin:0 0 16px}
.pf-field{margin-bottom:14px}
.pf-field label{display:block;font-size:11.5px;font-weight:600;color:var(--pf-ink);margin-bottom:5px}
.pf-field label .opt{font-weight:400;color:var(--pf-ink-faint)}
.pf-field input,.pf-field select,.pf-field textarea{font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--pf-line);border-radius:10px;background:#fff;color:var(--pf-ink);width:100%}
.pf-field input:focus,.pf-field select:focus,.pf-field textarea:focus{outline:none;border-color:var(--pf-blue);box-shadow:0 0 0 3px rgba(39,85,240,0.12)}
.pf-field textarea{resize:vertical;min-height:76px;line-height:1.5}
.pf-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pf-char-count{font-size:11px;color:var(--pf-ink-faint);text-align:right;margin-top:-8px;margin-bottom:10px}
.pf-mk-hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#F0F4FF,#EAF9F6);border:1px solid var(--pf-line);border-radius:16px;padding:20px 24px;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.pf-mk-hero .t{font-size:15px;font-weight:600;font-family:'Fraunces',serif}
.pf-mk-hero .s{font-size:12.5px;color:var(--pf-ink-soft);margin-top:3px}
.pf-mk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.pf-mk-stat{background:#fff;border:1px solid var(--pf-line);border-radius:14px;padding:14px 16px;box-shadow:var(--pf-shadow)}
.pf-mk-stat .val{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.pf-mk-stat .lab{font-size:11.5px;color:var(--pf-ink-soft);margin-top:2px}
.pf-breakdown-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--pf-line)}
.pf-breakdown-row:last-child{border-bottom:none}
.pf-breakdown-row .lab{width:150px;font-size:12.5px;font-weight:600;flex-shrink:0}
.pf-bd-track{flex:1;height:6px;background:#F6F8FB;border-radius:100px;overflow:hidden;border:1px solid var(--pf-line)}
.pf-bd-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--pf-blue),var(--pf-teal))}
.pf-breakdown-row .sc{width:30px;text-align:right;font-size:12.5px;font-weight:700;color:var(--pf-blue-deep)}
.pf-gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pf-gallery-slot{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--pf-line);display:flex;align-items:center;justify-content:center;color:var(--pf-ink-faint);position:relative;overflow:hidden;background:#F6F8FB;font-size:20px;cursor:pointer}
.pf-gallery-slot.filled{border-style:solid;padding:0}
.pf-gallery-slot img{width:100%;height:100%;object-fit:cover;display:block}
.pf-gallery-slot input{display:none}
.pf-gallery-remove{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:rgba(11,18,32,0.65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.pf-pill-group{display:flex;flex-wrap:wrap;gap:7px}
.pf-pill-opt{padding:7px 14px;border-radius:9px;border:1px solid var(--pf-line);font-size:12px;font-weight:600;color:var(--pf-ink-soft);background:#fff;cursor:pointer;font-family:inherit}
.pf-pill-opt.selected{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border-color:transparent}
.pf-tag-pill{padding:6px 13px;border-radius:100px;border:1px solid var(--pf-line);font-size:11.5px;font-weight:600;color:var(--pf-ink-soft);background:#fff;cursor:pointer;font-family:inherit}
.pf-tag-pill.selected{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border-color:transparent}
.pf-tag-pill:disabled{opacity:.4;cursor:default}
.pf-tag-counter{font-size:11px;color:var(--pf-ink-faint);margin-top:8px}
.pf-two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}

// Engagement quality and content consistency each have up to several
// possible source keys in score_components, depending on what the
// creator's actually done: OAuth-verified via YouTube, TikTok, or
// Twitch, or self-reported/evidence-uploaded (no platform connected
// yet, plain unsuffixed key). All carry real, valid scores -- which one
// exists for a given creator depends on their own choices, not a
// hierarchy of "better" data going stale. `keys` is checked in this
// priority order (verified data preferred for display when, in some
// edge case, more than one happens to exist) so the breakdown always
// shows whichever one is actually there instead of hardcoding a single
// key and silently showing "Pending" for creators on a different path.
// content_consistency has no Twitch source (confirmed against
// fn_recalc_engagement_quality_twitch -- it only ever writes
// engagement_quality_twitch, there's no posting-cadence signal from
// Twitch), and no TikTok source yet either (YouTube is the only OAuth
// source for that dimension currently) -- both included here anyway so
// this component definition picks them up automatically if either ever
// gets built, with zero further changes needed here.
const ALL_COMPONENTS = [
  { keys:['audience_authenticity'], label:'Audience authenticity', advice:'Connect YouTube, TikTok, Twitch, or Instagram for a live-verified signal — or upload a screenshot of your audience demographics as a starting point.', anchor:'connect-platforms' },
  { keys:['engagement_quality_youtube','engagement_quality_tiktok','engagement_quality_twitch','engagement_quality'], baseLabel:'Engagement quality', advice:'Connect YouTube, TikTok, or Twitch so we can verify your engagement rate directly — or upload evidence for a self-reported starting score.', anchor:'connect-platforms' },
  { keys:['brand_safety'], label:'Brand safety', advice:'Complete the brand safety questionnaire below — sponsors filter heavily on this.', anchor:'brand-safety' },
  { keys:['content_consistency_youtube','content_consistency_tiktok','content_consistency_instagram','content_consistency_twitch','content_consistency'], baseLabel:'Content consistency', advice:'Connect YouTube, Instagram, or Twitch so we can verify your posting cadence directly — or upload evidence for a self-reported starting score.', anchor:'connect-platforms' },
];

// Finds whichever of a component's possible keys the creator actually
// has a score under. Returns {comp, matchedKey}, both null if pending.
function resolveComponent(ac, compMap) {
  for (const k of ac.keys) {
    if (compMap[k]) return { comp: compMap[k], matchedKey: k };
  }
  return { comp: null, matchedKey: null };
}

// Like resolveComponent, but returns EVERY matching key instead of just
// the first -- used for the score breakdown display, which should show
// one row per connected platform (industry-standard shape: HypeAuditor,
// Modash, Favikon etc. all show per-platform metrics rather than picking
// one "representative" platform and hiding the rest -- see the
// marketing/competitive review in chat). resolveComponent itself is left
// alone since the "what should I do next" advice logic (dash.improvements)
// genuinely wants one representative gap, not every possible gap.
//
// Safe to just collect every match with no dedup: the OAuth callback
// handlers already delete the bare fallback key (e.g. 'content_consistency')
// the moment any platform-specific key is written, so a creator never
// legitimately has both at once.
function resolveAllComponents(ac, compMap) {
  const matches = ac.keys.filter(k => compMap[k]).map(k => ({ comp: compMap[k], matchedKey: k }));
  return matches.length ? matches : [{ comp: null, matchedKey: null }];
}

// Single-path components (audience_authenticity, brand_safety)
// always use their fixed label. Dual/triple-path ones
// (engagement quality, content consistency) show which source the
// creator's actual score came from, or the bare dimension name if
// they haven't done anything for it yet.
function componentLabel(ac, matchedKey) {
  if (ac.label) return ac.label;
  if (!matchedKey) return ac.baseLabel;
  if (matchedKey.endsWith('_youtube')) return `${ac.baseLabel} (YouTube)`;
  if (matchedKey.endsWith('_tiktok')) return `${ac.baseLabel} (TikTok)`;
  if (matchedKey.endsWith('_twitch')) return `${ac.baseLabel} (Twitch)`;
  if (matchedKey.endsWith('_instagram')) return `${ac.baseLabel} (Instagram)`;
  return `${ac.baseLabel} (self-reported)`;
}

const SAMPLE_HISTORY_PREVIEW = [40, 44, 43, 51, 58, 55, 63, 68, 71, 74];

function renderScoreHistorySvg(scores, isSample){
  const w = 560, h = 120, pad = 8;
  const min = Math.min(...scores), max = Math.max(...scores);
  const range = (max - min) || 1;
  const stepX = scores.length > 1 ? (w - pad*2) / (scores.length - 1) : 0;
  const points = scores.map((s,i) => {
    const x = pad + i*stepX;
    const y = pad + (1 - (s - min)/range) * (h - pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = isSample ? '#C9CDD6' : '#2563EB';
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
}

function renderScoreHistory(history){
  const rows = history || [];
  if (rows.length < 2) {
    return `<div style="font-size:12px;color:var(--color-text-tertiary);padding:8px 0">Your score history starts now — check back once your score changes to see the trend.</div>`;
  }
  const scores = rows.map(r => Number(r.trust_score));
  const first = new Date(rows[0].recorded_at).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  const last = new Date(rows[rows.length-1].recorded_at).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  return `
    ${renderScoreHistorySvg(scores, false)}
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--color-text-tertiary);margin-top:4px">
      <span>${first}</span><span>${last}</span>
    </div>`;
}

function renderRing(score){
  const r = 54, circ = 2*Math.PI*r;
  const pct = Math.min(score||0, 100)/100;
  const offset = circ*(1-pct);
  return `
    <div class="ring-wrap" id="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-track" cx="60" cy="60" r="${r}"/>
        <circle class="ring-fill" cx="60" cy="60" r="${r}"
          stroke="${scoreColor(score)}"
          stroke-dasharray="${circ}"
          stroke-dashoffset="${circ}"
          id="ring-arc"/>
      </svg>
      <div class="ring-center">
        <div class="ring-num" id="ring-num">—</div>
        <div class="ring-label">trust score</div>
      </div>
    </div>`;
}

function animateRing(score){
  const r=54, circ=2*Math.PI*r;
  const offset = circ*(1-(Math.min(score||0,100)/100));
  const arc = document.getElementById('ring-arc');
  const num = document.getElementById('ring-num');
  if(!arc||!num) return;
  // Animate number count-up
  let start=0, duration=1200, startTime=null;
  function step(ts){
    if(!startTime) startTime=ts;
    const p=Math.min((ts-startTime)/duration,1);
    const ease=1-Math.pow(1-p,3);
    num.textContent=Math.round(ease*score);
    if(p<1) requestAnimationFrame(step);
    else num.textContent=score;
  }
  requestAnimationFrame(step);
  setTimeout(()=>{ arc.style.strokeDashoffset=offset; },50);
}

async function load() {
  profile = await requireRole('creator');
  if (!profile) return;
  renderSidebar('creator', 'dashboard');
  document.getElementById('whoami').textContent = `${profile.display_name} · ${profile.email||''}`;

  const [{ data:c },{ data:components },{ data:evidence },{ data:answers },{ data:campaigns },{ data:businessEmail },{ data:audience },{ data:history },{ data:platformConnections },{ data:followerHistory },{ data:collabs },{ data:press },{ data:verificationRequests }] = await Promise.all([
    sb.from('creators').select('id,niche,location,trust_score,confidence,badge_tier,plan,reliability_score,repeat_sponsor_rate,would_hire_again_pct,founding_cohort,slug,bio,profile_views,avatar_url,gallery_images,available_for,causes,cover_pattern,cover_tags,cover_spotlight_stat,avatar_shape').eq('id', profile.id).single(),
    sb.from('score_components').select('*').eq('creator_id', profile.id).order('weight', {ascending:false}),
    sb.from('evidence_uploads').select('*').eq('creator_id', profile.id).order('uploaded_at',{ascending:false}),
    sb.from('brand_safety_answers').select('*').eq('creator_id', profile.id),
    sb.from('campaigns').select('*').eq('creator_id', profile.id).order('created_at',{ascending:false}),
    sb.rpc('fn_get_my_business_email'),
    sb.from('audience_demographics').select('dimension,label,pct').eq('creator_id', profile.id),
    sb.from('trust_score_history').select('trust_score,recorded_at').eq('creator_id', profile.id).order('recorded_at',{ascending:true}),
    // Token-free summary (handle, follower/like/subscriber/view counts,
    // verification_method) -- never returns access_token/refresh_token,
    // see fn_creator_platform_summary in
    // supabase/2026-07-23-extend-platform-summary-rpc.sql.
    sb.rpc('fn_creator_platform_summary', { p_creator_id: profile.id }),
    // Raw follower-count snapshots over time, per platform -- distinct
    // from trust_score_history (which tracks the composite score, not
    // raw follower counts). See supabase/2026-07-23b-follower-history.sql.
    sb.rpc('fn_creator_follower_history', { p_creator_id: profile.id }),
    // Media Kit tab (blueprint step 6) -- brands worked with and press
    // coverage, both self-reported.
    sb.from('creator_collaborations').select('id, brand_name, logo_url, link').eq('creator_id', profile.id).order('display_order'),
    sb.from('creator_press_mentions').select('id, title, outlet_name, url, mention_date').eq('creator_id', profile.id).order('mention_date', {ascending:false}),
    // Verify Me (directory.html) -- sponsor-initiated, creator side is
    // read-only per verification_requests RLS ("targeted creators can
    // view requests naming them"). Passive notice only, no action to
    // take here -- see docs note on this feature for why.
    sb.from('verification_requests').select('id, status, created_at').eq('target_creator_id', profile.id).eq('status', 'sent').order('created_at', {ascending:false}),
  ]);
  creator = { ...c, business_email: businessEmail };
  platforms = platformConnections || [];
  collaborations = collabs || [];
  pressMentions = press || [];
  pendingVerificationRequests = verificationRequests || [];
  const audRows = audience || [];
  audienceData = {
    countries: audRows.filter(r=>r.dimension==='country').map(r=>({label:r.label, pct:r.pct})),
    genders: Object.fromEntries(audRows.filter(r=>r.dimension==='gender').map(r=>[r.label, r.pct])),
    ages: Object.fromEntries(audRows.filter(r=>r.dimension==='age').map(r=>[r.label, r.pct])),
  };

  const answerMap={};
  (answers||[]).forEach(a=>answerMap[a.question_key]=a.answer);
  const verifiedCount=(campaigns||[]).filter(x=>x.creator_confirmed&&x.sponsor_confirmed).length;
  const hasScore=(components||[]).length>0 && creator.trust_score>0;
  const score=parseInt(creator.trust_score)||0;
  const conf=parseInt(creator.confidence)||0;

  // Onboarding steps
  const steps=[
    {label:'Complete your profile (niche + location)', done:!!(creator.niche&&creator.location), why:'Sponsors filter by niche and location first — an empty profile won\'t show up in searches.'},
    {label:'Complete brand safety questionnaire',       done:(answers||[]).length>=QUESTIONS.length, why:'This feeds directly into your score and lets sponsors skip a manual vetting call.'},
    {label:'Upload evidence',                           done:(evidence||[]).length>=1, why:'Screenshots and deliverables from past campaigns back up what you claim — unverified claims score lower.'},
    {label:'Verify first campaign',                     done:verifiedCount>=1, why:'Invite a past sponsor by email, or wait for one to log a campaign with you — either way, it only counts once both sides confirm. This is the strongest signal in your score.'},
  ];
  const doneCount=steps.filter(s=>s.done).length;
  const pct=Math.round((doneCount/steps.length)*100);
  const currentStepIdx=steps.findIndex(s=>!s.done);

  // Next milestone
  const nextMs=MILESTONES.find(m=>verifiedCount<m.threshold);
  const prevMs=MILESTONES.filter(m=>verifiedCount>=m.threshold).pop();
  const msFrom=prevMs?prevMs.threshold:0;
  const msTo=nextMs?nextMs.threshold:MILESTONES[MILESTONES.length-1].threshold;
  const msPct=nextMs?Math.round(((verifiedCount-msFrom)/(msTo-msFrom))*100):100;

  // Component map
  const compMap={};
  (components||[]).forEach(c=>compMap[c.component_key]=c);

  // Improvement suggestions — sort lowest score first, cap at 3
  const improvements=ALL_COMPONENTS
    .map(ac=>({ ac, ...resolveComponent(ac, compMap) }))
    .filter(x=>x.comp && x.comp.value<80)
    .sort((a,b)=>a.comp.value-b.comp.value)
    .slice(0,3);

  // Only OAuth-verified connections count toward the free-tier cap as of
  // 2026-07-10 (see supabase/2026-07-10-scope-platform-cap-to-oauth.sql).
  // Self-reported evidence and handle-lookup (public_lookup) connections
  // are free/unlimited for everyone and excluded here.
  const usedPlatforms=[...new Set(
    (platformConnections||[]).filter(p=>p.verification_method==='oauth').map(p=>p.platform).filter(Boolean)
  )];
  const unlimitedPlatforms = creator.plan==='pro' || !!creator.founding_cohort;

  dash = { components, evidence, answers, answerMap, campaigns, history, verifiedCount, hasScore,
    score, conf, steps, doneCount, pct, currentStepIdx, nextMs, msPct, compMap, improvements,
    usedPlatforms, unlimitedPlatforms, platformConnections: platformConnections || [], followerHistory: followerHistory || [] };

  // Real category-based engagement benchmarking -- percentile rank among
  // other creators in the same niche, not a fixed industry range or a
  // static niche-difficulty multiplier. One RPC call per platform with an
  // engagement_quality_<platform> score component (any source -- OAuth-
  // verified or evidence-submitted). fn_niche_peer_percentile
  // returns {percentile: null, cohort_size} honestly when there aren't
  // enough peers in that niche yet (currently true for every creator --
  // see supabase/2026-07-28-add-niche-engagement-benchmark.sql and the
  // rename to fn_niche_peer_percentile in
  // supabase/2026-07-29b-rename-niche-peer-percentile.sql) rather
  // than a misleading percentile from a tiny sample. Deliberately
  // separate from and complementary to the niche-difficulty-multiplier
  // approach shipped the same day (which adjusts the score itself using
  // a static assumption) -- this shows real peer standing instead,
  // without changing the underlying score at all.
  const engagementPlatforms = Object.keys(compMap)
    .filter(k => k.startsWith('engagement_quality_'))
    .map(k => k.replace('engagement_quality_', ''));
  const nicheBenchmarks = {};
  if (engagementPlatforms.length) {
    const results = await Promise.all(engagementPlatforms.map(p =>
      sb.rpc('fn_niche_peer_percentile', { p_creator_id: profile.id, p_platform: p })
    ));
    engagementPlatforms.forEach((p, i) => {
      const row = results[i].data && results[i].data[0];
      if (row) nicheBenchmarks[p] = row;
    });
  }
  dash.nicheBenchmarks = nicheBenchmarks;

  renderDashboardShell();
  loadPeerPercentiles();
  loadCreatorInterest();

  // Animate ring + confidence bar after initial render
  requestAnimationFrame(()=>{
    animateRing(score);
    const cf=document.getElementById('conf-fill');
    if(cf) setTimeout(()=>cf.style.width=conf+'%',100);
  });
}

function switchTab(key) {
  activeTab = key;

// In-app replacement for the old email evidence-freshness reminder (removed
// July 2026, see api/cron-evidence-nudges.js). Computed live from the
// evidence already loaded in load() -- same 90-day/75-day thresholds as
// freshnessBadge() in evidence.html -- so it's always current and doesn't
// depend on the weekly cron having run recently. Shown once at the top of
// the dashboard each time the creator logs in / lands here.
function staleEvidenceBannerHtml() {
  if (creator.plan !== 'pro') return ''; // Pro-exclusive perk per pricing-creator.html -- was previously shown to all plans regardless of what's advertised.
  const items = dash.evidence || [];
  const now = Date.now();
  const dayMs = 1000 * 60 * 60 * 24;
  let expired = 0, expiringSoon = 0;
  items.forEach(e => {
    if (!e.uploaded_at) return;
    const days = Math.floor((now - new Date(e.uploaded_at).getTime()) / dayMs);
    if (days >= 90) expired++;
    else if (days >= 75) expiringSoon++;
  });
  if (expired === 0 && expiringSoon === 0) return '';

  const parts = [];
  if (expired) parts.push(`${expired} item${expired===1?'':'s'} expired`);
  if (expiringSoon) parts.push(`${expiringSoon} expiring soon`);

  return `
    <div class="card" style="display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:12px;background:#FFFBEB;border:1px solid #FDE68A">
      ${svgIcon('clock', {size:16, stroke:'#B45309'})}
      <div style="flex:1;font-size:12.5px;color:#92400E"><strong>Evidence needs a refresh</strong> — ${parts.join(', ')}. Fresh evidence keeps your score meaningful to sponsors.</div>
      <button onclick="switchTab('evidence')" style="background:#B45309;color:#fff;border:none;padding:6px 12px;font-size:11.5px;font-weight:600;font-family:var(--font-family-base);cursor:pointer;white-space:nowrap;border-radius:4px">Review evidence →</button>
    </div>`;
}

function renderTabPanel(key) {
  if (key==='overview') return renderOverviewTab();
  if (key==='score') return renderScoreTab();
  if (key==='profile') return renderProfileTab();
  if (key==='evidence') return renderEvidenceTab();
  if (key==='mediakit') return renderMediaKitTab();
  if (key==='tools') return renderToolsTab();
  return '';
}

function renderOverviewTab() {
  const { steps, doneCount, verifiedCount, hasScore } = dash;

  // narrative (Claim -> Verify -> Score -> Get hired). See
  // docs/dashboard-rework-blueprint-v1.md for the mapping rationale.
  const [profileStep, brandSafetyStep, evidenceStep, campaignStep] = steps;
  const stage1Done = profileStep.done;
  const stage2Done = evidenceStep.done;
  const stage3Done = brandSafetyStep.done && campaignStep.done;
  const stages = [
    { key:'claim', label:'Claim your profile', done: stage1Done },
    { key:'evidence', label:'Upload your evidence', done: stage2Done },
    { key:'score', label:'Get your Kitscore', done: stage3Done },
  ];
  const currentStageIdx = stages.findIndex(s=>!s.done);
  const stageDoneCount = stages.filter(s=>s.done).length;
  const journeyPct = hasScore ? 100 : Math.round((stageDoneCount/(stages.length+1))*100);

  return `
    <!-- ── Kitscore journey ── -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">

          <div class="step-row done" style="padding:6px 0">
            <div class="step-dot dot-done"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <span class="step-label">${st.label}</span>
          </div>`;
        }
        if (i === currentStageIdx) {
          const subSteps = st.key==='score' ? [brandSafetyStep, campaignStep] : [];
          return `
          <div class="card" style="background:var(--color-background-secondary);margin:8px 0;padding:14px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span style="font-size:11px;font-weight:600;color:#2563EB;border:1.5px solid #2563EB;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span>
              <span style="font-size:13.5px;font-weight:600;color:var(--color-text-primary)">${st.label}</span>
            </div>
            ${subSteps.length ? `
            <div style="font-size:12px;color:var(--color-text-secondary);margin:2px 0 10px 28px">${subSteps.filter(s=>!s.done).length} step${subSteps.filter(s=>!s.done).length===1?'':'s'} left to unlock your score</div>
            <div style="margin-left:28px">
              ${subSteps.map(ss=>`
              <div style="display:flex;align-items:center;gap:8px;padding:3px 0">
                <span style="width:14px;height:14px;border-radius:50%;border:1.5px solid ${ss.done?'#1C7C3F':'var(--color-border-secondary)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">${ss.done?'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#1C7C3F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}</span>
                <span style="font-size:12px;color:var(--color-text-secondary)">${ss.label}</span>
              </div>`).join('')}
            </div>
            <button onclick="${!brandSafetyStep.done ? "switchTab('evidence');setTimeout(()=>document.getElementById('brand-safety')?.scrollIntoView({behavior:'smooth'}),50)" : "window.location.href='campaigns.html?invite=1'"}" style="margin:10px 0 0 28px;background:#2563EB;color:#fff;border:none;padding:7px 14px;font-size:12px;font-weight:600;font-family:var(--font-family-base);cursor:pointer;border-radius:6px">Continue →</button>
            ` : `

      <div class="step-row ${hasScore?'done':'pending'}" style="padding:6px 0;${hasScore?'':'opacity:0.55'}${hasScore?';cursor:pointer':''}" ${hasScore?`onclick="window.location.href='briefs.html'"`:''}>

// Demand-side transparency ("who's interested in me"): watchlists has
// real signal about this creator that was previously 100% invisible to
// them. fn_get_creator_interest enforces the free/Pro gate server-side
// (aggregate count free, sponsor identity Pro-only) -- see
// supabase/2026-07-31i-creator-watchlist-interest-visibility.sql for the
// reasoning. Same load-then-rerender-just-this-tab pattern as
// loadPeerPercentiles below.
async function loadCreatorInterest() {
  const { data, error } = await sb.rpc('fn_get_creator_interest', { p_creator_id: profile.id });
  if (error) { console.error('Could not load creator interest:', error.message); return; }
  const rows = data || [];
  dash.interest = {
    totalCount: rows.length ? Number(rows[0].total_count) : 0,
    isLocked: rows.length ? rows[0].is_locked : true,
    sponsors: rows.length && !rows[0].is_locked
      ? rows.filter(r => r.sponsor_id).map(r => ({ companyName: r.company_name, watchlistedAt: r.watchlisted_at }))
      : [],
  };
  if (activeTab === 'overview') {
    document.getElementById('tab-panel').innerHTML = renderTabPanel('overview');
  }
}

async function loadPeerPercentiles() {
  const platforms = Object.keys(dash.compMap || {})
    .filter(k => k.startsWith('engagement_quality_'))
    .map(k => k.replace('engagement_quality_', ''));
  if (!platforms.length) return;

  const results = await Promise.all(platforms.map(async platform => {
    const { data, error } = await sb.rpc('fn_niche_peer_percentile', { p_creator_id: profile.id, p_platform: platform });
    if (error) { console.error(`Could not load peer percentile for ${platform}:`, error.message); return null; }
    const row = data && data[0];
    return row ? { platform, percentile: row.percentile, cohortSize: row.cohort_size, niche: row.niche } : null;
  }));
  dash.peerPercentiles = results.filter(Boolean);

  // fn_niche_peer_percentile is read-only context -- it doesn't affect
  // score, evidence, or anything else on the page, so re-rendering just
  // the Score tab (if it's the active one) is enough; no need to
  // re-fetch or re-render anything else.
  if (activeTab === 'score') {
    document.getElementById('tab-panel').innerHTML = renderTabPanel('score');
  }
}

      ${dash.peerPercentiles.map(p => {

async function downloadEveKitPdf() {
  const btn = document.getElementById('dlBtn');
  if (!btn) return;
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Generating…';
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/documents?type=evekit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token}` },
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      alert('Could not generate Verified Media Kit PDF: ' + (j.error || 'Unknown error'));
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kitscore-verified-media-kit.pdf'; a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Error generating Verified Media Kit PDF: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

function platformFollowerCount(p) {
  return p.subscriber_count || p.follower_count || 0;
}
function fmtCount(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function totalReach() {
  return platforms.reduce((sum, p) => sum + platformFollowerCount(p), 0);
}
function avgEngagementQuality() {
  const rows = (dash.components||[]).filter(c => c.component_key.startsWith('engagement_quality'));
  if (!rows.length) return null;
  return Math.round(rows.reduce((sum, c) => sum + Number(c.value), 0) / rows.length);
}
function avgViewsPerPost() {
  const totalViews = platforms.reduce((sum, p) => sum + (p.view_count || 0), 0);
  const totalVideos = platforms.reduce((sum, p) => sum + (p.video_count || 0), 0);
  return totalVideos > 0 ? Math.round(totalViews / totalVideos) : 0;
}

async function saveMediaKitBio() {

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!ALLOWED_TYPES.includes(file.type)) { alert('Please upload a JPG, PNG, or WebP image.'); return; }
  if (file.size > MAX_UPLOAD_BYTES) { alert('That photo is over 5MB — try a smaller file.'); return; }
  const path = `${profile.id}/avatar-${Date.now()}.${extFor(file)}`;
  const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
  if (upErr) { alert('Upload failed: ' + upErr.message); return; }
  const { data: pub } = sb.storage.from('creator-media').getPublicUrl(path);
  const { error: dbErr } = await sb.from('creators').update({ avatar_url: pub.publicUrl }).eq('id', profile.id);
  if (dbErr) { alert("Saved the photo but couldn't update your profile: " + dbErr.message); return; }
  creator.avatar_url = pub.publicUrl;
  renderHero();
}

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;
  const images = creator.gallery_images || [];
  let html = images.map((url, i) => `
    <div class="pf-gallery-slot filled">
      <img src="${escapeHtml(url)}">
      <div class="pf-gallery-remove" onclick="removeGalleryImage(${i})" title="Remove">✕</div>
    </div>`).join('');
  if (images.length < MAX_GALLERY) {
    html += `
      <label class="pf-gallery-slot">
        <span>+</span>
        <input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadGalleryImage(event)">
      </label>`;
  }
  grid.innerHTML = html;
}

async function uploadGalleryImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!ALLOWED_TYPES.includes(file.type)) { alert('Please upload a JPG, PNG, or WebP image.'); return; }
  if (file.size > MAX_UPLOAD_BYTES) { alert('That photo is over 5MB — try a smaller file.'); return; }
  const images = creator.gallery_images || [];
  if (images.length >= MAX_GALLERY) return;
  const path = `${profile.id}/gallery-${Date.now()}.${extFor(file)}`;
  const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
  if (upErr) { alert('Upload failed: ' + upErr.message); return; }
  const { data: pub } = sb.storage.from('creator-media').getPublicUrl(path);
  const updated = [...images, pub.publicUrl];
  const { error: dbErr } = await sb.from('creators').update({ gallery_images: updated }).eq('id', profile.id);
  if (dbErr) { alert("Saved the photo but couldn't update your gallery: " + dbErr.message); return; }
  creator.gallery_images = updated;
  renderGallery();
}

async function removeGalleryImage(index) {
  const images = [...(creator.gallery_images || [])];
  images.splice(index, 1);

  if (error) { alert('Could not remove photo: ' + error.message); return; }

  renderGallery();

function renderCollaborations() {
  const list = document.getElementById('collabList');
  if (!list) return;
  if (!collaborations.length) { list.innerHTML = `<div class="pf-empty">No collaborations added yet.</div>`; return; }
  list.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:0">${collaborations.map(c => `
    <div class="pf-chip">
      ${c.logo_url ? `<img src="${escapeHtml(c.logo_url)}" class="pf-chip-avatar">` : `<div class="pf-chip-avatar">${escapeHtml((c.brand_name || '?').trim().charAt(0).toUpperCase())}</div>`}
      <span>${escapeHtml(c.brand_name)}</span>
      <span class="pf-chip-x" onclick="removeCollaboration('${c.id}')" title="Remove">✕</span>
    </div>`).join('')}</div>`;
}

async function addCollaboration() {
  const msg = document.getElementById('collabMsg');
  msg.innerHTML = '';
  const brandName = document.getElementById('collabBrandName').value.trim();
  const link = document.getElementById('collabLink').value.trim();
  const fileInput = document.getElementById('collabLogoInput');
  const file = fileInput.files[0];

  if (!brandName) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Brand name is required.</div>`; return; }
  if (file) {
    if (!ALLOWED_TYPES.includes(file.type)) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Please upload a JPG, PNG, or WebP logo.</div>`; return; }
    if (file.size > MAX_UPLOAD_BYTES) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">That logo is over 5MB — try a smaller file.</div>`; return; }
  }

  let logoUrl = null;
  if (file) {
    const path = `${profile.id}/logo-${Date.now()}.${extFor(file)}`;
    const { error: upErr } = await sb.storage.from('creator-media').upload(path, file, { upsert: true });
    if (upErr) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Logo upload failed: ${escapeHtml(upErr.message)}</div>`; return; }
    logoUrl = sb.storage.from('creator-media').getPublicUrl(path).data.publicUrl;
  }

  const { data, error } = await sb.from('creator_collaborations')
    .insert({ creator_id: profile.id, brand_name: brandName, logo_url: logoUrl, link: link || null, display_order: collaborations.length })
    .select('id, brand_name, logo_url, link').single();
  if (error) { msg.innerHTML = `<div class="pf-msg" style="color:#B42318">Could not save: ${escapeHtml(error.message)}</div>`; return; }

  collaborations.push(data);
  document.getElementById('collabBrandName').value = '';
  document.getElementById('collabLink').value = '';
  fileInput.value = '';
  renderCollaborations();
  msg.innerHTML = `<div class="pf-msg" style="color:#1C7C3F">Added.</div>`;
}

async function removeCollaboration(id) {
  const { error } = await sb.from('creator_collaborations').delete().eq('id', id);
  if (error) { alert('Could not remove: ' + error.message); return; }
  collaborations = collaborations.filter(c => c.id !== id);
  renderCollaborations();
}

function copyEveKitLinkFromProfile() {
  const url = `https://kitscore.co/media-kit/${creator.slug || ''}`;
  navigator.clipboard.writeText(url).then(() => {
    const el = document.getElementById('evekit-link-text');
    const original = el.textContent;
    el.textContent = 'Copied!';
    setTimeout(() => { el.textContent = original; }, 1500);
  });
}

function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function authenticityTier(value) {
  if (value >= 85) return { label: 'Strong', color: '#1D9E75' };
  if (value >= 68) return { label: 'Healthy', color: '#1D9E75' };
  if (value >= 55) return { label: 'Typical', color: '#2563EB' };
  if (value >= 40) return { label: 'Below typical', color: '#E58C1A' };
  return { label: 'Low', color: '#DC2626' };
}

function renderAuthenticityTab() {
  const { compMap, platformConnections } = dash;
  const overall = compMap['audience_authenticity'];
  // Union of two sources: platforms with a live OAuth connection, and any
  // platform with an engagement_quality_<platform> component already
  // computed from submitted evidence -- these don't require a
  // platform_connections row at all, so relying on platformConnections
  // alone misses evidence-only creators entirely.
  const fromConnections = (platformConnections || []).map(p => p.platform).filter(Boolean);
  const fromComponents = Object.keys(compMap)
    .filter(k => k.startsWith('engagement_quality_'))
    .map(k => k.replace('engagement_quality_', ''));
  const connectedPlatforms = [...new Set([...fromConnections, ...fromComponents])];

  let overallHtml;
  if (!overall) {
    overallHtml = `<div style="font-size:12.5px;color:var(--color-text-tertiary)">Connect a platform or upload audience evidence to generate this.</div>`;
  } else {
    const tier = authenticityTier(overall.value);
    const isFlagged = overall.status === 'flagged';
    const note = isFlagged
      ? `One of your connected platforms shows an engagement pattern outside the typical range for its follower count. This isn't a confirmed problem — a single underperforming post or video can cause it — but it's worth a look, since a sponsor's own check may notice the same thing.`
      : connectedPlatforms.length
        ? `Nothing unusual detected across your connected platform${connectedPlatforms.length > 1 ? 's' : ''}.`
        : `Based on submitted evidence — connecting a platform via OAuth gives a stronger, live-verified signal instead.`;
    overallHtml = `
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
        <span style="font-size:28px;font-weight:700;color:${tier.color}">${Math.round(overall.value)}</span>
        <span style="font-size:13px;font-weight:600;color:${tier.color}">${tier.label}</span>
      </div>
      <div style="font-size:12.5px;color:var(--color-text-tertiary);line-height:1.5">${note}</div>
    `;
  }

  const PLATFORM_LABELS = { youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', twitch: 'Twitch', discord: 'Discord' };
  const platformRows = connectedPlatforms.map(platform => {
    const comp = compMap['engagement_quality_' + platform];
    const label = PLATFORM_LABELS[platform] || (platform.charAt(0).toUpperCase() + platform.slice(1));
    if (!comp) {
      return `<div class="fact-row" style="padding:10px 0;border-top:1px solid var(--color-border-tertiary)">
        <div style="display:flex;justify-content:space-between">
          <span style="font-size:12.5px;color:var(--color-text-secondary)">${label}</span>
          <span style="font-size:12px;color:var(--color-text-tertiary)">Not enough data yet</span>
        </div>
      </div>`;
    }
    const tier = authenticityTier(comp.value);
    const bench = (dash.nicheBenchmarks || {})[platform];
    let benchHtml = '';
    if (bench) {
      benchHtml = bench.percentile != null
        ? `<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:2px">${ordinal(Math.round(bench.percentile))} percentile among ${bench.cohort_size} ${bench.niche} creators</div>`
        : `<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:2px">Not enough ${bench.niche || 'niche'} creators yet to compare (${bench.cohort_size || 0} so far)</div>`;
    }
    return `<div class="fact-row" style="padding:10px 0;border-top:1px solid var(--color-border-tertiary)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12.5px;color:var(--color-text-secondary)">${label}</span>
        <span style="font-size:12px;font-weight:600;color:${tier.color}">${tier.label}</span>
      </div>
      ${benchHtml}
    </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="sec">Audience authenticity <span style="font-weight:400;text-transform:none;color:var(--color-text-tertiary)">— why your score is what it is, per platform</span></div>
      ${overallHtml}
      ${platformRows ? `<div style="margin-top:14px">${platformRows}</div>` : ''}
    </div>
  `;
}

// Raw follower count over time, per platform -- distinct from
// renderScoreHistory, which charts the composite trust score, not
// follower counts. A steady, gradual line here reads as organic growth;
// a vertical jump is the kind of thing purchased followers look like.
// Reuses the same hand-rolled SVG sparkline as renderScoreHistorySvg for
// visual consistency rather than a second charting approach.
function renderFollowerGrowthCard() {
  const { followerHistory, platformConnections } = dash;
  const byPlatform = {};
  (followerHistory || []).forEach(row => {
    (byPlatform[row.platform] = byPlatform[row.platform] || []).push(row);
  });
  const PLATFORM_LABELS = { youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', twitch: 'Twitch', discord: 'Discord' };
  const platforms = Object.keys(byPlatform);

  if (!platforms.length) {
    return `<div class="card">
      <div class="sec">Follower growth</div>
      <div style="font-size:12.5px;color:var(--color-text-tertiary)">Connect a platform to start tracking growth over time.</div>
    </div>`;
  }

  const sections = platforms.map(platform => {
    const rows = byPlatform[platform];
    const label = PLATFORM_LABELS[platform] || platform;
    if (rows.length < 2) {
      return `<div style="padding:10px 0;border-top:1px solid var(--color-border-tertiary)">
        <div style="font-size:12.5px;color:var(--color-text-secondary);font-weight:600;margin-bottom:4px">${label}</div>
        <div style="font-size:11.5px;color:var(--color-text-tertiary)">Tracking started ${new Date(rows[0].recorded_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} — check back after your next sync to see the trend.</div>
      </div>`;
    }
    const counts = rows.map(r => Number(r.follower_count));
    const first = new Date(rows[0].recorded_at).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
    const last = new Date(rows[rows.length-1].recorded_at).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
    const change = counts[counts.length-1] - counts[0];
    const changeStr = (change >= 0 ? '+' : '') + change.toLocaleString();
    return `<div style="padding:10px 0;border-top:1px solid var(--color-border-tertiary)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:12.5px;color:var(--color-text-secondary);font-weight:600">${label}</span>
        <span style="font-size:11.5px;color:${change>=0?'#1D9E75':'#DC2626'}">${changeStr} followers</span>
      </div>
      ${renderScoreHistorySvg(counts, false)}
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--color-text-tertiary);margin-top:2px">
        <span>${first}</span><span>${last}</span>
      </div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="sec">Follower growth <span style="font-weight:400;text-transform:none;color:var(--color-text-tertiary)">— steady growth reads as organic; sudden jumps are a red flag sponsors look for</span></div>
    ${sections}
  </div>`;
}

async function disconnectPlatform(platform){
  const meta = {
    youtube: { label: 'YouTube', btnId: 'ytDisconnectBtn', msgId: 'ytConnectMsg' },
    tiktok:  { label: 'TikTok',  btnId: 'ttDisconnectBtn', msgId: 'ttConnectMsg' },
    twitch:  { label: 'Twitch',  btnId: 'twDisconnectBtn', msgId: 'twConnectMsg' },
    instagram: { label: 'Instagram', btnId: 'igDisconnectBtn', msgId: 'igConnectMsg' },
    discord: { label: 'Discord', btnId: 'dcDisconnectBtn', msgId: 'dcConnectMsg' },
  }[platform] || { label: platform, btnId: null, msgId: null };

  if (!confirm(`Disconnect ${meta.label}? This removes your ownership-verified connection and its stored access token. You can reconnect any time.`)) return;

  const btn = meta.btnId && document.getElementById(meta.btnId);
  const msgEl = meta.msgId && document.getElementById(meta.msgId);
  if (btn) { btn.disabled = true; btn.textContent = 'Disconnecting…'; }

  const { error } = await sb.rpc('fn_disconnect_platform', { p_platform: platform });
  if (error) {
    if (msgEl) { msgEl.textContent = error.message || `Could not disconnect ${meta.label}.`; msgEl.style.color = '#DC2626'; }
    if (btn) { btn.disabled = false; btn.textContent = 'Disconnect'; }
    return;
  }
  location.reload();
}

async function connectYoutube(){
  const input = document.getElementById('ytHandleInput');
  const btn = document.getElementById('ytConnectBtn');
  const msgEl = document.getElementById('ytConnectMsg');
  const handle = input.value.trim();
  if (!handle) { msgEl.textContent = 'Enter a @handle first.'; msgEl.style.color = '#DC2626'; return; }

  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Connecting…';
  msgEl.textContent = '';

  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/connect-platform', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session?.access_token}`,
      },
      body: JSON.stringify({ handle }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) {
      msgEl.textContent = j.error || 'Could not connect that channel.';
      msgEl.style.color = '#DC2626';
      return;
    }
    msgEl.textContent = 'Connected.';
    msgEl.style.color = '#16A34A';
    await load();
    switchTab('evidence');
  } catch (err) {
    msgEl.textContent = 'Error: ' + err.message;
    msgEl.style.color = '#DC2626';
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

  const msgEl = document.getElementById('dcConnectMsg');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Redirecting…';
  msgEl.textContent = '';

  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/discord-oauth?action=start', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session?.access_token}`,
      },
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.authorizeUrl) {
      msgEl.textContent = j.error || 'Could not start Discord connection.';
      msgEl.style.color = '#DC2626';
      btn.disabled = false;
      btn.textContent = originalLabel;
      return;
    }
    // Full-page navigation to Discord's consent screen -- it redirects
    // back to /api/discord-oauth?action=callback, which then redirects
    // here with ?discord_connected=1 or ?discord_error=..., handled by
    // showDiscordStatusFromQuery() on load below.
    window.location.href = j.authorizeUrl;
  } catch (err) {
    msgEl.textContent = 'Error: ' + err.message;
    msgEl.style.color = '#DC2626';
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

// Reads ?instagram_connected=1 / ?instagram_error=... left by the OAuth
// callback redirect, shows a one-time banner, then strips the params from
// the URL so a page refresh doesn't re-show it. Same shape as
// showTwitchStatusFromQuery() below.
function showInstagramStatusFromQuery(){
  const params = new URLSearchParams(window.location.search);
  const connected = params.get('instagram_connected');
  const error = params.get('instagram_error');
  if (!connected && !error) return;

  const banner = document.getElementById('instagramStatusBanner');
  if (banner) {
    const messages = {
      missing_params: 'Instagram connection was cancelled or incomplete.',
      invalid_state: 'That Instagram connection link expired or was already used — please try connecting again.',
      platform_cap: 'Free plan is limited to one OAuth-verified platform. Upgrade to Pro for unlimited platforms.',
      save_failed: 'Instagram connected, but saving it failed — please try again.',
    };
    const text = connected
      ? 'Instagram account connected and verified.'
      : (messages[error] || `Instagram connection failed: ${error}`);
    const color = connected ? '#16A34A' : '#DC2626';
    banner.innerHTML = `<div style="font-size:12px;color:${color};padding:10px 12px;background:${connected?'#F0FDF4':'#FEF2F2'};border-radius:8px;margin-bottom:14px">${escapeHtml(text)}</div>`;
  }

  params.delete('instagram_connected');
  params.delete('instagram_error');
  const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  window.history.replaceState({}, '', newUrl);
}

// ── Audience demographics: repeatable country rows ──────────────────────
function renderAudienceCountryRows() {
  const container = document.getElementById('audCountryRows');
  if (!container) return; // profile tab not currently mounted
  const rows = audienceData.countries.length ? audienceData.countries : [{label:'',pct:''}];
  container.innerHTML = rows.map((r,i)=>`
    <div class="audCountryRow" style="display:grid;grid-template-columns:1fr 90px 28px;gap:8px;margin-bottom:8px;align-items:center">
      <input class="audCountryLabel" value="${escapeHtml(r.label||'')}" placeholder="e.g. United Kingdom" oninput="updateAudienceTotals()" style="width:100%;padding:7px 10px;font-size:12px;border:0.5px solid var(--color-border-tertiary);border-radius:6px">
      <div style="position:relative">
        <input class="audCountryPct" type="number" min="0" max="100" value="${r.pct??''}" placeholder="0" oninput="updateAudienceTotals()" style="width:100%;padding:7px 22px 7px 10px;font-size:12px;border:0.5px solid var(--color-border-tertiary);border-radius:6px">
        <span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--color-text-tertiary)">%</span>
      </div>
      <button type="button" onclick="removeAudienceCountryRow(${i})" title="Remove country" style="border:none;background:none;color:var(--color-text-tertiary);cursor:pointer;font-size:16px;line-height:1">×</button>
    </div>
  `).join('');
  updateAudienceTotals();
}

function readAudienceCountryRows() {
  return Array.from(document.querySelectorAll('#audCountryRows .audCountryRow')).map(row => ({
    label: row.querySelector('.audCountryLabel').value.trim(),
    pct: row.querySelector('.audCountryPct').value,
  }));
}

function addAudienceCountryRow() {
  audienceData.countries = readAudienceCountryRows();
  audienceData.countries.push({label:'', pct:''});
  renderAudienceCountryRows();
}

function removeAudienceCountryRow(i) {
  audienceData.countries = readAudienceCountryRows();
  audienceData.countries.splice(i, 1);
  renderAudienceCountryRows();
}

// Running totals per dimension -- flagged red if over 100%, but saving
// isn't blocked on an exact 100% since partial self-reported data (e.g.
// "I only know my top 2 countries") is still useful to show sponsors.
function updateAudienceTotals() {
  const sum = vals => vals.reduce((s,v) => s + (parseFloat(v) || 0), 0);
  const setTotal = (id, total) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = total ? `(${total}%)` : '';
    el.style.color = total > 100 ? '#B42318' : 'var(--color-text-tertiary)';
  };
  setTotal('audCountryTotal', sum(readAudienceCountryRows().map(r => r.pct)));
  setTotal('audGenderTotal', sum(Array.from(document.querySelectorAll('.audGenderInput')).map(i => i.value)));
  setTotal('audAgeTotal', sum(Array.from(document.querySelectorAll('.audAgeInput')).map(i => i.value)));
}

async function saveAudienceDemographics(){
  const msgEl = document.getElementById('audSaveMsg');
  const clampPct = v => Math.max(0, Math.min(100, parseInt(v, 10)));

  const countries = readAudienceCountryRows()
    .filter(r => r.label && r.pct !== '')
    .map(r => ({ dimension:'country', label:r.label, pct:clampPct(r.pct) }));

  const genders = Array.from(document.querySelectorAll('.audGenderInput'))
    .filter(i => i.value !== '')
    .map(i => ({ dimension:'gender', label:i.dataset.gender, pct:clampPct(i.value) }));

  const ages = Array.from(document.querySelectorAll('.audAgeInput'))
    .filter(i => i.value !== '')
    .map(i => ({ dimension:'age', label:i.dataset.age, pct:clampPct(i.value) }));

  const rows = [...countries, ...genders, ...ages]
    .map(r => ({ ...r, creator_id: profile.id, updated_at: new Date().toISOString() }));

  // Table has no natural "clear everything" upsert shape (rows come and
  // go as creators add/remove countries), so replace the full set:
  // delete everything for this creator, then insert what's currently in
  // the form. Both steps are covered by the creator's own RLS policies.
  const { error: delError } = await sb.from('audience_demographics').delete().eq('creator_id', profile.id);
  if (delError) { msgEl.style.color = '#B42318'; msgEl.textContent = 'Could not save: ' + delError.message; return; }

  if (rows.length) {
    const { error: insError } = await sb.from('audience_demographics').insert(rows);
    if (insError) { msgEl.style.color = '#B42318'; msgEl.textContent = 'Could not save: ' + insError.message; return; }
  }

  audienceData = {
    countries: countries.map(c => ({ label:c.label, pct:c.pct })),
    genders: Object.fromEntries(genders.map(g => [g.label, g.pct])),
    ages: Object.fromEntries(ages.map(a => [a.label, a.pct])),
  };
  renderAudienceCountryRows();
  msgEl.style.color = '#1C7C3F';
  msgEl.textContent = 'Saved';
  setTimeout(() => { msgEl.textContent = ''; }, 2500);
}

// 2026 sponsored-post rate benchmarks (USD, per single post), banded by
// follower tier. Instagram is the sourced baseline; TikTok and YouTube
// apply a platform multiplier on top. Niche multipliers are a second,
// independent adjustment.
//
// Source: InfluenceFlow's "Sponsored Post Rates 2026" guide for the
// tiered $ ranges and platform gap ("YouTube creators typically charge
// 2-3x more than Instagram... TikTok rates are 20-30% lower"), cross-
// checked against ClipReach's 2026 CPE benchmarks (niche multipliers --
// beauty/lifestyle sit at the low end of spend due to high creator
// supply; finance/health/B2B sit at the high end) and IQFluence's 2026
// engagement data (fashion/beauty engagement near the overall average,
// not a premium category). These are a starting anchor for negotiation,
// not a quote -- actual rates still move with engagement rate,
// exclusivity, and content type (video commands 30-50% more than a
// static post per the same source).
//
// Deliberately banded, not a smooth curve: the source data itself is
// tiered ($/post jumps between nano/micro/mid/macro), so interpolating
// a fake continuous line between bands would imply more precision than
// the underlying benchmarks actually support.
const RATE_TIERS_USD = [
  [0,        10000,    100,   500],
  [10000,    100000,   500,   5000],
  [100000,   1000000,  5000,  25000],
  [1000000,  Infinity, 25000, 60000], // mega-tier deals are individually negotiated well beyond this; treat as a floor, not a ceiling
];
const PLATFORM_RATE_MULT = { instagram: 1, tiktok: 0.75, youtube: 2.5 };
const NICHE_RATE_MULT = {
  finance: 1.4, health: 1.35, sustainability: 1.3, tech: 1.25,
  beauty: 0.9, fashion: 0.95, lifestyle: 0.9, fitness: 1.0,
};

function updateRcFill(slider) {
  const pct = (Number(slider.value) - Number(slider.min)) / (Number(slider.max) - Number(slider.min)) * 100;
  slider.style.setProperty('--rc-fill', pct + '%');
}

function rateTierFor(followers) {
  return RATE_TIERS_USD.find(([min, max]) => followers >= min && followers < max) || RATE_TIERS_USD[RATE_TIERS_USD.length - 1];
}

function rateForFollowers(followers, platform, niche) {
  const [, , rMin, rMax] = rateTierFor(followers);
  const platMult = PLATFORM_RATE_MULT[platform] || 1;
  const nicheMult = NICHE_RATE_MULT[(niche || '').toLowerCase()] || 1;
  return {
    min: Math.round(rMin * platMult * nicheMult / 5) * 5,
    max: Math.round(rMax * platMult * nicheMult / 5) * 5,
  };
}

// USD -> GBP at a rough, static 0.77 (Kitscore's home-market display
// currency); not live FX, same approximation the old flat-multiplier
// version used.
const USD_TO_GBP = 0.77;

function detectCurrency() {
  try {
    const locale = navigator.language || (navigator.languages && navigator.languages[0]) || 'en-GB';
    const region = new Intl.Locale(locale).maximize().region;
    return region === 'US' ? 'USD' : 'GBP'; // defaults to GBP (Kitscore's home market) for everyone else
  } catch (e) {
    return /-us$/i.test(navigator.language || '') ? 'USD' : 'GBP';
  }
}

// The follower slider spans 500 to 2,000,000 -- a >4000x range, which
// renders unusably on a linear scale (a typical 18K-follower creator's
// thumb would sit almost exactly at the left edge on a 0-2,000,000 bar,
// making the slider look empty/broken). Standard fix for sliders spanning
// multiple orders of magnitude: the slider's own value is a 0-1000
// logarithmic position, converted to/from real follower counts here.
const RC_LOG_MIN = Math.log10(500);
const RC_LOG_MAX = Math.log10(2000000);
function sliderToFollowers(v) {
  return Math.round(Math.pow(10, RC_LOG_MIN + (Number(v) / 1000) * (RC_LOG_MAX - RC_LOG_MIN)));
}
function followersToSlider(f) {
  return Math.round(1000 * (Math.log10(Math.max(Number(f), 500)) - RC_LOG_MIN) / (RC_LOG_MAX - RC_LOG_MIN));
}

// Connected platforms with a real follower_count, sorted highest first --
// this is what pre-fills the calculator and drives the platform picker.
// Falls back to an empty array (manual/self-estimate mode) if nothing's
// connected yet.
function rateCalcSources() {
  return (dash.platformConnections || [])
    .filter(p => p.follower_count != null && p.follower_count > 0)
    .sort((a, b) => b.follower_count - a.follower_count);
}

function updateRateCalc(followers) {
  followers = Number(followers);
  document.getElementById('rc-followers-val').textContent = followers.toLocaleString();
  const code = document.getElementById('rc-currency').value;
  const platformSel = document.getElementById('rc-platform');
  const platform = platformSel ? platformSel.value : 'instagram';
  const { min: rMin, max: rMax } = rateForFollowers(followers, platform, creator.niche);
  const symbol = code === 'GBP' ? '£' : '$';
  const conv = code === 'GBP' ? USD_TO_GBP : 1;
  const min = Math.round(rMin * conv / 5) * 5;
  const max = Math.round(rMax * conv / 5) * 5;
  document.getElementById('rc-range').textContent = `${symbol}${min.toLocaleString()}–${symbol}${max.toLocaleString()}`;
}

function onRateCalcPlatformChange() {
  const sources = rateCalcSources();
  const sel = document.getElementById('rc-platform');
  const match = sources.find(s => s.platform === sel.value);
  const slider = document.getElementById('rc-followers');
  if (match) {
    slider.value = followersToSlider(match.follower_count);
    updateRcFill(slider);
    updateRateCalc(match.follower_count);
  } else {
    updateRateCalc(sliderToFollowers(slider.value));
  }
}

function initRateCalc() {
  const currencyEl = document.getElementById('rc-currency');
  if (!currencyEl) return; // Tools tab isn't the active/rendered tab right now -- nothing to init.
  currencyEl.value = detectCurrency();
  const sources = rateCalcSources();
  const slider = document.getElementById('rc-followers');
  const note = document.getElementById('rc-source-note');
  if (sources.length) {
    slider.value = followersToSlider(sources[0].follower_count);
    updateRcFill(slider);
    if (note) {
      const niche = creator.niche ? ` · ${escapeHtml(creator.niche)} niche` : '';
      note.innerHTML = `Personalized from your verified ${escapeHtml(sources[0].platform)} followers${niche}. ${sources.length > 1 ? 'Switch platform above.' : ''}`;
    }
    updateRateCalc(sources[0].follower_count);
  } else {
    if (note) {
      note.innerHTML = `Connect a platform (Inputs tab) for a personalized range — this is a general estimate${creator.niche ? ` for the ${escapeHtml(creator.niche)} niche` : ''} until then.`;
    }
    updateRateCalc(sliderToFollowers(slider.value));
  }
  loadRealPricingBenchmark();
}

// Same fn_pricing_benchmark sponsors already see when drafting a contract
// (app/contracts.html) -- reused as-is, no backend change needed. Compares
// only real funded contracts in the creator's own niche with a similar
// trust score (+/-15), and the function itself refuses to return anything
// below 3 comparable deals (see its own `having count(*) >= 3`), so the
// honest-empty-state behavior is enforced at the SQL level, not something
// built here. Deliberately labeled distinctly from the formula estimate
// above it -- one is a rule-of-thumb, the other is what people actually
// got paid, and conflating them would overstate the formula's rigor.
async function loadRealPricingBenchmark() {
  const el = document.getElementById('rc-real-benchmark');
  if (!el || !creator?.id) return;
  const { data: rows, error } = await sb.rpc('fn_pricing_benchmark', { p_creator_id: creator.id });
  const row = !error && rows && rows[0];
  if (!row) {
    el.innerHTML = `<div style="font-size:12px;color:var(--color-text-tertiary)">Not enough funded contracts in your niche yet to show what similar creators actually got paid — check back as more deals close on Kitscore. The quick estimate below still works in the meantime.</div>`;
    return;
  }
  el.innerHTML = `
    <div style="background:#E9F7EE;border:1px solid #BFE6CC;border-radius:10px;padding:14px 16px">
      <div style="display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#1C7C3F;margin-bottom:8px">
        ${svgIcon('rosette-discount-check', {size:13, stroke:'#1C7C3F'})} Based on real funded deals
      </div>
      <div style="font-size:24px;font-weight:700;color:var(--ink,#0F1B2E)">$${(row.min_cents / 100).toFixed(0)}–$${(row.max_cents / 100).toFixed(0)}</div>
      <div style="font-size:12.5px;color:var(--ink-soft,#5B6472);margin-top:4px">Median $${(row.median_cents / 100).toFixed(0)}, from ${row.sample_size} funded contracts — creators in your niche with a similar trust score.</div>
    </div>
  `;
}
