<style>
  body{padding:0;max-width:none;margin:0}
  .back{font-size:11px;color:#2563EB;cursor:pointer;background:none;border:none;margin-bottom:10px;display:inline-block}
  .verdict-banner{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:13px;padding:5px 12px;border-radius:14px;font-weight:500}
  .b-green{background:#E9F7EE;color:#1C7C3F}
  .b-blue{background:var(--color-background-info);color:#185FA5}
  .b-amber{background:#FEF6E7;color:#92600A}
  .b-red{background:#FDECEC;color:#B42318}
  .card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:14px;margin-bottom:12px}
  .sec{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}

  .cta{padding:9px 16px;background:#2563EB;color:#fff;border:none;border-radius:0;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  /* Teaser paywall styles */
  .teaser-hero{background:linear-gradient(160deg,#11131A 0%,#1C2030 100%);color:#fff;border-radius:var(--border-radius-md);padding:20px;margin-bottom:12px}
  .teaser-hero .score-val{font-size:52px;font-weight:600;color:#7C9CFF;line-height:1}
  .teaser-hero .score-label{font-size:11px;color:#9DB6FF;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .teaser-hero .conf-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(124,156,255,.15);color:#9DB6FF;font-size:11px;padding:4px 10px;border-radius:10px;margin-top:8px}
  .paywall-box{border:1.5px dashed var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:20px;text-align:center;margin-bottom:12px;background:var(--color-background-secondary)}
  .paywall-box h3{font-size:15px;font-weight:500;margin-bottom:6px}
  .paywall-box p{font-size:12px;color:var(--color-text-secondary);margin-bottom:14px;line-height:1.6}
  .paywall-features{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;text-align:left;max-width:300px;margin-left:auto;margin-right:auto}
  .paywall-features li{font-size:12px;color:var(--color-text-secondary);list-style:none;display:flex;align-items:center;gap:6px}
  .blur-preview{filter:blur(4px);user-select:none;pointer-events:none;opacity:.6;margin-bottom:12px}
  .banner{font-size:11px;padding:8px 12px;border-radius:0;margin-bottom:12px}
  .banner.ok{background:#E9F7EE;color:#1C7C3F}
  .banner.pending{background:#FEF6E7;color:#92600A}
  .approval-badge{font-size:10px;padding:3px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px}
  .field textarea{width:100%;padding:9px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:0;font-size:12px;font-family:inherit;height:60px;resize:vertical;background:#fff;color:var(--color-text-primary)}
  .msg{font-size:11px;margin-top:8px;padding:8px 10px;border-radius:0}
  .msg.error{background:#FDECEC;color:#B42318}
  .msg.ok{background:#E9F7EE;color:#1C7C3F}
</style>

<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-mount"></div>
  <div class="app-main">
    <button class="back" onclick="window.location.href='directory.html'">&larr; Back to directory</button>
    <div id="banner"></div>
    <div id="content" class="loading">Loading evaluation…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="nav.js?v=4"></script>
<script>
const VERDICT_STYLE = {
  approve: ['b-green','ti-circle-check','Approve'],
  caution: ['b-amber','ti-alert-triangle','Caution'],
  avoid: ['b-red','ti-circle-x','Avoid']
};
const VERIFICATION_LABEL = { oauth: 'OAuth-verified', public_lookup: 'Public API lookup' };
function provenanceLabel(method) { return VERIFICATION_LABEL[method] || (method ? method : 'Self-reported'); }
function buildFollowerTrends(history) {
  const byPlatform = {};
  (history || []).forEach(h => { if (!byPlatform[h.platform]) byPlatform[h.platform] = []; byPlatform[h.platform].push(h); });
  const trends = [];
  Object.entries(byPlatform).forEach(([platform, points]) => {
    if (points.length < 2) return;
    const first = points[0], last = points[points.length - 1];
    const days = (new Date(last.recorded_at) - new Date(first.recorded_at)) / 86400000;
    if (days < 3 || !first.follower_count) return;
    const pct = ((last.follower_count - first.follower_count) / first.follower_count) * 100;
    const direction = pct > 3 ? 'Growing' : pct < -3 ? 'Declining' : 'Stable';
    trends.push({ platform, pct: Math.round(pct * 10) / 10, days: Math.round(days), direction });
  });
  return trends;
}
function computeRiskLevel(compRowMap, penaltyTotal) {
  const brandSafety = compRowMap.brand_safety;
  if (penaltyTotal >= 15 || (brandSafety && brandSafety.value < 60)) return { label: 'High', color: '#B42318' };
  if (penaltyTotal >= 5 || (brandSafety && brandSafety.value < 80)) return { label: 'Medium', color: '#92600A' };
  return { label: 'Low', color: '#1C7C3F' };
}
let creatorId, profile, currentEvalId, isTeamOwner = false, myTeamId = null, teamClients = [];

// Kept logically identical to buildKeyFindings / buildRecommendationConditions
// / componentRiskBand in lib/handlers/document-sponsor-memo.js -- if you
// change the rules there, change them here too, or the on-screen page and
// the paid PDF will disagree again (that was the original bug this fixed).
function componentRiskBand(value) {
  if (value == null) return null;
  const v = Number(value);
  if (v >= 80) return { label: 'Low', color: '#1C7C3F' };
  if (v >= 60) return { label: 'Medium', color: '#92600A' };
  return { label: 'High', color: '#B42318' };
}
function buildKeyFindings({ compRowMap, verifiedCount, creator, safetyAnswers, penaltyTotal }) {
  const out = [];
  out.push(verifiedCount > 0
    ? { ok: true, text: `${verifiedCount} verified campaign${verifiedCount === 1 ? '' : 's'} with mutual sponsor confirmation` }
    : { ok: false, text: 'No verified campaigns on file yet' });
  const auth = compRowMap.audience_authenticity;
  if (auth) out.push({ ok: Number(auth.value) >= 70, text: `Audience authenticity scored ${auth.value}/100` });
  const consist = compRowMap.content_consistency_youtube;
  if (consist) out.push({ ok: Number(consist.value) >= 70, text: `Content consistency scored ${consist.value}/100 (YouTube)` });
  if (creator?.would_hire_again_pct != null) {
    out.push({ ok: Number(creator.would_hire_again_pct) >= 70, text: `${creator.would_hire_again_pct}% of past sponsors said they'd hire again` });
  }
  if ((safetyAnswers || []).length > 0) {
    out.push(penaltyTotal === 0
      ? { ok: true, text: 'No brand-safety concerns flagged in self-report' }
      : { ok: false, text: `Brand-safety self-report flagged ${penaltyTotal} penalty point${penaltyTotal === 1 ? '' : 's'}` });
  }
  return out.slice(0, 5);
}
function buildRecommendationConditions({ verdictKey, riskLabel, compRowMap, verifiedCount, penaltyTotal }) {
  const conditions = [];
  const auth = compRowMap.audience_authenticity;
  if (verdictKey === 'avoid') {
    if (riskLabel === 'High') conditions.push('Brand safety self-report indicates elevated risk (see Risk Assessment) — do not proceed without a direct conversation with the creator.');
    if (verifiedCount === 0) conditions.push('No verified campaign history exists to confirm delivery reliability.');
    if (auth && Number(auth.value) < 60) conditions.push(`Audience authenticity score (${auth.value}/100) is below Kitscore's recommended threshold.`);
    if (conditions.length === 0) conditions.push('Overall Kitscore falls below the recommended threshold for this evaluation.');
  } else if (verdictKey === 'caution') {
    if (riskLabel !== 'Low') conditions.push('Review brand-safety self-report answers before finalizing creative direction.');
    if (verifiedCount < 2) conditions.push('Limited verified campaign history — consider a smaller trial engagement first.');
    if (auth && Number(auth.value) < 75) conditions.push(`Audience authenticity is self/derived at ${auth.value}/100 — confirm independently if the campaign is high-budget.`);
    if (conditions.length === 0) conditions.push('No specific blockers identified beyond standard due diligence — proceed with normal contract terms.');
  } else {
    conditions.push('Confirm campaign scope and deliverables align with your specific goals.');
    if (penaltyTotal > 0) conditions.push('Review brand-safety self-report answers before finalizing creative direction.');
  }
  return conditions.slice(0, 4);
}

async function authedFetch(url, body) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token || ''}` },
    body: JSON.stringify(body),
  });
  const text = await res.text();
  try { return { ok: res.ok, json: JSON.parse(text) }; }
  catch { return { ok: false, json: { error: `Server error (${res.status}): ${text.slice(0,200)}` } }; }
}

async function load() {
  profile = await requireRole('sponsor');
  if (!profile) return;
  renderSidebar('sponsor', 'directory');

  const params = new URLSearchParams(window.location.search);
  creatorId = params.get('creator');
  if (!creatorId) { document.getElementById('content').textContent = 'No creator specified.'; return; }

  const checkoutState = params.get('checkout');
  if (checkoutState === 'success') {
      document.getElementById('banner').innerHTML = `<div class="banner pending">Payment received — unlocking report</div>`;
      setTimeout(() => { window.location.href = window.location.href.replace('&checkout=success','').replace('?checkout=success','').replace('checkout=success',''); }, 3000);
    } else if (checkoutState === 'cancelled') {
      document.getElementById('banner').innerHTML = `<div class="banner pending">Checkout cancelled — no charge was made.</div>`;
    }
  const [{ data: creator }, { data: profileRow }, { data: components }, { data: campaigns }, { data: evalRow }, { data: membership }, { data: sponsorRow }, { data: audience }, { data: safetyAnswers }, { data: penaltyTable }, { data: connections }, { data: followerHistory }] = await Promise.all([
    sb.from('creators').select('id, niche, location, trust_score, confidence, badge_tier, reliability_score, repeat_sponsor_rate, would_hire_again_pct').eq('id', creatorId).single(),
    sb.from('profiles').select('display_name').eq('id', creatorId).single(),
    sb.from('score_components').select('*').eq('creator_id', creatorId),
    sb.from('campaigns').select('status').eq('creator_id', creatorId).eq('status', 'verified'),
    sb.from('evaluations').select('*').eq('creator_id', creatorId).eq('sponsor_id', profile.id).order('created_at', { ascending: false }).limit(1).maybeSingle(),
    sb.from('team_members').select('team_id, role').eq('sponsor_id', profile.id),
    sb.from('sponsors').select('company_name, plan, evals_used_this_period').eq('id', profile.id).maybeSingle(),
    sb.from('audience_demographics').select('dimension, label, pct').eq('creator_id', creatorId),
    sb.from('brand_safety_answers').select('*').eq('creator_id', creatorId),
    sb.from('brand_safety_penalties').select('*'),
    sb.from('platform_connections').select('platform, verification_method, follower_count, subscriber_count').eq('creator_id', creatorId),
    sb.from('platform_follower_history').select('platform, follower_count, recorded_at').eq('creator_id', creatorId).order('recorded_at', { ascending: true }),
  ]);
  // A sponsor can belong to up to 2 teams. maybeSingle() would throw once
  // that's possible, so this resolves the same "active team" the switcher
  // on team.html sets, defaulting to the first membership if unset/stale.
  const memberships = membership || [];
  const activeTeamId = localStorage.getItem('kitscore_active_team_id');
  const activeMembership = memberships.find(m => m.team_id === activeTeamId) || memberships[0] || null;
  isTeamOwner = activeMembership?.role === 'owner';
  myTeamId = activeMembership?.team_id || null;

  // Starter/Team sponsors get included unlocks per period, then a
  // discounted overage rate (see lib/handlers/billing-checkout.js).
  // Compute what this specific click will actually cost so the button
  // doesn't just say a flat "$29" for every sponsor regardless of
  // plan/usage -- was previously Starter-only, leaving Team sponsors
  // shown the wrong price for what should be a free, included unlock.
  const PLAN_QUOTA = { starter: 25, team: 150 };
  let unlockLabel = 'Unlock full evaluation — $29';
  let unlockLabelShort = 'Unlock full report — $29';
  const quota = PLAN_QUOTA[sponsorRow?.plan];
  if (quota) {
    const used = sponsorRow.evals_used_this_period || 0;
    if (used < quota) {
      unlockLabel = `Unlock full evaluation — free (${used + 1}/${quota} this period)`;
      unlockLabelShort = `Unlock full report — free (${used + 1}/${quota} this period)`;
    } else {
      unlockLabel = 'Unlock full evaluation — $12';
      unlockLabelShort = 'Unlock full report — $12';
    }
  }
  let creatorNotes = [];
  if (myTeamId) {
    const { data: notesData } = await sb.from('team_notes')
      .select('*, sponsors!author_id(profiles!inner(display_name))')
      .eq('team_id', myTeamId).eq('creator_id', creatorId)
      .order('created_at', { ascending: false });
    creatorNotes = notesData || [];
    const { data: clientsData } = await sb.rpc('fn_team_clients', { p_team_id: myTeamId });
    teamClients = clientsData || [];
  }

  const verifiedCount = (campaigns || []).length;
  const compMap = {};
  (components || []).forEach(c => compMap[c.component_key] = c.value);
  const compRowMap = {};
  (components || []).forEach(c => compRowMap[c.component_key] = c);

  const penaltyLookup = {};
  (penaltyTable || []).forEach(p => { penaltyLookup[`${p.question_key}::${p.answer}`] = Number(p.penalty) || 0; });
  const penaltyTotal = (safetyAnswers || []).reduce((sum, a) => sum + (penaltyLookup[`${a.question_key}::${a.answer}`] || 0), 0);

  const creatorName = escapeHtml(profileRow?.display_name || 'Creator');
  const trustScore = creator?.trust_score ?? 0;
  const hasScore = (components || []).length > 0;
  const confidencePct = parseInt(creator?.confidence) || 0;
  const confidence = hasScore && confidencePct >= 70 ? 'High' : confidencePct >= 40 ? 'Moderate' : 'Low';
  const confidenceColor = { High:'#1C7C3F', Moderate:'#92600A', Low:'#B42318' }[confidence];

  // ── No evaluation exists yet — show teaser and generate on first view ─────
  if (!evalRow) {
    document.getElementById('content').innerHTML = `
      <div style="font-size:13px;font-weight:500;margin-bottom:12px">${creatorName}</div>
      <div class="teaser-hero">
        <div class="score-label">Trust score</div>
        <div class="score-val">${hasScore ? trustScore : '—'}</div>
        <div class="conf-badge"><i class="ti ti-shield-check"></i>Confidence: <strong style="margin-left:2px">${confidence}</strong></div>
      </div>
      <div class="reputation-block">
        <div class="rep-header">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" stroke="#D4AF37"/><polyline points="4,7 6,9 10,5" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span class="rep-title">Verified Sponsorship Reputation</span>
        </div>
        <div class="rep-grid">
          <div class="rep-metric"><div class="rm-val gold">${creator?.reliability_score > 0 ? creator.reliability_score : '—'}</div><div class="rm-label">Reliability<br>Score</div></div>
          <div class="rep-metric"><div class="rm-val">${verifiedCount}</div><div class="rm-label">Verified<br>Campaigns</div></div>
          <div class="rep-metric"><div class="rm-val">${creator?.repeat_sponsor_rate > 0 ? creator.repeat_sponsor_rate + '%' : '—'}</div><div class="rm-label">Repeat Sponsor<br>Rate</div></div>
        </div>
      </div>
      <div class="paywall-box">
        <h3>Unlock the full evaluation</h3>
        <p>You're seeing the Trust Score preview. Unlock the complete report for this creator.</p>
        <ul class="paywall-features">
          <li><i class="ti ti-check" style="color:#1C7C3F"></i>Score breakdown & audience fit</li>
          <li><i class="ti ti-check" style="color:#1C7C3F"></i>Risk assessment</li>
          <li><i class="ti ti-check" style="color:#1C7C3F"></i>Evidence summary</li>
          <li><i class="ti ti-check" style="color:#1C7C3F"></i>Recommendation (Approve / Caution / Avoid)</li>
          <li><i class="ti ti-check" style="color:#1C7C3F"></i>Downloadable PDF Decision Memo</li>
        </ul>
        <button class="cta" onclick="generateAndUnlock()"><i class="ti ti-lock-open"></i>${unlockLabel}</button>
      </div>`;
    return;
  }

  currentEvalId = evalRow.id;
  const locked = !evalRow.unlocked;
  const [style_class, icon, label] = VERDICT_STYLE[evalRow.recommendation_verdict] || VERDICT_STYLE.caution;

  // ── Evaluation exists but not unlocked — teaser + paywall ─────────────────
  if (locked) {
    document.getElementById('content').innerHTML = `
      <div style="font-size:13px;font-weight:500;margin-bottom:12px">${creatorName}</div>
      <div class="teaser-hero">
        <div class="score-label">Trust score</div>
        <div class="score-val">${trustScore}</div>
        <div class="conf-badge"><i class="ti ti-shield-check"></i>Confidence: <strong style="margin-left:2px">${confidence}</strong></div>
      </div>
      <div class="reputation-block">
        <div class="rep-header">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" stroke="#D4AF37"/><polyline points="4,7 6,9 10,5" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span class="rep-title">Verified Sponsorship Reputation</span>
        </div>
        <div class="rep-grid">
          <div class="rep-metric"><div class="rm-val gold">${creator?.reliability_score > 0 ? creator.reliability_score : '—'}</div><div class="rm-label">Reliability<br>Score</div></div>
          <div class="rep-metric"><div class="rm-val">${verifiedCount}</div><div class="rm-label">Verified<br>Campaigns</div></div>
          <div class="rep-metric"><div class="rm-val">${creator?.repeat_sponsor_rate > 0 ? creator.repeat_sponsor_rate + '%' : '—'}</div><div class="rm-label">Repeat Sponsor<br>Rate</div></div>
        </div>
      </div>
      <div class="blur-preview">
        <div class="card">
          <div class="sec">Score breakdown</div>
          ${(components||[]).map(c => `<div class="row"><span style="width:160px;color:var(--color-text-secondary)">${c.label}</span><strong>${c.value}</strong></div>`).join('')}
        </div>
      </div>
      <div class="paywall-box">
        <h3>${unlockLabel.replace('Unlock full evaluation', 'Unlock the full evaluation')}</h3>
        <p>${quota ? `Included in your plan's allowance, or $12 once you've used all ${quota} for this period.` : 'One-time payment.'} Includes recommendation, risk assessment, audience fit, evidence summary, and PDF download.</p>
        <button class="cta" onclick="unlock()"><i class="ti ti-lock-open"></i>${unlockLabelShort}</button>
      </div>`;
    return;
  }

  // ── Unlocked — show everything ────────────────────────────────────────────
  const riskInfo = computeRiskLevel(compRowMap, penaltyTotal);
  const findings = buildKeyFindings({ compRowMap, verifiedCount, creator, safetyAnswers, penaltyTotal });
  const conditions = buildRecommendationConditions({ verdictKey: evalRow.recommendation_verdict || 'caution', riskLabel: riskInfo.label, compRowMap, verifiedCount, penaltyTotal });

  const audByDim = (dim) => (audience || []).filter(r => r.dimension === dim).sort((a, b) => b.pct - a.pct);
  const audCountries = audByDim('country'), audAges = audByDim('age'), audGenders = audByDim('gender');
  const AUD_GENDER_LABEL = { female: 'Female', male: 'Male', other: 'Other' };
  const hasAudienceData = audCountries.length > 0 || audAges.length > 0 || audGenders.length > 0;

  const planLabel = evalRow.team_id ? 'Team' : (sponsorRow?.plan ? sponsorRow.plan.charAt(0).toUpperCase() + sponsorRow.plan.slice(1) : '—');
  const unlockedDate = evalRow.unlocked_at ? new Date(evalRow.unlocked_at).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' }) : '—';

  const sponsorContextCard = `
    <div class="card">
      <div class="sec">Sponsor context</div>
      <div class="row"><span style="width:160px;color:var(--color-text-secondary)">Sponsor</span><strong>${escapeHtml(sponsorRow?.company_name || '—')}</strong></div>
      <div class="row"><span style="width:160px;color:var(--color-text-secondary)">Plan</span><strong>${escapeHtml(planLabel)}</strong></div>
      <div class="row"><span style="width:160px;color:var(--color-text-secondary)">Evaluation ID</span><strong>${escapeHtml(evalRow.id.slice(0,8))}</strong></div>
      <div class="row"><span style="width:160px;color:var(--color-text-secondary)">Unlocked</span><strong>${escapeHtml(unlockedDate)}</strong></div>
    </div>`;

  const provenanceCard = (connections||[]).length > 0 ? `
    <div class="card">
      <div class="sec">Data provenance</div>
      ${connections.map(c => {
        const method = provenanceLabel(c.verification_method);
        const count = c.follower_count || c.subscriber_count;
        const platformLabel = c.platform.charAt(0).toUpperCase() + c.platform.slice(1);
        return `<div class="row" style="justify-content:space-between"><span>${escapeHtml(platformLabel)}</span><strong style="color:${method==='OAuth-verified'?'#1C7C3F':'inherit'}">${escapeHtml(method)}</strong><span style="color:var(--color-text-tertiary)">${count?count.toLocaleString()+' followers':''}</span></div>`;
      }).join('')}
    </div>` : '';

  const followerTrends = buildFollowerTrends(followerHistory);
  const followerTrendCard = followerTrends.length > 0 ? `
    <div class="card">
      <div class="sec">Follower growth trend</div>
      ${followerTrends.map(t => {
        const dirColor = t.direction==='Growing'?'#1C7C3F':t.direction==='Declining'?'#B42318':'var(--color-text-secondary)';
        const sign = t.pct>0?'+':'';
        const platformLabel = t.platform.charAt(0).toUpperCase() + t.platform.slice(1);
        return `<div class="row" style="justify-content:space-between"><span>${escapeHtml(platformLabel)}</span><strong style="color:${dirColor}">${t.direction} (${sign}${t.pct}%)</strong><span style="color:var(--color-text-tertiary)">over ${t.days} days</span></div>`;
      }).join('')}
    </div>` : '';

  const keyFindingsCard = `
    <div class="card">
      <div class="sec">Key findings</div>
      ${findings.map(f => `<div class="row"><span style="width:8px;height:8px;border-radius:50%;background:${f.ok ? '#1C7C3F' : '#92600A'};display:inline-block;flex-shrink:0"></span>${escapeHtml(f.text)}</div>`).join('')}
    </div>`;

  const audienceFitCard = hasAudienceData ? `
    <div class="card">
      <div class="sec">Audience fit analysis</div>
      <div style="font-size:10px;font-style:italic;color:var(--color-text-tertiary);margin-bottom:8px">Self-reported by the creator, not verified against platform analytics.</div>
      ${audCountries.length ? `<div class="row"><span style="width:160px;color:var(--color-text-secondary)">Top countries</span><strong>${escapeHtml(audCountries.map(c=>`${c.label} (${c.pct}%)`).join(', '))}</strong></div>` : ''}
      ${audAges.length ? `<div class="row"><span style="width:160px;color:var(--color-text-secondary)">Age breakdown</span><strong>${escapeHtml(audAges.map(a=>`${a.label} (${a.pct}%)`).join(', '))}</strong></div>` : ''}
      ${audGenders.length ? `<div class="row"><span style="width:160px;color:var(--color-text-secondary)">Gender split</span><strong>${escapeHtml(audGenders.map(g=>`${AUD_GENDER_LABEL[g.label]||g.label} (${g.pct}%)`).join(', '))}</strong></div>` : ''}
    </div>` : '';

  const compRiskRows = [
    ['Audience authenticity', compRowMap.audience_authenticity],
    ['Content consistency (YouTube)', compRowMap.content_consistency_youtube],
  ].filter(([, comp]) => comp && componentRiskBand(comp.value));
  const riskAssessmentCard = ((safetyAnswers||[]).length > 0 || compRiskRows.length > 0) ? `
    <div class="card">
      <div class="sec">Risk assessment</div>
      ${(safetyAnswers||[]).map(a => {
        const penalty = penaltyLookup[`${a.question_key}::${a.answer}`] || 0;
        const rr = penalty >= 8 ? {label:'High',color:'#B42318'} : penalty >= 3 ? {label:'Medium',color:'#92600A'} : {label:'Low',color:'#1C7C3F'};
        return `<div class="row" style="justify-content:space-between"><span>${escapeHtml(a.question_key.replace(/_/g,' '))}: ${escapeHtml(a.answer)}</span><strong style="color:${rr.color}">${rr.label}</strong></div>`;
      }).join('')}
      ${compRiskRows.map(([label, comp]) => {
        const band = componentRiskBand(comp.value);
        return `<div class="row" style="justify-content:space-between"><span>${escapeHtml(label)}: ${comp.value}/100</span><strong style="color:${band.color}">${band.label}</strong></div>`;
      }).join('')}
      <div style="font-size:10px;color:var(--color-text-tertiary);margin-top:8px">Brand-safety rows are self-reported by the creator. Audience authenticity and content consistency are computed from verified platform data.</div>
    </div>` : '';

  const recommendationCard = `
    <div class="card">
      <div class="sec">Recommendation & conditions</div>
      <div style="font-weight:600;margin-bottom:8px">${label}</div>
      ${conditions.map(c => `<div class="row"><span style="width:8px;height:8px;border-radius:50%;background:#2563EB;display:inline-block;flex-shrink:0;margin-top:5px"></span>${escapeHtml(c)}</div>`).join('')}
    </div>`;

  document.getElementById('content').innerHTML = `
    <div style="font-size:13px;font-weight:500;margin-bottom:12px">${creatorName} · ${escapeHtml(creator?.niche||'')} · ${escapeHtml(creator?.location||'')}</div>
    <div class="teaser-hero">
      <div class="score-label">Trust score</div>
      <div class="score-val">${trustScore}</div>
      <div class="conf-badge"><i class="ti ti-shield-check"></i>Confidence: <strong style="margin-left:2px">${confidence}</strong></div>
    </div>
    <div class="card">
      <div class="verdict-banner">
        <span class="badge ${style_class}"><i class="ti ${icon}"></i> Recommendation: ${label}</span>
        <span class="badge b-blue">${verifiedCount} verified campaigns</span>
      </div>
      <div style="font-size:12px;color:var(--color-text-secondary);line-height:1.7;margin-bottom:12px">${escapeHtml(evalRow.recommendation_summary || '')}</div>
      <button class="cta" style="background:#1C7C3F;margin-top:12px" onclick="downloadPdf()"><i class="ti ti-file-download"></i>Download PDF</button>
      <button class="cta" style="background:var(--color-background-secondary);color:var(--color-text-secondary);margin-top:12px;margin-left:8px" onclick="window.location.href='campaigns.html?creator=${creatorId}'"><i class="ti ti-flag"></i>Log a campaign with this creator</button>
    </div>
    ${sponsorContextCard}
    ${provenanceCard}
    ${followerTrendCard}
    ${keyFindingsCard}
    ${audienceFitCard}
    <div class="card">
      <div class="sec">Score breakdown</div>
      ${(components||[]).map(c => `<div class="row"><span style="width:160px;color:var(--color-text-secondary)">${c.label}</span><strong>${c.value}</strong></div>`).join('')}
    </div>
    ${riskAssessmentCard}
    ${recommendationCard}
    ${evalRow.team_id ? `
    <div class="card">
      <div class="sec">Client</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">Organize this evaluation under one of your team's clients.</div>
      <select id="clientSelect" onchange="assignClient(this.value)" style="width:100%;padding:8px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:0;font-size:12px;background:#fff;color:var(--color-text-primary)">
        <option value="">— No client —</option>
        ${teamClients.map(c => `<option value="${c.client_id}" ${evalRow.client_id === c.client_id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
      </select>
      ${!teamClients.length ? `<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:6px">No clients yet — add one from <a href="team.html" style="color:#2563EB">Team → Clients</a>.</div>` : ''}
      <div id="clientMsg"></div>
    </div>` : ''}
    ${evalRow.team_id ? `
    <div class="card">
      <div class="sec">Approval workflow</div>
      ${evalRow.approval_status === 'draft' ? `
        <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">Submit to your team for review before acting on it.</div>
        <button class="cta" onclick="submitForReview()">Submit for team review</button>
      ` : evalRow.approval_status === 'pending_approval' ? `
        <div class="approval-badge b-amber" style="margin-bottom:10px">Pending team approval</div>
        ${isTeamOwner ? `
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="cta" style="background:#1C7C3F" onclick="reviewEvaluation('approved')">Approve</button>
          <button class="cta" style="background:#B42318" onclick="reviewEvaluation('rejected')">Reject</button>
        </div>
        <input id="approvalNote" style="width:100%;padding:8px;border:0.5px solid var(--color-border-tertiary);border-radius:0;font-size:12px" placeholder="Optional note…">
        ` : `
        <div style="font-size:12px;color:var(--color-text-secondary)">Waiting on your team owner to approve or reject this.</div>
        `}
      ` : evalRow.approval_status === 'approved' ? `
        <span class="approval-badge b-green"><i class="ti ti-circle-check"></i>Approved${evalRow.approval_note ? ' — ' + evalRow.approval_note : ''}</span>
      ` : `
        <span class="approval-badge b-red"><i class="ti ti-circle-x"></i>Rejected${evalRow.approval_note ? ' — ' + evalRow.approval_note : ''}</span>
      `}
    </div>` : ''}
    ${myTeamId ? `
    <div class="card">
      <div class="sec">Team notes on this creator</div>
      <div class="field" style="margin-bottom:10px"><textarea id="creatorNoteText" placeholder="Leave a note for your team about this creator…"></textarea></div>
      <button class="cta" onclick="postCreatorNote()">Post note</button>
      <div id="creatorNoteMsg"></div>
      <div style="margin-top:14px">
        ${creatorNotes.length ? creatorNotes.map(n => `
          <div style="padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
            <div style="font-size:10px;color:var(--color-text-tertiary);margin-bottom:3px">${escapeHtml(n.sponsors?.profiles?.display_name || '—')} · ${new Date(n.created_at).toLocaleDateString('en-GB')}</div>
            <div style="font-size:12px">${escapeHtml(n.content)}</div>
          </div>`).join('') : '<div style="font-size:12px;color:var(--color-text-secondary)">No notes yet on this creator.</div>'}
      </div>
    </div>` : ''}
  `;
}

async function assignClient(clientId) {
  const msgEl = document.getElementById('clientMsg');
  const { error } = await sb.from('evaluations').update({ client_id: clientId || null }).eq('id', currentEvalId);
  if (error) { msgEl.innerHTML = `<div class="msg error">Could not update: ${escapeHtml(error.message)}</div>`; return; }
  msgEl.innerHTML = `<div class="msg ok">Saved.</div>`;
  setTimeout(() => { if (msgEl) msgEl.innerHTML = ''; }, 2000);
}

async function postCreatorNote() {
  const content = document.getElementById('creatorNoteText').value.trim();
  if (!content) { document.getElementById('creatorNoteMsg').innerHTML = '<div class="msg error">Note cannot be empty.</div>'; return; }
  const { error } = await sb.from('team_notes').insert({ team_id: myTeamId, author_id: profile.id, creator_id: creatorId, content });
  if (error) { document.getElementById('creatorNoteMsg').innerHTML = `<div class="msg error">Could not post: ${escapeHtml(error.message)}</div>`; return; }
  load();
}

// First visit: generate evaluation server-side then go straight to Stripe
async function generateAndUnlock() {
  const { ok, json } = await authedFetch('/api/generate-evaluation', { creatorId, teamId: myTeamId });
  if (!ok) { alert('Could not generate evaluation: ' + (json.error || 'unknown error')); return; }
  currentEvalId = json.evaluation.id;
  await unlock();
}

async function unlock() {
  try {
    const { ok, json } = await authedFetch('/api/billing?action=checkout', {
      product: 'evaluation_unlock',
      evaluationId: currentEvalId,
      creatorId,
    });
    if (!ok) {
      if (json.requiresApproval) {
        const { ok: reqOk, json: reqJson } = await authedFetch('/api/team?action=request-approval', {
          actionType: 'evaluation_unlock',
          targetType: 'evaluation',
          targetId: currentEvalId,
        });
        alert(reqOk ? (reqJson.message || 'Sent to your team owner for approval.') : (reqJson.error || 'Could not send request.'));
        return;
      }
      alert('Could not start checkout: ' + (json.error || 'unknown error'));
      return;
    }
    window.location.href = json.url;
  } catch (err) { alert('Checkout failed: ' + err.message); }
}

async function submitForReview() {
  const { error } = await sb.from('evaluations').update({ approval_status: 'pending_approval' }).eq('id', currentEvalId);
  if (error) { alert('Could not submit: ' + error.message); return; }
  load();
}

async function reviewEvaluation(status) {
  if (!isTeamOwner) { alert('Only your team owner can approve or reject.'); return; }
  const note = document.getElementById('approvalNote')?.value?.trim() || null;
  const { error } = await sb.from('evaluations').update({
    approval_status: status, approval_note: note, reviewed_at: new Date().toISOString(),
  }).eq('id', currentEvalId);
  if (error) { alert('Could not update: ' + error.message); return; }
  load();
}

async function downloadPdf() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/documents?type=sponsor-memo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token || ''}` },
      body: JSON.stringify({ evaluationId: currentEvalId }),
    });
    if (!res.ok) {
      const text = await res.text();
      try { alert('Could not generate PDF: ' + (JSON.parse(text).error || 'unknown')); }
      catch { alert('Could not generate PDF (' + res.status + '): ' + text.slice(0,200)); }
      return;
    }
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kitscore-report.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    window.URL.revokeObjectURL(url);
  } catch (err) { alert('PDF download failed: ' + err.message); }
}

load();
</script>
