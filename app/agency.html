<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  body{background:var(--canvas)}
  .app-main{max-width:1180px;padding:40px 48px 80px}
  .ptitle{font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-bottom:6px}
  .psub{font-size:14px;color:var(--ink-soft);margin-bottom:24px}
  .card{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,21,31,.03);padding:26px 28px;margin-bottom:20px}
  .msg{font-size:12px;margin-top:8px;padding:10px 12px;border-radius:0}
  .msg.error{background:#FDECEC;color:#B42318}
  .msg.ok{background:var(--green-soft,#E9F7EE);color:#137C52}
  .agency-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .agency-tab{padding:12px 18px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent}
  .agency-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .roster-card{background:#fff;border:1px solid var(--line);padding:20px}
  .roster-card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .roster-avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-soft,#EEF2FF);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
  .roster-name{font-size:14.5px;font-weight:600;color:var(--ink)}
  .roster-niche{font-size:12px;color:var(--ink-soft)}
  .roster-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
  .roster-stat-num{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--ink)}
  .roster-stat-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft)}
  .empty-state svg{opacity:.3;margin-bottom:12px}
</style>
</head>
<body>
<div id="sidebar-mount" class="sidebar"></div>
<main class="app-main">
  <div id="content">
    <div class="ptitle">Agency</div>
    <div class="psub">Loading…</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="nav.js?v=4"></script>
<script>
let profile, roster = [], staff = [];
let activeTab = 'roster';

const AGENCY_TABS = [
  ['roster', 'Roster'],
  ['staff', 'Staff'],
];

async function load() {
  profile = await requireRole('manager');
  if (!profile) return;
  renderSidebar('manager', 'agency');

  await loadRoster();
  await loadStaff();
  render();
}

async function loadStaff() {
  const { data: links } = await sb.from('agency_staff')
    .select('id, status, created_at, profiles!agency_staff_staff_id_fkey(display_name, email)')
    .eq('owner_id', profile.id)
    .order('created_at', { ascending: false });
  staff = (links || []).filter(l => l.status === 'active').map(l => ({
    linkId: l.id, name: l.profiles?.display_name, email: l.profiles?.email, accepted: true,
  }));

  const { data: pending } = await sb.from('agency_staff_invites')
    .select('id, email')
    .eq('owner_id', profile.id)
    .is('accepted_at', null)
    .gt('expires_at', new Date().toISOString());
  (pending || []).forEach(inv => staff.push({ linkId: null, inviteId: inv.id, email: inv.email, accepted: false }));
}

async function loadRoster() {
  const { data: links } = await sb.from('manager_creator_links')
    .select('creator_id, created_at, creators(niche, trust_score, plan, profiles(display_name))')
    .eq('manager_id', profile.id)
    .eq('status', 'active');

  roster = links || [];

  // Pull pipeline counts per creator using the Phase 2 manager SELECT
  // grants on contracts and brief_applications -- this is the actual
  // proof those RLS policies work end to end, not just in isolation.
  await Promise.all(roster.map(async r => {
    const [{ count: activeContracts }, { count: pendingApplications }] = await Promise.all([
      sb.from('contracts').select('id', { count: 'exact', head: true }).eq('creator_id', r.creator_id).eq('status', 'fully_signed'),
      sb.from('brief_applications').select('id', { count: 'exact', head: true }).eq('creator_id', r.creator_id).eq('status', 'pending'),
    ]);
    r.activeContracts = activeContracts || 0;
    r.pendingApplications = pendingApplications || 0;
  }));
}

function render() {
  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between">
      <div>
        <div class="ptitle">Agency</div>
        <div class="psub">Your linked creators, in one place.</div>
      </div>
      <button class="pf-btn" style="padding:8px 14px;font-size:12.5px" onclick="exportAuditTrail()">Export audit trail</button>
    </div>
    <div class="agency-tabs">
      ${AGENCY_TABS.map(([key, label]) => `<div class="agency-tab ${activeTab === key ? 'active' : ''}" onclick="switchTab('${key}')">${label}</div>`).join('')}
    </div>
    <div id="tab-panel">${renderTabPanel(activeTab)}</div>
  `;
}

function csvEscape(val) {
  const s = String(val ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

async function exportAuditTrail() {
  const { data: rows, error } = await sb.rpc('fn_manager_audit_trail');
  if (error) { alert('Could not export audit trail: ' + error.message); return; }

  const csvRows = [['Date', 'Type', 'Actor', 'Subject', 'Detail', 'Status']];
  (rows || []).forEach(r => {
    csvRows.push([
      new Date(r.event_date).toISOString(),
      r.event_type,
      r.actor_name || '',
      r.subject_name || '',
      r.detail || '',
      r.status || '',
    ]);
  });

  const csv = csvRows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `agency-audit-trail-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function renderTabPanel(key) {
  if (key === 'roster') return renderRosterTab();
  if (key === 'staff') return renderStaffTab();
  return '';
}

function renderRosterTab() {
  if (!roster.length) {
    return `
      <div class="card">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8" r="3.6"/><path d="M2.4 20.5c0-3.6 3-6.1 6.6-6.1s6.6 2.5 6.6 6.1"/></svg>
          <div style="font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px">No creators linked yet</div>
          <div style="font-size:12.5px;max-width:340px;margin:0 auto">Ask a creator to invite you from their Profile page — the Manager section under Account settings.</div>
        </div>
      </div>`;
  }

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
      <button class="pf-btn-save" id="scanBtn" onclick="scanRosterExclusivity()" style="width:auto;padding:9px 16px">Scan roster for exclusivity conflicts</button>
    </div>
    <div id="exclusivityResults"></div>
    <div class="roster-grid">
      ${roster.map(r => {
        const name = r.creators?.profiles?.display_name || 'Creator';
        const initial = name.trim().charAt(0).toUpperCase();
        const score = r.creators?.trust_score;
        return `
        <div class="roster-card">
          <div class="roster-card-top">
            <div class="roster-avatar">${initial}</div>
            <div>
              <div class="roster-name">${escapeHtml(name)}</div>
              <div class="roster-niche">${escapeHtml(r.creators?.niche || 'No niche set')}${score != null ? ` · Trust Score ${Math.round(score)}` : ''}</div>
            </div>
          </div>
          <div class="roster-stats">
            <div><div class="roster-stat-num">${r.activeContracts}</div><div class="roster-stat-label">Active contracts</div></div>
            <div><div class="roster-stat-num">${r.pendingApplications}</div><div class="roster-stat-label">Pending briefs</div></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

async function scanRosterExclusivity() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = 'Scanning…';
  const resultsEl = document.getElementById('exclusivityResults');
  resultsEl.innerHTML = '';

  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch('/api/team?action=scan-roster-exclusivity', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({}),
    });
    const result = await res.json();
    if (!res.ok) { resultsEl.innerHTML = `<div class="msg error">${escapeHtml(result.error || 'Scan failed.')}</div>`; return; }

    if (!result.results || !result.results.length) {
      resultsEl.innerHTML = `<div class="msg ok">Scanned ${result.scannedCreators || 0} creator(s) — no exclusivity conflicts found. This checks each creator's own signed contracts against each other, not conflicts between different creators on your roster.</div>`;
      return;
    }

    resultsEl.innerHTML = `
      <div class="card" style="border-color:#F0B429">
        <div style="font-weight:600;font-size:13.5px;margin-bottom:10px">Possible exclusivity conflicts found — not legal advice, review the actual contracts</div>
        ${result.results.map(r => `
          <div style="padding:10px 0;border-top:1px solid var(--line)">
            <div style="font-weight:600;font-size:13px">${escapeHtml(r.creatorName)}</div>
            ${r.flags.map(f => `<div style="font-size:12px;color:var(--ink-soft);margin-top:4px">${f.rationale ? escapeHtml(f.rationale) : 'Flagged from a previous scan — open this contract to review.'}</div>`).join('')}
          </div>
        `).join('')}
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Scan roster for exclusivity conflicts';
  }
}

function renderStaffTab() {
  const activeStaff = staff.filter(s => s.accepted);
  const pendingStaff = staff.filter(s => !s.accepted);
  return `
    <div class="card">
      <div style="font-size:14.5px;font-weight:600;margin-bottom:6px">Agency staff</div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px">Staff you invite get the exact same roster access you have — the same creators, the same permissions. Nothing more, nothing scoped down.</div>
      <div id="staffList">
        ${!staff.length ? '<div style="font-size:12.5px;color:var(--ink-soft)">No staff yet.</div>' : staff.map(s => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)">
            <div>
              <div style="font-size:13px;font-weight:600">${escapeHtml(s.name || s.email)}</div>
              <div style="font-size:11.5px;color:var(--ink-soft)">${s.accepted ? 'Active' : 'Invite pending'}</div>
            </div>
            ${s.accepted ? `<button class="pf-btn" style="padding:5px 10px;font-size:11.5px" onclick="revokeStaff('${s.linkId}')">Revoke</button>` : ''}
          </div>
        `).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <input id="staffEmail" type="email" placeholder="staff@example.com" style="flex:1;padding:9px 10px;border:1px solid var(--line);font-size:13px">
        <button class="pf-btn-save" style="width:auto;padding:9px 16px" onclick="inviteStaff()">Send invite</button>
      </div>
      <div id="staffMsg"></div>
    </div>`;
}

async function inviteStaff() {
  const email = document.getElementById('staffEmail').value.trim();
  if (!email) { showStaffMsg('Enter an email address.', 'error'); return; }
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/team?action=invite-staff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ email }),
  });
  const result = await res.json();
  if (!res.ok) { showStaffMsg(result.error || 'Could not send invite.', 'error'); return; }
  showStaffMsg(result.message, 'ok');
  await loadStaff();
  render();
}

async function revokeStaff(staffLinkId) {
  if (!confirm('Revoke this staff member\u2019s access?')) return;
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/team?action=revoke-staff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ staffLinkId }),
  });
  const result = await res.json();
  if (!res.ok) { showStaffMsg(result.error || 'Could not revoke access.', 'error'); return; }
  await loadStaff();
  render();
}

function showStaffMsg(text, type) {
  const el = document.getElementById('staffMsg');
  if (el) el.innerHTML = `<div class="msg ${type}">${escapeHtml(text)}</div>`;
}

function switchTab(key) {
  activeTab = key;
  render();
}

load();
</script>
</body>
</html>
