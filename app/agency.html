<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency — Kitscore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css?v=2">
<style>
  :root{
    --pf-blue:#2755F0; --pf-blue-deep:#0B2A6B; --pf-teal:#17B8A6;
    --pf-ink:#0B1220; --pf-ink-soft:#5B6472; --pf-ink-faint:#9AA3B2; --pf-line:#E6E9F0;
    --pf-radius:16px; --pf-shadow:0 1px 2px rgba(11,18,32,0.04), 0 8px 24px rgba(11,18,32,0.06);
  }
  body{background:var(--canvas);font-family:'Space Grotesk',sans-serif}
  .app-main{max-width:1180px;padding:40px 48px 80px}
  .ptitle{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:6px}
  .psub{font-size:13.5px;color:var(--ink-soft);margin-bottom:24px;font-family:'Inter',sans-serif}
  .msg{font-size:12px;margin-top:8px;padding:10px 12px;border-radius:8px;font-family:'Inter',sans-serif}
  .msg.error{background:#FDECEC;color:#B42318}
  .msg.ok{background:#E9F7EE;color:#137C52}

  /* Hero */
  .hero{position:relative;background:linear-gradient(135deg,#0B2A6B 0%,#142B63 55%,#0E3350 100%);border-radius:20px;padding:32px 36px;margin-bottom:22px;color:#fff;overflow:hidden}
  .hero-bg{position:absolute;inset:0;opacity:.08;pointer-events:none}
  .hero-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:26px}
  .hero-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9DB4F0;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .hero-eyebrow::before{content:"";width:6px;height:6px;background:var(--pf-teal);border-radius:50%}
  .hero-title{font-family:'Fraunces',serif;font-size:28px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
  .hero-sub{font-size:13.5px;color:#C7D2E8;max-width:440px;line-height:1.6;font-family:'Inter',sans-serif}
  .hero-export{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .hero-export:hover{background:rgba(255,255,255,.16)}

  .hero-score-row{position:relative;display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-bottom:24px}
  .hero-ring-wrap{position:relative;width:112px;height:112px;flex-shrink:0}
  .hero-ring-wrap svg{width:112px;height:112px;transform:rotate(-90deg)}
  .hero-ring-track{fill:none;stroke:rgba(255,255,255,.18);stroke-width:9}
  .hero-ring-fill{fill:none;stroke:var(--pf-teal);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
  .hero-ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,calc(-50% - 10px));font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:#fff}
  .hero-ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,calc(-50% + 16px));font-size:8.5px;color:#9DB4E8;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .hero-badges{display:flex;flex-direction:column;gap:12px;font-family:'Inter',sans-serif}
  .badge-row{display:flex;flex-wrap:wrap;gap:8px}
  .badge-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px}
  .pill-roster{background:rgba(95,216,184,.14);border:1px solid rgba(95,216,184,.3);color:#B8ECDC}
  .pill-plan{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;text-transform:uppercase;letter-spacing:.03em}
  .hero-formula{font-size:12px;color:#9DB4E8;max-width:440px;line-height:1.55}
  .hero-upgrade{font-size:11.5px;color:#9DB4F0;text-decoration:none;font-weight:600;margin-top:2px;display:inline-block}

  .hero-stats{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 16px}
  .hstat .v{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
  .hstat .l{font-size:11px;color:#9DB4E8;margin-top:2px}
  @media(max-width:720px){.hero-stats{grid-template-columns:repeat(2,1fr)}}

  /* Tabs */
  .mgr-tabs{display:grid;grid-template-columns:repeat(var(--tab-count,7),1fr);gap:10px;margin-bottom:20px}
  .mgr-tab{background:#fff;border:1px solid var(--pf-line);border-radius:14px;box-shadow:var(--pf-shadow);padding:14px 8px;text-align:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;font-family:'Inter',sans-serif}
  .mgr-tab:hover{transform:translateY(-2px)}
  .mgr-tab-icon{width:30px;height:30px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:#F1F4FA;color:var(--pf-ink-soft);border-radius:10px}
  .mgr-tab-icon svg{width:15px;height:15px}
  .mgr-tab-label{font-size:11.5px;font-weight:600;color:var(--pf-ink)}
  .mgr-tab.active{background:linear-gradient(135deg,#F0F4FF,#EAF9F6);border-color:var(--pf-blue)}
  .mgr-tab.active .mgr-tab-icon{background:#fff;color:var(--pf-blue)}
  .mgr-tab.active .mgr-tab-label{color:var(--pf-blue-deep)}
  .mgr-tab-lock{display:block;margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:#8A6D00;background:#FFF3CD;border:1px solid #F0DE9E;border-radius:6px;padding:1px 5px}
  .mgr-tab.locked{opacity:.6}
  .mgr-tab.locked:hover{opacity:.85}
  .mgr-tab-lock-icon{display:inline-flex;vertical-align:-2px;margin-left:4px;color:#B26B00}
  .mgr-sections{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .mgr-section-btn{padding:9px 18px;border-radius:11px;border:1px solid var(--pf-line);background:#fff;font-size:12.5px;font-weight:600;color:var(--pf-ink-soft);cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s ease,color .15s ease}
  .mgr-section-btn:hover{color:var(--pf-ink)}
  .mgr-section-btn.active{background:var(--pf-blue-deep);color:#fff;border-color:var(--pf-blue-deep)}
  .hstat.clickable{cursor:pointer;transition:background .15s ease,transform .15s ease}
  .hstat.clickable:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
  @media(max-width:900px){.mgr-tabs{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:560px){.mgr-tabs{grid-template-columns:repeat(3,1fr)}}

  /* Panels / cards */
  .pf-card{background:#fff;border:1px solid var(--pf-line);border-radius:var(--pf-radius);padding:24px 26px;box-shadow:var(--pf-shadow);margin-bottom:16px;opacity:0;animation:panelIn .25s ease forwards}
  @keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.pf-card{animation:none;opacity:1}}
  .pf-card h3{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:4px}
  .pf-card .desc{color:var(--pf-ink-soft);font-size:12.5px;line-height:1.6;margin-bottom:16px;font-family:'Inter',sans-serif}
  .pf-btn{border:1px solid var(--pf-line);background:#fff;color:var(--pf-ink);padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:'Inter',sans-serif}
  .pf-btn:hover{border-color:#C9D3E6;box-shadow:0 4px 12px rgba(11,18,32,.06)}
  .pf-btn-save{background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:600;font-size:12.5px;box-shadow:0 6px 18px rgba(39,85,240,.28);cursor:pointer;font-family:'Inter',sans-serif}
  .pf-btn-save:disabled{opacity:.6}
  .pf-field{display:flex;flex-direction:column;gap:5px;font-family:'Inter',sans-serif}
  .pf-field label{font-size:11.5px;font-weight:600;color:var(--pf-ink-soft)}
  .pf-field input{padding:9px 12px;border:1px solid var(--pf-line);border-radius:10px;font-size:13px;font-family:inherit}

  /* Roster grid */
  .roster-toolbar{display:flex;justify-content:flex-end;margin-bottom:16px}
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .roster-card{background:#fff;border:1px solid var(--pf-line);border-radius:16px;padding:20px;box-shadow:var(--pf-shadow);transition:transform .15s ease,box-shadow .15s ease;font-family:'Inter',sans-serif}
  .roster-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(16,21,31,.14)}
  .roster-card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .roster-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pf-blue),#3E63F5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;font-family:'Fraunces',serif}
  .roster-name{font-size:14.5px;font-weight:600}
  .roster-niche{font-size:12px;color:var(--pf-ink-soft)}
  .roster-score-chip{font-size:10.5px;font-weight:700;color:var(--pf-blue-deep);background:#EEF2FF;border-radius:8px;padding:1px 7px;margin-left:4px;font-family:'IBM Plex Mono',monospace}
  .roster-risk-flag{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#B42318;background:#FDECEC;border-radius:8px;padding:5px 10px;margin-bottom:12px}
  .roster-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px;border-top:1px solid var(--pf-line)}
  .roster-stat-num{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
  .roster-stat-label{font-size:10px;color:var(--pf-ink-faint);text-transform:uppercase;letter-spacing:.03em}
  .roster-card-link{display:block;text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--pf-line);font-size:12px;font-weight:600;color:var(--pf-blue);text-decoration:none}
  .roster-card-link:hover{text-decoration:underline}
  .roster-card-link-disabled{color:var(--pf-ink-faint);cursor:default}
  .roster-card-link-disabled:hover{text-decoration:none}

  /* Trust score tab */
  .ts-big{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .ts-big .n{font-family:'Fraunces',serif;font-size:44px;font-weight:700;color:var(--pf-blue)}
  .ts-big .of{font-size:12.5px;color:var(--pf-ink-soft);font-family:'Inter',sans-serif}
  .ts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-top:18px;border-top:1px solid var(--pf-line);margin-top:18px}
  .ts-grid .v{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
  .ts-grid .l{font-size:10.5px;color:var(--pf-ink-faint);text-transform:uppercase;font-family:'Inter',sans-serif}
  .ts-formula{font-size:11px;color:var(--pf-ink-faint);margin-top:18px;padding-top:14px;border-top:1px solid var(--pf-line);font-family:'Inter',sans-serif}
  @media(max-width:560px){.ts-grid{grid-template-columns:repeat(2,1fr)}}

  .stat-row{display:flex;gap:24px;margin-bottom:20px;flex-wrap:wrap;font-family:'Inter',sans-serif}
  .stat-row .v{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
  .stat-row .l{font-size:11px;color:var(--pf-ink-soft);text-transform:uppercase}

  .empty-state{text-align:center;padding:50px 20px;color:var(--pf-ink-soft);font-family:'Inter',sans-serif}
  .empty-state svg{opacity:.3;margin-bottom:12px}
  .empty-state .t{font-size:14px;font-weight:600;color:var(--pf-ink);margin-bottom:6px;font-family:'Fraunces',serif}
  .empty-state .s{font-size:12.5px;max-width:340px;margin:0 auto}

  table{width:100%;border-collapse:collapse;font-size:12.5px;font-family:'Inter',sans-serif}
  th{text-align:left;padding:8px 6px;font-weight:600;color:var(--pf-ink-soft);border-bottom:1px solid var(--pf-line)}
  td{padding:8px 6px;border-bottom:1px solid var(--pf-line)}

  .staff-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--pf-line);font-family:'Inter',sans-serif}
  .staff-invite-row{display:flex;gap:8px;margin-top:16px}
  .staff-invite-row input{flex:1;padding:10px 12px;border:1px solid var(--pf-line);border-radius:10px;font-size:12.5px;font-family:'Inter',sans-serif}

  .lock-card{background:linear-gradient(135deg,#FFFBF0,#FAEEDA);border:1px solid #E8CE8F}
  .lock-card h3{color:#8A5B0A}
  .lock-card .desc{color:#8A6D00}
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount" class="sidebar"></div>
  <main class="app-main">
    <div id="content">
      <div class="ptitle">Agency</div>
      <div class="psub">Loading…</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=2"></script>
<script src="nav.js?v=4"></script>
<script>
let profile, manager, roster = [], staff = [], ledger = [], performance = [], benchmark = [], trustScore = null;
let financials = [], sponsorResults = [], sponsorQuery = '', sponsorSearched = false;
let activeTab = 'roster';

// CRM
let crmSelectedCreatorId = null, crmProfile = null, crmLoading = false;
// Sponsor portal
let portalLinks = [];
// Reminders & templates
let reminders = [], templates = [], templateFormOpen = false, editingTemplateId = null;
// Analytics
let rosterAnalytics = [], sponsorAnalytics = [], analyticsSubTab = 'creator';
// Disputes
let issues = [], issueFormOpen = false, issueStatusFilter = 'all';

const MGR_ICONS = {
  roster:'<circle cx="8.5" cy="8" r="3.2"/><circle cx="16.5" cy="8.5" r="2.6"/><path d="M2.3 20c0-3.4 2.8-6 6.2-6s6.2 2.6 6.2 6"/><path d="M14.8 14.2c3 .3 5.2 2.7 5.2 5.8"/>',
  trust:'<path d="M12 2.5l7.5 3.5v5.4c0 4.6-3.2 7.5-7.5 9.1-4.3-1.6-7.5-4.5-7.5-9.1V6z"/><path d="M8.7 12l2.4 2.4 4.2-4.6"/>',
  performance:'<path d="M4 20V13"/><path d="M10 20V7"/><path d="M16 20v-9"/><path d="M22 20H2"/>',
  ledger:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.5"/>',
  finances:'<path d="M12 2v20"/><path d="M17 5.5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  sponsors:'<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/><path d="M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/>',
  benchmark:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/>',
  branding:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>',
  staff:'<circle cx="9" cy="8" r="3.6"/><path d="M2.4 20.5c0-3.6 3-6.1 6.6-6.1s6.6 2.5 6.6 6.1"/><path d="M18.5 8.2h4M20.5 6.2v4"/>',
  crm:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 14h3"/><path d="M8 17h6"/>',
  portal:'<circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17"/><path d="M12 3a13 13 0 0 1 0 18a13 13 0 0 1 0-18"/>',
  reminders:'<path d="M12 21a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2z"/><path d="M18 8a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/>',
  analytics:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  disputes:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>',
};
function mgrIcon(name){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${MGR_ICONS[name]||''}</svg>`;
}

const AGENCY_TABS = [
  ['roster', 'Roster'],
  ['trust', 'Trust Score'],
  ['performance', 'Performance'],
  ['ledger', 'Payout Ledger'],
  ['finances', 'Finances'],
  ['sponsors', 'Sponsors'],
  ['benchmark', 'Rate Benchmark'],
  ['branding', 'Branding'],
  ['staff', 'Staff'],
  ['crm', 'Creator CRM'],
  ['portal', 'Sponsor Portal'],
  ['reminders', 'Reminders'],
  ['analytics', 'Analytics'],
  ['disputes', 'Disputes'],
];

// Tabs gated to manager.plan === 'agency'. Manager tier ($49/mo, capped at
// 5 active roster links -- enforced for real via RLS on
// manager_creator_links, not just client-side) covers day-to-day work on
// a small roster: Roster, Trust Score, Performance, Payout Ledger,
// Pipeline, Creator CRM, Reminders, Disputes. Agency tier ($149/mo,
// unlimited roster) adds the scale/team/client-facing layer: Finances,
// Sponsors, Rate Benchmark, Branding, Staff, Sponsor Portal, Analytics.
//
// NOTE ON ENFORCEMENT: benchmark/branding were already client-side-only
// gates (RLS still lets a Manager-plan account call fn_manager_rate_benchmark
// or update managers.agency_name/logo_url directly). Staff sub-seat
// invites now check manager.plan server-side as of this change
// (agency-staff-invite.js) -- that was the one with a real free-tier
// abuse path (unlimited free seats). Finances/Sponsors/Portal/Analytics
// are UI-gated the same way benchmark/branding always have been; making
// all of these RLS/RPC-enforced too is a reasonable next step once
// Stripe plan sync is wired up, not done here.
const AGENCY_ONLY_TABS = new Set(['finances', 'sponsors', 'benchmark', 'branding', 'staff', 'portal', 'analytics']);

// Grouped sub-nav: fixes the old single-row 14-tab strip being cramped
// and unordered. Grouping is by workflow, not by plan tier -- Manager and
// Agency tabs sit side by side within a section (locked ones just show
// the lock treatment below), since hiding the grouping logic behind plan
// tier would make the nav reshuffle on upgrade, which is more confusing
// than a couple of locked tabs in the right place.
const TAB_SECTIONS = [
  { key: 'roster_ops', label: 'Roster Ops', tabs: ['roster', 'trust', 'performance', 'crm', 'reminders', 'disputes'] },
  { key: 'finance', label: 'Finance', tabs: ['ledger', 'finances'] },
  { key: 'growth', label: 'Growth', tabs: ['sponsors', 'benchmark', 'analytics', 'portal', 'branding'] },
  { key: 'team', label: 'Team', tabs: ['staff'] },
];
function sectionForTab(tabKey) {
  return TAB_SECTIONS.find(s => s.tabs.includes(tabKey))?.key || TAB_SECTIONS[0].key;
}
let activeSection = sectionForTab(activeTab);

async function load() {
  profile = await requireRole('manager');
  if (!profile) return;
  renderSidebar('manager', 'agency');

  const { data: mgrRow } = await sb.rpc('fn_ensure_manager_row');
  manager = mgrRow || { plan: 'manager', agency_name: null };

  await loadRoster();
  await loadStaff();
  await loadLedger();
  await loadPerformance();
  await loadBenchmark();
  await loadTrustScore();
  await loadFinancials();
  await loadPortalLinks();
  await loadReminders();
  await loadTemplates();
  await loadRosterAnalytics();
  await loadSponsorAnalytics();
  await loadIssues();
  render();
}

async function loadPortalLinks() {
  const { data, error } = await sb.from('manager_portal_links')
    .select('id, label, creator_ids, token, created_at, revoked_at, expires_at')
    .order('created_at', { ascending: false });
  portalLinks = error ? [] : (data || []);
}

async function loadReminders() {
  const { data, error } = await sb.rpc('fn_manager_reminders');
  reminders = error ? [] : (data || []);
}

async function loadTemplates() {
  const { data, error } = await sb.from('manager_message_templates')
    .select('id, category, name, subject, body, created_at')
    .order('created_at', { ascending: false });
  templates = error ? [] : (data || []);
}

async function loadRosterAnalytics() {
  const { data, error } = await sb.rpc('fn_manager_roster_analytics');
  rosterAnalytics = error ? [] : (data || []);
}

async function loadSponsorAnalytics() {
  const { data, error } = await sb.rpc('fn_manager_sponsor_analytics');
  sponsorAnalytics = error ? [] : (data || []);
}

async function loadIssues() {
  const { data, error } = await sb.from('manager_issue_log')
    .select('id, creator_id, contract_id, sponsor_name, issue_type, description, evidence_urls, status, resolution_notes, created_at, resolved_at, profiles:creator_id(display_name)')
    .order('created_at', { ascending: false });
  issues = error ? [] : (data || []);
}

async function loadFinancials() {
  const { data, error } = await sb.rpc('fn_manager_deal_financials');
  financials = error ? [] : (data || []);
}

async function searchSponsors(query) {
  sponsorQuery = query;
  sponsorSearched = true;
  const { data, error } = await sb.rpc('fn_manager_sponsor_lookup', { p_query: query || null });

async function loadStaff() {

async function loadRoster() {
  const { data: links } = await sb.from('manager_creator_links')
    .select('creator_id, created_at, creators(niche, trust_score, plan, slug, profiles(display_name))')
    .eq('manager_id', profile.id)
    .eq('status', 'active');

  roster = links || [];

  // Command center stats -- one RPC call for the whole roster (deadlines,
  // overdue deliverables, revenue this month) instead of the old N+1
  // Promise.all of per-creator count queries.
  const { data: cc } = await sb.rpc('fn_manager_roster_command_center');
  const ccByCreator = Object.fromEntries((cc || []).map(row => [row.creator_id, row]));
  roster.forEach(r => {
    const c = ccByCreator[r.creator_id];
    r.activeContracts = c?.active_deals || 0;
    r.pendingApplications = c?.pending_briefs || 0;
    r.nextDeadline = c?.next_deadline || null;
    r.overdueCount = c?.overdue_count || 0;
    r.revenueThisMonthCents = c?.revenue_this_month_cents || 0;
  });
}

function csvEscape(val) {
  const s = String(val ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

async function exportAuditTrail() {
  const { data: rows, error } = await sb.rpc('fn_manager_audit_trail');
  if (error) { alert('Could not export audit trail: ' + error.message); return; }

  const csvRows = [['Date', 'Type', 'Actor', 'Subject', 'Detail', 'Status']];
  (rows || []).forEach(r => {
    csvRows.push([
      new Date(r.event_date).toISOString(),
      r.event_type,
      r.actor_name || '',
      r.subject_name || '',
      r.detail || '',
      r.status || '',
    ]);
  });

  const csv = csvRows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `agency-audit-trail-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function fmtDeadline(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((d - today) / 86400000);
  const label = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  if (diffDays < 0) return `${label} (${Math.abs(diffDays)}d overdue)`;
  if (diffDays === 0) return `${label} (today)`;
  return label;
}

async function scanRosterExclusivity() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;

  resultsEl.innerHTML = '';

  try {
    const { data: { session } } = await sb.auth.getSession();

      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({}),
    });
    const result = await res.json();
    if (!res.ok) { resultsEl.innerHTML = `<div class="msg error">${escapeHtml(result.error || 'Scan failed.')}</div>`; return; }

    if (!result.results || !result.results.length) {
      resultsEl.innerHTML = `<div class="msg ok">Scanned ${result.scannedCreators || 0} creator(s) — no exclusivity conflicts found. This checks each creator's own signed contracts against each other, not conflicts between different creators on your roster.</div>`;

async function updateFinancials(contractId, field, value) {
  const payload = { contract_id: contractId, [field]: field === 'commission_pct' ? Number(value) : field === 'expenses_cents' ? Number(value) : value };
  // Need manager_id + all NOT NULL-safe fields on first insert -- upsert
  // with onConflict on the unique contract_id column, letting the DB
  // defaults fill anything not passed here on a fresh row.
  const existing = financials.find(f => f.contract_id === contractId);
  const row = {
    contract_id: contractId,
    manager_id: manager.id,
    commission_pct: field === 'commission_pct' ? Number(value) : existing.commission_pct,
    expenses_cents: field === 'expenses_cents' ? Number(value) : existing.expenses_cents,
    invoice_status: field === 'invoice_status' ? value : existing.invoice_status,
  };
  if (field === 'invoice_status') {
    if (value === 'invoiced') row.invoice_sent_at = new Date().toISOString();
    if (value === 'paid') row.invoice_paid_at = new Date().toISOString();
  }
  const { error } = await sb.from('manager_deal_financials').upsert(row, { onConflict: 'contract_id' });
  const el = document.getElementById('financeMsg');
  if (error) { if (el) el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
  await loadFinancials();

async function inviteStaff() {
  const email = document.getElementById('staffEmail').value.trim();
  if (!email) { showStaffMsg('Enter an email address.', 'error'); return; }
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/team?action=invite-staff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ email }),
  });
  const result = await res.json();
  if (!res.ok) { showStaffMsg(result.error || 'Could not send invite.', 'error'); return; }
  showStaffMsg(result.message, 'ok');
  await loadStaff();
  render();
}

async function revokeStaff(staffLinkId) {
  if (!confirm('Revoke this staff member\u2019s access?')) return;
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/api/team?action=revoke-staff', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ staffLinkId }),
  });
  const result = await res.json();
  if (!res.ok) { showStaffMsg(result.error || 'Could not revoke access.', 'error'); return; }
  await loadStaff();
  render();
}

function showStaffMsg(text, type) {
  const el = document.getElementById('staffMsg');
  if (el) el.innerHTML = `<div class="msg ${type}">${escapeHtml(text)}</div>`;
}

function switchSection(key) {
  activeSection = key;
  const sec = TAB_SECTIONS.find(s => s.key === key);
  if (sec && !sec.tabs.includes(activeTab)) activeTab = sec.tabs[0];
  render();
}

function switchTab(key) {
  activeTab = key;
  activeSection = sectionForTab(key);
  render();
}

            ${roster.map(r => `
              <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-family:'Inter',sans-serif;border:1px solid var(--pf-line);border-radius:8px;padding:6px 10px">
                <input type="checkbox" class="portalCreatorCheck" value="${r.creator_id}"> ${escapeHtml(r.creators?.profiles?.display_name || 'Unnamed')}
              </label>`).join('') || '<span style="font-size:12px;color:var(--pf-ink-soft)">No creators on your roster yet.</span>'}
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end"><button class="pf-btn-save" onclick="createPortalLink()">Generate link</button></div>
      <div id="portalMsg"></div>
    </div>
    <div class="pf-card">
      <h3>Active links</h3>
      ${!portalLinks.length ? '<div style="font-size:12.5px;color:var(--pf-ink-soft);font-family:\'Inter\',sans-serif">No portal links yet.</div>' : portalLinks.map(l => {
        const isExpired = l.expires_at && new Date(l.expires_at) <= new Date();
        const isDead = l.revoked_at || isExpired;
        const statusLabel = l.revoked_at ? '(revoked)' : isExpired ? '(expired)' : '';
        const expiryLine = l.expires_at ? `expires ${new Date(l.expires_at).toLocaleDateString()}` : 'no expiry';
        return `
        <div style="padding:12px 0;border-top:1px solid var(--pf-line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:'Inter',sans-serif">
          <div>
            <div style="font-size:13px;font-weight:600">${escapeHtml(l.label)} ${statusLabel ? `<span style="color:#B42318;font-weight:600;font-size:11px">${statusLabel}</span>` : ''}</div>
            <div style="font-size:11.5px;color:var(--pf-ink-soft)">${l.creator_ids.length} creator(s) · created ${new Date(l.created_at).toLocaleDateString()} · ${expiryLine}</div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0">
            ${!isDead ? `<button class="pf-btn" onclick="copyPortalLink('${l.token}')">Copy link</button><button class="pf-btn" style="color:#B42318" onclick="revokePortalLink('${l.id}')">Revoke</button>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

async function createPortalLink() {
  const label = document.getElementById('portalLabel').value.trim();
  const creatorIds = Array.from(document.querySelectorAll('.portalCreatorCheck:checked')).map(el => el.value);
  const el = document.getElementById('portalMsg');
  if (!label) { el.innerHTML = `<div class="msg error">Add a label.</div>`; return; }
  if (!creatorIds.length) { el.innerHTML = `<div class="msg error">Pick at least one creator.</div>`; return; }
  const expiryInput = document.getElementById('portalExpiry').value;
  const expiresAt = expiryInput ? new Date(expiryInput + 'T23:59:59').toISOString() : null;
  const { error } = await sb.from('manager_portal_links').insert({ manager_id: manager.id, label, creator_ids: creatorIds, expires_at: expiresAt });
  if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
  el.innerHTML = `<div class="msg ok">Link created.</div>`;
  document.getElementById('portalLabel').value = '';
  document.getElementById('portalExpiry').value = '';
  await loadPortalLinks();
  render();
}

function copyPortalLink(token) {
  const url = `${window.location.origin}/portal.html?token=${token}`;
  navigator.clipboard.writeText(url);
  const el = document.getElementById('portalMsg');
  if (el) el.innerHTML = `<div class="msg ok">Link copied to clipboard.</div>`;
}

async function revokePortalLink(id) {
  if (!confirm('Revoke this portal link? It will stop working immediately.')) return;
  await sb.from('manager_portal_links').update({ revoked_at: new Date().toISOString() }).eq('id', id);
  await loadPortalLinks();
  render();
}

/* ============================================================
   8. Automated reminders & templates
   ============================================================ */
const REMINDER_LABELS = { deliverable: 'Deliverable', approval: 'Awaiting approval', invoice: 'Invoice', payment: 'Payment' };
const SEVERITY_COLOR = { overdue: '#B42318', action_needed: '#B42318', upcoming: '#B26B00', pending: '#B26B00' };

function renderRemindersTab() {
  return `
    <div class="pf-card">
      <h3>Action items</h3>
      <div class="desc">Auto-surfaced from your roster's real deadlines, approvals, and invoices — nothing is emailed on your behalf, this just keeps everything that needs attention in one place.</div>
      ${!reminders.length ? '<div style="font-size:12.5px;color:var(--pf-ink-soft);font-family:\'Inter\',sans-serif">Nothing needs attention right now.</div>' : reminders.map(r => `
        <div style="padding:10px 0;border-top:1px solid var(--pf-line);display:flex;justify-content:space-between;gap:12px;font-family:'Inter',sans-serif">
          <div>
            <span class="badge-pill" style="background:#F3F5FA;color:${SEVERITY_COLOR[r.severity] || 'var(--pf-ink-soft)'};border:1px solid var(--pf-line);padding:3px 9px;font-size:10.5px;margin-right:8px">${REMINDER_LABELS[r.reminder_type] || r.reminder_type}</span>
            <span style="font-size:12.5px">${escapeHtml(r.detail || '')} <span style="color:var(--pf-ink-faint)">— ${escapeHtml(r.creator_name || '')}</span></span>
          </div>
          <div style="font-size:11.5px;color:${SEVERITY_COLOR[r.severity] || 'var(--pf-ink-soft)'};white-space:nowrap">${r.due_date ? fmtDeadline(r.due_date) : ''}</div>
        </div>`).join('')}
    </div>
    <div class="pf-card">
      <h3>Message templates</h3>
      <div class="desc">Reusable text for outreach, revision requests, and late-payment notices. Copy and paste into email or DMs.</div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="pf-btn" onclick="openTemplateForm()">${templateFormOpen ? 'Cancel' : '+ New template'}</button></div>
      ${templateFormOpen ? renderTemplateForm() : ''}
      ${!templates.length ? '<div style="font-size:12.5px;color:var(--pf-ink-soft);font-family:\'Inter\',sans-serif">No templates yet.</div>' : templates.map(t => `
        <div style="padding:12px 0;border-top:1px solid var(--pf-line);font-family:'Inter',sans-serif">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <span style="font-weight:600;font-size:13px">${escapeHtml(t.name)}</span>
              <span class="badge-pill" style="background:#F3F5FA;color:var(--pf-ink-soft);border:1px solid var(--pf-line);padding:2px 8px;font-size:10px;margin-left:8px;text-transform:capitalize">${escapeHtml(t.category.replace('_', ' '))}</span>
            </div>
            <div style="display:flex;gap:8px">
              <button class="pf-btn" onclick="copyTemplate('${t.id}')">Copy</button>
              <button class="pf-btn" onclick="openTemplateForm('${t.id}')">Edit</button>
              <button class="pf-btn" style="color:#B42318" onclick="deleteTemplate('${t.id}')">Delete</button>
            </div>
          </div>
          ${t.subject ? `<div style="font-size:11.5px;color:var(--pf-ink-soft);margin-top:6px">Subject: ${escapeHtml(t.subject)}</div>` : ''}
          <div style="font-size:12px;color:var(--pf-ink-soft);margin-top:4px;white-space:pre-wrap">${escapeHtml(t.body)}</div>
        </div>`).join('')}
    </div>`;
}

function renderTemplateForm() {
  const t = editingTemplateId ? templates.find(x => x.id === editingTemplateId) : null;
  return `
    <div class="pf-card" style="background:#F8F9FC;box-shadow:none;border:1px solid var(--pf-line);animation:none;opacity:1">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="pf-field"><label>Name</label><input id="tplName" type="text" value="${escapeHtml(t?.name || '')}" placeholder="e.g. Late payment notice"></div>
        <div class="pf-field"><label>Category</label>
          <select id="tplCategory">
            ${['outreach', 'revision_request', 'late_payment', 'deadline_reminder', 'approval_request', 'other'].map(c => `<option value="${c}" ${t?.category === c ? 'selected' : ''}>${c.replace('_', ' ')}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="pf-field" style="margin-bottom:10px"><label>Subject (optional)</label><input id="tplSubject" type="text" value="${escapeHtml(t?.subject || '')}"></div>
      <div class="pf-field" style="margin-bottom:10px"><label>Body</label><textarea id="tplBody" rows="5">${escapeHtml(t?.body || '')}</textarea></div>
      <div style="display:flex;justify-content:flex-end"><button class="pf-btn-save" onclick="saveTemplate()">${t ? 'Save changes' : 'Create'}</button></div>
      <div id="tplMsg"></div>
    </div>`;
}

function openTemplateForm(id) {
  if (id) {
    editingTemplateId = id;
    templateFormOpen = true;
  } else if (templateFormOpen && !editingTemplateId) {
    templateFormOpen = false;
  } else {
    editingTemplateId = null;
    templateFormOpen = true;
  }
  render();
}

async function saveTemplate() {
  const row = {
    manager_id: manager.id,
    name: document.getElementById('tplName').value.trim(),
    category: document.getElementById('tplCategory').value,
    subject: document.getElementById('tplSubject').value.trim() || null,
    body: document.getElementById('tplBody').value.trim(),
  };
  const el = document.getElementById('tplMsg');
  if (!row.name || !row.body) { el.innerHTML = `<div class="msg error">Name and body are required.</div>`; return; }
  const { error } = editingTemplateId
    ? await sb.from('manager_message_templates').update(row).eq('id', editingTemplateId)
    : await sb.from('manager_message_templates').insert(row);
  if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
  templateFormOpen = false;
  editingTemplateId = null;
  await loadTemplates();
  render();
}

function copyTemplate(id) {
  const t = templates.find(x => x.id === id);
  if (!t) return;
  navigator.clipboard.writeText((t.subject ? `Subject: ${t.subject}\n\n` : '') + t.body);
}

async function deleteTemplate(id) {
  if (!confirm('Delete this template?')) return;
  await sb.from('manager_message_templates').delete().eq('id', id);
  await loadTemplates();
  render();
}

/* ============================================================
   9. Roster performance analytics
   ============================================================ */
function renderAnalyticsTab() {
  if (manager.plan !== 'agency') {
    return `
      <div class="pf-card lock-card">
        <h3>Roster performance analytics</h3>
        <div class="desc" style="margin-bottom:0">This is an Agency-plan feature. Revenue, on-time delivery, and repeat-booking breakdowns by creator, sponsor, and campaign — built for optimizing a bigger roster and proving ROI to sponsors.</div>
      </div>`;
  }
  return `
    <div class="pf-card">
      <h3>Roster performance analytics</h3>
      <div class="desc">Real revenue, delivery, and repeat-booking data from your roster's signed contracts. Trust and reliability scores stand in for audience engagement here — Kitscore doesn't track a per-deal engagement figure.</div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        ${['creator', 'sponsor', 'campaign'].map(k => `<button class="pf-btn${analyticsSubTab === k ? ' active' : ''}" style="${analyticsSubTab === k ? 'background:var(--pf-blue);color:#fff;border-color:var(--pf-blue)' : ''}" onclick="setAnalyticsSubTab('${k}')">By ${k}</button>`).join('')}
      </div>
      ${analyticsSubTab === 'creator' ? renderAnalyticsByCreator() : ''}
      ${analyticsSubTab === 'sponsor' ? renderAnalyticsBySponsor() : ''}
      ${analyticsSubTab === 'campaign' ? renderAnalyticsByCampaign() : ''}
    </div>`;
}

function setAnalyticsSubTab(k) { analyticsSubTab = k; render(); }

function renderAnalyticsByCreator() {
  if (!rosterAnalytics.length) return '<div style="font-size:12.5px;color:var(--pf-ink-soft);font-family:\'Inter\',sans-serif">No verified deals on your roster yet.</div>';
  const topId = rosterAnalytics[0]?.creator_id;
  return `
    <table><thead><tr><th>Creator</th><th>Verified deals</th><th>Revenue</th><th>On-time rate</th><th>Repeat sponsors</th><th>Trust</th><th>Reliability</th></tr></thead><tbody>
      ${rosterAnalytics.map(r => `
        <tr>
          <td>${escapeHtml(r.creator_name)} ${r.creator_id === topId ? '<span class="badge-pill" style="background:#FFF4D9;color:#8A5A00;border:1px solid #F0D590;padding:2px 8px;font-size:10px;margin-left:6px">Top performer</span>' : ''}</td>
          <td>${r.verified_deals}</td>
          <td>${fmtMoney(r.total_revenue_cents)}</td>
          <td>${r.on_time_rate != null ? r.on_time_rate + '%' : '—'}</td>
          <td>${r.repeat_bookings}</td>
          <td>${r.trust_score ?? '—'}</td>
          <td>${r.reliability_score ?? '—'}</td>
        </tr>`).join('')}
    </tbody></table>`;
}

function renderAnalyticsBySponsor() {
  if (!sponsorAnalytics.length) return '<div style="font-size:12.5px;color:var(--pf-ink-soft);font-family:\'Inter\',sans-serif">No verified deals with sponsors yet.</div>';
  return `
    <table><thead><tr><th>Sponsor</th><th>Deals</th><th>Revenue</th><th>Creators worked with</th></tr></thead><tbody>
      ${sponsorAnalytics.map(s => `<tr><td>${escapeHtml(s.sponsor_name)}</td><td>${s.deals_count}</td><td>${fmtMoney(s.total_revenue_cents)}</td><td>${s.creators_worked_with}</td></tr>`).join('')}
    </tbody></table>`;
}

function renderAnalyticsByCampaign() {
  if (!financials.length) return '<div style="font-size:12.5px;color:var(--pf-ink-soft);font-family:\'Inter\',sans-serif">No campaigns on record yet.</div>';
  return `
    <table><thead><tr><th>Campaign</th><th>Creator</th><th>Sponsor</th><th>Status</th></tr></thead><tbody>
      ${financials.map(f => `<tr><td>${escapeHtml(f.title || 'Untitled')}</td><td>${escapeHtml(f.creator_name || '—')}</td><td>${escapeHtml(f.sponsor_name || '—')}</td><td style="text-transform:capitalize">${escapeHtml(f.status || '')}</td></tr>`).join('')}
    </tbody></table>`;
}

/* ============================================================
   10. Dispute & issue management
   ============================================================ */
const ISSUE_TYPE_LABELS = { late_payment: 'Late payment', excessive_revisions: 'Excessive revisions', missed_deadline: 'Missed deadline', communication: 'Communication', scope_dispute: 'Scope dispute', other: 'Other' };
const ISSUE_STATUS_COLOR = { open: '#B26B00', investigating: '#2755F0', resolved: '#137C52', escalated: '#B42318' };

function renderDisputesTab() {
  const filtered = issueStatusFilter === 'all' ? issues : issues.filter(i => i.status === issueStatusFilter);
  return `
    <div class="pf-card">
      <h3>Dispute & issue log</h3>
      <div class="desc">Your own tracking log for issues with sponsors — late payments, excessive revisions, missed deadlines. This is separate from Kitscore's formal escrow dispute process, which only the creator or sponsor on a contract can open directly from that contract's page.</div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="pf-btn" onclick="openIssueForm()">${issueFormOpen ? 'Cancel' : '+ Log an issue'}</button></div>
      ${issueFormOpen ? renderIssueForm() : ''}
      <div style="display:flex;gap:8px;margin-bottom:12px">
        ${['all', 'open', 'investigating', 'resolved', 'escalated'].map(s => `<button class="pf-btn" style="${issueStatusFilter === s ? 'background:var(--pf-blue);color:#fff;border-color:var(--pf-blue)' : ''};text-transform:capitalize" onclick="setIssueFilter('${s}')">${s}</button>`).join('')}
      </div>
      ${!filtered.length ? '<div style="font-size:12.5px;color:var(--pf-ink-soft);font-family:\'Inter\',sans-serif">No issues logged.</div>' : filtered.map(i => `
        <div style="padding:12px 0;border-top:1px solid var(--pf-line);font-family:'Inter',sans-serif">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
            <div>
              <span class="badge-pill" style="background:#F3F5FA;color:${ISSUE_STATUS_COLOR[i.status]};border:1px solid var(--pf-line);padding:3px 9px;font-size:10.5px;text-transform:capitalize">${i.status}</span>
              <span style="font-weight:600;font-size:13px;margin-left:8px">${ISSUE_TYPE_LABELS[i.issue_type] || i.issue_type}</span>
              <span style="font-size:12px;color:var(--pf-ink-faint)"> — ${escapeHtml(i.profiles?.display_name || '')} × ${escapeHtml(i.sponsor_name)}</span>
            </div>
            <span style="font-size:11px;color:var(--pf-ink-faint);white-space:nowrap">${new Date(i.created_at).toLocaleDateString()}</span>
          </div>
          <div style="font-size:12.5px;color:var(--pf-ink-soft);margin-top:6px">${escapeHtml(i.description)}</div>
          ${i.evidence_urls && i.evidence_urls.length ? `<div style="font-size:11.5px;margin-top:6px">${i.evidence_urls.map(u => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener" style="color:var(--pf-blue);margin-right:10px">Evidence ↗</a>`).join('')}</div>` : ''}
          ${i.resolution_notes ? `<div style="font-size:12px;color:var(--pf-ink-soft);margin-top:6px;font-style:italic">Resolution: ${escapeHtml(i.resolution_notes)}</div>` : ''}
          ${i.status !== 'resolved' ? `
          <div style="display:flex;gap:8px;margin-top:8px">
            ${i.status !== 'investigating' ? `<button class="pf-btn" onclick="setIssueStatus('${i.id}','investigating')">Mark investigating</button>` : ''}
            ${i.status !== 'escalated' ? `<button class="pf-btn" onclick="setIssueStatus('${i.id}','escalated')">Escalate</button>` : ''}
            <button class="pf-btn" onclick="resolveIssue('${i.id}')">Mark resolved</button>
          </div>` : ''}
        </div>`).join('')}
    </div>`;
}

function renderIssueForm() {
  return `
    <div class="pf-card" style="background:#F8F9FC;box-shadow:none;border:1px solid var(--pf-line);animation:none;opacity:1">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="pf-field"><label>Creator</label>
          <select id="issueCreator">${roster.map(r => `<option value="${r.creator_id}">${escapeHtml(r.creators?.profiles?.display_name || 'Unnamed')}</option>`).join('')}</select>
        </div>
        <div class="pf-field"><label>Sponsor name</label><input id="issueSponsor" type="text" placeholder="Sponsor / brand"></div>
      </div>
      <div class="pf-field" style="margin-bottom:10px"><label>Issue type</label>
        <select id="issueType">${Object.entries(ISSUE_TYPE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      </div>
      <div class="pf-field" style="margin-bottom:10px"><label>Description</label><textarea id="issueDesc" rows="3"></textarea></div>
      <div class="pf-field" style="margin-bottom:10px"><label>Evidence URL (optional)</label><input id="issueEvidence" type="url" placeholder="Link to screenshot, email, etc."></div>
      <div style="display:flex;justify-content:flex-end"><button class="pf-btn-save" onclick="createIssue()">Log issue</button></div>
      <div id="issueMsg"></div>
    </div>`;
}

function openIssueForm() { issueFormOpen = !issueFormOpen; render(); }
function setIssueFilter(s) { issueStatusFilter = s; render(); }

async function createIssue() {
  const el = document.getElementById('issueMsg');
  const sponsor_name = document.getElementById('issueSponsor').value.trim();
  const description = document.getElementById('issueDesc').value.trim();
  if (!sponsor_name || !description) { el.innerHTML = `<div class="msg error">Sponsor name and description are required.</div>`; return; }
  const evidence = document.getElementById('issueEvidence').value.trim();
  const row = {
    manager_id: manager.id,
    creator_id: document.getElementById('issueCreator').value,
    sponsor_name,
    issue_type: document.getElementById('issueType').value,
    description,
    evidence_urls: evidence ? [evidence] : [],
  };
  const { error } = await sb.from('manager_issue_log').insert(row);
  if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
  issueFormOpen = false;
  await loadIssues();
  render();
}

async function setIssueStatus(id, status) {
  await sb.from('manager_issue_log').update({ status }).eq('id', id);
  await loadIssues();
  render();
}

async function resolveIssue(id) {
  const resolution_notes = prompt('Resolution notes (optional):') || null;
  await sb.from('manager_issue_log').update({ status: 'resolved', resolution_notes, resolved_at: new Date().toISOString() }).eq('id', id);
  await loadIssues();
  render();
}

load();
</script>
